[package]
name = "codex-agents-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "codex-sdk-runtime"
path = "rust/runtime.rs"

[[bin]]
name = "codex-code-mode-host"
path = "rust/code_mode_host.rs"

[[example]]
name = "exec-server-fixture"
path = "tests/fixtures/exec_server.rs"

[dev-dependencies]
pretty_assertions = "=1.4.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "client-proxy", "http1", "tokio"] }

[dependencies]
codex-api = { path = ".upstream/codex/codex-rs/codex-api" }
codex-http-client = { path = ".upstream/codex/codex-rs/http-client" }
codex-models-manager = { path = ".upstream/codex/codex-rs/models-manager" }
base64 = "=0.22.1"
bytes = "=1.12.1"
chrono = "0.4"
http = "=1.4.0"
tokio-util = { version = "=0.7.18", features = ["rt"] }
url = "=2.5.8"
anyhow = "1"
codex-agent-graph-store = { path = ".upstream/codex/codex-rs/agent-graph-store" }
codex-app-server-protocol = { path = ".upstream/codex/codex-rs/app-server-protocol" }
codex-backend-client = { path = ".upstream/codex/codex-rs/backend-client" }
codex-core-api = { path = ".upstream/codex/codex-rs/core-api" }
codex-exec-server = { path = ".upstream/codex/codex-rs/exec-server" }
codex-file-system = { path = ".upstream/codex/codex-rs/file-system" }
codex-core = { path = ".upstream/codex/codex-rs/core" }
codex-protocol = { path = ".upstream/codex/codex-rs/protocol" }
codex-config = { path = ".upstream/codex/codex-rs/config" }
codex-extension-api = { path = ".upstream/codex/codex-rs/ext/extension-api" }
codex-history = { path = ".upstream/codex/codex-rs/history" }
codex-rollout = { path = ".upstream/codex/codex-rs/rollout" }
codex-state = { path = ".upstream/codex/codex-rs/state" }
codex-thread-store = { path = ".upstream/codex/codex-rs/thread-store" }
codex-tools = { path = ".upstream/codex/codex-rs/tools" }
codex-arg0 = { path = ".upstream/codex/codex-rs/arg0" }
codex-async-utils = { path = ".upstream/codex/codex-rs/async-utils" }
codex-history-notes-extension = { path = ".upstream/codex/codex-rs/ext/history-notes" }
codex-goal-extension = { path = ".upstream/codex/codex-rs/ext/goal" }
codex-git-attribution = { path = ".upstream/codex/codex-rs/ext/git-attribution" }
codex-git-utils = { path = ".upstream/codex/codex-rs/git-utils" }
codex-guardian-v2 = { path = ".upstream/codex/codex-rs/ext/guardian-v2" }
codex-mcp-extension = { path = ".upstream/codex/codex-rs/ext/mcp" }
codex-mcp = { path = ".upstream/codex/codex-rs/codex-mcp" }
codex-model-provider = { path = ".upstream/codex/codex-rs/model-provider" }
codex-web-search-extension = { path = ".upstream/codex/codex-rs/ext/web-search" }
codex-image-generation-extension = { path = ".upstream/codex/codex-rs/ext/image-generation" }
codex-skills-extension = { path = ".upstream/codex/codex-rs/ext/skills" }
codex-otel = { path = ".upstream/codex/codex-rs/otel" }
codex-login = { path = ".upstream/codex/codex-rs/login" }
codex-code-mode = { path = ".upstream/codex/codex-rs/code-mode" }
codex-code-mode-host = { path = ".upstream/codex/codex-rs/code-mode-host" }
codex-execpolicy = { path = ".upstream/codex/codex-rs/execpolicy" }
codex-utils-path-uri = { path = ".upstream/codex/codex-rs/utils/path-uri" }
futures-core = "0.3"
futures-util = "0.3"
globset = "0.4"
regex = "1"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1"
sha2 = "0.10"
tempfile = "3"
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "3e636cab26c013eca5131103c03d20237f12c4df", version = "=3.3.0", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
toml = "0.9.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."https://github.com/modelcontextprotocol/rust-sdk"]
rmcp = { path = ".upstream/rust-sdk/crates/rmcp" }
rmcp-macros = { path = ".upstream/rust-sdk/crates/rmcp-macros" }

[profile.dev]
debug = 0

[profile.release]
debug = 0
lto = "thin"
codegen-units = 4
