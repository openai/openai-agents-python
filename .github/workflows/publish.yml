name: Publish to PyPI

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'openai/openai-agents-python'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest

    steps:
      # Tag rules and environment protection remain the release authorization boundary.
      - name: Checkout release validator from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          path: control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python for release validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Validate release provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          python -I control/.github/scripts/verify_release.py
          --repo release-source --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
      - name: Verify human-reviewed release candidate
        if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python -I control/.github/scripts/release_automation.py verify-publication
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.14"
          enable-cache: false
          python-version: "3.14"
      - name: Check release lock
        working-directory: release-source
        env:
          UV_LOCKED: "1"
        run: uv lock --check
      - name: Verify qualified release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -I control/.github/scripts/release_automation.py qualify-distributions

  build:
    # Assemble distributions on a fresh runner after release qualification.
    needs: checks
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      # Tag rules and environment protection remain the release authorization boundary.
      - name: Checkout release validator from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          path: control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python for release validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Validate release provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          python -I control/.github/scripts/verify_release.py
          --repo release-source --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
      - name: Collect qualified release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -I control/.github/scripts/release_automation.py qualify-distributions
          --output-dir release-source/dist
      - name: Store distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: release-source/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    # Public v1 starts with source builds only. Enable publishing in a reviewed release change.
    if: ${{ false }}
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/openai-agents
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - name: Checkout approval validator from main
        if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          path: control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Revalidate human approval before upload
        if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 -I control/.github/scripts/release_automation.py verify-publication
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  release-notes:
    needs: checks
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Append reviewed highlights and release assessment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python -I .github/scripts/release_automation.py publish-notes
