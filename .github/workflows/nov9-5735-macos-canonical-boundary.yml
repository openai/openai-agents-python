          ICBpbWFnZV9wYXRoID0gc3RyKGN3ZCAvIGYie3ByZWZpeH1waXhlbC5wbmciKSBpZiBhYnNvbHV0
          ZSBlbHNlIGYie3ByZWZpeH1waXhlbC5wbmciCiAgICAgcmVzcG9uc2VzLnJlcGxpZXMuZXh0ZW5k
          KAogICAgICAgICBbCiAgICAgICAgICAgICBbZnVuY3Rpb25fY2FsbCgicmVhZF90ZXh0X2ZpbGUi
          LCB7InBhdGgiOiB0ZXh0X3BhdGh9LCAidGV4dC0xIildLAo=
          STABLE_PATCH
          printf '%s  %s\n' 39b596118725f27beb47347b8e4d5049bd687ebd263c0787b39309e38fd29842 "$ALIAS_STAGE/stable.patch" | shasum -a 256 -c -
          git -C draft apply --check "$ALIAS_STAGE/stable.patch"
          git -C draft apply "$ALIAS_STAGE/stable.patch"
          fixture=packages/codex/tests/test_native_project_guidance.py
          test "$(git -C draft diff --name-only)" = "$fixture"
          printf '%s  %s\n' 6ee2664a32de71e19013ad5fa30669240b03d00c7589dc8f216c81bb56f31198 "draft/$fixture" | shasum -a 256 -c -
      - name: Install the wheel with frozen test dependencies
        run: |
          set -euo pipefail
          work="$ALIAS_STAGE/draft"
          uv export --directory draft --frozen --no-default-groups --group pgo \
            --no-emit-project --format requirements-txt --output-file "$work/requirements.txt" --quiet
          uv venv --python 3.14.10 "$work/venv"
          uv pip install --python "$work/venv/bin/python" --require-hashes --only-binary :all: -r "$work/requirements.txt"
          uv pip install --python "$work/venv/bin/python" --no-deps --only-binary :all: "$work/$WHEEL"
      - name: Verify in-grant absolute and physical outside reads
        run: |
          set -euo pipefail
          work="$ALIAS_STAGE/draft"
          mkdir -m 700 -p "$work/home/codex" "$work/tmp"
          cat > "$ALIAS_STAGE/check.py" <<'CHECK'
          import hashlib
          import json
          import runpy
          import sys
          import sysconfig
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import pytest
          from _agents_codex import session
          from agents import _native

          lane, stage_arg = sys.argv[1:]
          stage = Path(stage_arg)
          verifier = runpy.run_path("packages/codex/scripts/verify_installed.py")
          installed = verifier["installed_distribution"]()
          assert _native.CODEX_REVISION == verifier["EXPECTED_PIN"]
          platlib = Path(sysconfig.get_path("platlib")).resolve()
          assert Path(session.__file__).resolve().is_relative_to(platlib)
          expected = json.loads((stage / "identity.json").read_text())[lane]
          for name, digest in expected["native_products"].items():
              with (platlib / name).open("rb") as stream:
                  assert hashlib.file_digest(stream, "sha256").hexdigest() == digest, name
          print(f"{lane}: installed {json.dumps(installed, sort_keys=True)}", flush=True)

          cases = [
              "test_local_project_guidance_alias_read_boundary[canonical-None-True-True-True]",
              "test_local_project_guidance_alias_read_boundary[outside-None-False-False-False]",
          ]
          work = stage / lane
          report = work / "junit.xml"
          fixture = "packages/codex/tests/test_native_project_guidance.py"
          result = pytest.main([
              "-q", "-rA", "-p", "pytest_asyncio.plugin", "-p", "no:cacheprovider",
              "-o", "pythonpath=packages/codex", "--basetemp", str(work / "pytest"),
              "--junitxml", str(report), *(f"{fixture}::{case}" for case in cases),
          ])
          rows = ET.parse(report).findall(".//testcase")
          assert sorted(row.get("name") for row in rows) == sorted(cases)
          statuses = {}
          for row in rows:
              status = next((tag for tag in ("error", "failure", "skipped") if row.find(tag) is not None), "passed")
              statuses[row.attrib["name"]] = status
          print(f"{lane}: {json.dumps(statuses, sort_keys=True)}", flush=True)
          sys.exit(1 if result or any(status != "passed" for status in statuses.values()) else 0)
          CHECK
          cd draft
          env -i PATH="$work/venv/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            HOME="$work/home" CODEX_HOME="$work/home/codex" TMPDIR="$work/tmp" \
            LC_ALL=C OPENAI_AGENTS_DISABLE_TRACING=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$work/venv/bin/python" -I -B "$ALIAS_STAGE/check.py" draft "$ALIAS_STAGE"
