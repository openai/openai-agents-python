name: Stock macOS XPC named lookup inspection

on:
  push:
    branches:
      - diagnostics/nov9-stock-xpc-decode-a12
    paths:
      - .github/workflows/stock-xpc-named-auth-path.yml

permissions:
  contents: read

jobs:
  inspect-stock-libxpc:
    runs-on: macos-15
    timeout-minutes: 4
    steps:
      - name: Check out the exact diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect the loaded system libxpc from a synthetic process
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          /usr/bin/sw_vers
          /usr/bin/uname -m
          test "$(/usr/bin/sw_vers -productVersion)" = 15.8.2
          test "$(/usr/bin/sw_vers -buildVersion)" = 24H232
          test "$(/usr/bin/uname -m)" = arm64
          test "$(/usr/bin/id -u)" -ne 0
          temp_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/stock-xpc-inspection.XXXXXXXX")"
          trap '/bin/rm -rf -- "$temp_dir"' EXIT
          cat > "$temp_dir/probe.c" <<'C'
          #include <xpc/xpc.h>

          int main(void) {
              xpc_object_t value = xpc_bool_create(true);
              xpc_release(value);
              return 0;
          }
          C
          /usr/bin/xcrun --sdk macosx clang -std=c11 -arch arm64 -g -O0 -Wall -Wextra -Werror \
            "$temp_dir/probe.c" -o "$temp_dir/probe"
          cat > "$temp_dir/stock_xpc_observer.py" <<'PY'
          import re

          import lldb


          STOCK_UUID = "D3682603-AC67-3242-82EB-1226B435BFF4"
          ROOTS = (
              "_xpc_domain_routine_authenticate",
              "_xpc_dictionary_extract_mach_send",
          )
          BRANCH_ADDRESS = re.compile(r"#?(0x[0-9a-f]+)", re.IGNORECASE)
          INDIRECT_BRANCH = re.compile(r"bl?r(?:aa|ab|aaz|abz)?")
          MAX_SYMBOLS = 6
          MAX_INSTRUCTIONS = 1400


          def observe(debugger, command, result, internal_dict):
              target = debugger.GetSelectedTarget()
              process = target.GetProcess()
              frame = process.GetSelectedThread().GetFrameAtIndex(0)
              if (
                  process.GetState() != lldb.eStateStopped
                  or frame.GetFunctionName() != "main"
                  or frame.GetModule().GetFileSpec() != target.GetExecutable()
              ):
                  result.SetError("expected the owned executable stopped at main")
                  return

              path = "/usr/lib/system/libxpc.dylib"
              module = target.FindModule(lldb.SBFileSpec(path))
              if (
                  not module.IsValid()
                  or module.GetUUIDString() != STOCK_UUID
                  or not module.GetTriple().startswith("arm64")
              ):
                  result.SetError("unexpected loaded libxpc identity")
                  return
              result.AppendMessage(f"loaded_image={path} uuid={STOCK_UUID} triple={module.GetTriple()}")

              pending = [(module.FindSymbol(name, lldb.eSymbolTypeCode), name, 0) for name in ROOTS]
              seen = set()
              complete_roots = set()
              remaining = MAX_INSTRUCTIONS
              while pending and len(seen) < MAX_SYMBOLS:
                  symbol, name, depth = pending.pop(0)
                  if not symbol.IsValid():
                      result.SetError(f"required symbol unavailable: {name}")
                      return
                  start = symbol.GetStartAddress()
                  end = symbol.GetEndAddress()
                  address = start.GetFileAddress()
                  if address in seen:
                      continue
                  size = end.GetFileAddress() - address
                  if (
                      not start.IsValid()
                      or not end.IsValid()
                      or start.GetSection() != end.GetSection()
                      or size < 4
                      or size % 4
                  ):
                      if depth == 0:
                          result.SetError(f"required symbol has unknown extent: {name}")
                          return
                      result.AppendMessage(f"symbol={name} status=unknown_extent")
                      continue
                  seen.add(address)
                  expected = size // 4
                  instructions = target.ReadInstructions(start, min(expected, remaining))
                  count = instructions.GetSize()
                  complete = count == expected
                  if depth == 0 and not complete:
                      result.SetError(f"incomplete required symbol: {name} ({count}/{expected})")
                      return
                  if depth == 0:
                      complete_roots.add(name)
                  remaining -= count
                  result.AppendMessage(
                      f"symbol={name} depth={depth} inspected={count}/{expected} complete={complete}"
                  )
                  for instruction in instructions:
                      offset = instruction.GetAddress().GetFileAddress() - address
                      mnemonic = instruction.GetMnemonic(target) or ""
                      operands = instruction.GetOperands(target) or ""
                      comment = instruction.GetComment(target) or ""
                      result.AppendMessage(f"  +0x{offset:x} {mnemonic} {operands} {comment}".rstrip())
                      if INDIRECT_BRANCH.fullmatch(mnemonic):
                          result.AppendMessage(f"  edge={name}+0x{offset:x} unresolved=indirect")
                      if mnemonic not in {"b", "bl"}:
                          continue
                      match = BRANCH_ADDRESS.fullmatch(operands.strip())
                      if not match:
                          result.AppendMessage(f"  edge={name}+0x{offset:x} unresolved=operand")
                          continue
                      destination = target.ResolveLoadAddress(int(match[1], 16))
                      if not destination.IsValid():
                          result.AppendMessage(f"  edge={name}+0x{offset:x} unresolved=address")
                          continue
                      callee = destination.GetSymbol()
                      callee_name = callee.GetName() if callee.IsValid() else None
                      if not callee_name:
                          result.AppendMessage(f"  edge={name}+0x{offset:x} unresolved=symbol")
                          continue
                      if destination.GetModule() == module and callee_name == name:
                          continue
                      result.AppendMessage(f"  edge={name}+0x{offset:x} destination={callee_name}")
                      # Follow only the domain transaction wrapper and its immediate
                      # routine, leaving all other call targets for manual review.
                      if (
                          depth < 2
                          and (depth > 0 or name == ROOTS[0])
                          and destination.GetModule() == module
                          and callee.GetType() == lldb.eSymbolTypeCode
                          and callee_name.lstrip("_").startswith(("xpc_domain_routine", "xpc_pipe_routine"))
                      ):
                          pending.append((callee, callee_name, depth + 1))
                  if not remaining:
                      break
              if complete_roots != set(ROOTS):
                  result.SetError("inspection budget exhausted before both roots")
                  return
              result.AppendMessage(f"static_symbols={len(seen)} pending={len(pending)} dynamic_calls=false")
              result.AppendMessage("stock_named_static_inspection=complete")

          def __lldb_init_module(debugger, internal_dict):
              debugger.HandleCommand("command script add -f stock_xpc_observer.observe observe-stock-xpc")
          PY
          python3 - "$temp_dir" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          workdir = sys.argv[1]
          command = [
              "/usr/bin/xcrun", "lldb", "--batch", "--no-lldbinit", "--no-use-colors",
              "-o", "settings set target.disable-aslr false",
              "-o", "breakpoint set --name main --shlib probe",
              "-o", "run",
              "-o", "command script import ./stock_xpc_observer.py",
              "-o", "observe-stock-xpc",
              "-o", "process kill",
              "--", f"{workdir}/probe",
          ]
          log = os.path.join(workdir, "lldb.log")
          with open(log, "w") as output, subprocess.Popen(
              command, cwd=workdir, start_new_session=True, stdout=output, stderr=subprocess.STDOUT
          ) as proc:
              try:
                  status = proc.wait(timeout=25)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(proc.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  proc.wait()
                  print("lldb exceeded its 25-second watchdog", flush=True)
                  status = 124
          with open(log) as output:
              receipt = output.read()
          print(receipt, end="")
          if status == 0 and "stock_named_static_inspection=complete" not in receipt.splitlines():
              sys.exit("missing static inspection completion marker")
          sys.exit(status if status >= 0 else 128 - status)
          PY
