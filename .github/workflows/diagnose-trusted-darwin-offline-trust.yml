name: Inspect stock Darwin launchd authorization surface

on:
  push:
    branches: [diag/python-trusted-darwin-offline-trust-5787]
    paths: [.github/workflows/diagnose-trusted-darwin-offline-trust.yml]

permissions:
  contents: read

jobs:
  stock-darwin-launchd-inspection:
    if: github.repository == 'openai/openai-agents-python' && !github.event.deleted
    runs-on: macos-15
    timeout-minutes: 6
    steps:
      - name: Check out the signed diagnostic workflow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github/workflows/diagnose-trusted-darwin-offline-trust.yml
          sparse-checkout-cone-mode: false
      - name: Inspect exact stock build without executing launchd commands
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = 73e2cf800b418d7e64a1b334520123dc177c38cd
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/diagnose-trusted-darwin-offline-trust.yml
          sw_vers
          test "$RUNNER_OS/$RUNNER_ARCH" = macOS/ARM64
          test "$(sw_vers -buildVersion)" = 24H232
          python3 -I -S - <<'PY'
          import hashlib
          import mmap
          from pathlib import Path
          import re
          import subprocess

          operation = rb"(?:job|launchd|service|xpc)-[a-z][a-z0-9-]{1,62}"
          atom = re.compile(rb"(?<=\x00)" + operation + rb"(?=\x00)")
          action = re.compile(r"kickstart|job[-_ ](?:start|creation|control|management)|service[-_ ](?:start|control|management)|(?:start|manage|control)[-_ ](?:a |the )?(?:job|service)|caller.*(?:not allowed|denied|privilege|entitlement)|sandbox(?:[-_ ](?:check|denied|violation)|ed)", re.I)
          symbol = re.compile(r"sandbox_check|sandbox_reference|audit_token|entitlement|xpc_pipe|bootstrap_")
          profile_term = re.compile(rb"(?<![\w-])(?:job-[\w-]+|(?:launchd|service|xpc)-(?:start|kickstart|control|management)[\w-]*)(?![\w-])")
          candidates = set()

          def tool(*argv):
              try:
                  result = subprocess.run(argv, capture_output=True, text=True, errors="replace", timeout=45)
              except (OSError, subprocess.TimeoutExpired) as error:
                  print("TOOL_ERROR", argv[0], type(error).__name__, flush=True)
                  return []
              print("TOOL", " ".join(argv), "exit", result.returncode, flush=True)
              if result.returncode:
                  print("TOOL_DETAIL", result.stderr.splitlines()[:2], flush=True)
                  return []
              return result.stdout.splitlines()

          def literal_atoms(binary):
              with binary.open("rb") as source, mmap.mmap(source.fileno(), 0, access=mmap.ACCESS_READ) as data:
                  first = {}
                  for match in atom.finditer(data):
                      first.setdefault(match[0].decode("ascii"), match.start())
              candidates.update(first)
              for name, offset in sorted(first.items())[:80]:
                  print("LITERAL_ATOM", binary, f"{offset:#x}", name)

          for binary in map(Path, ("/sbin/launchd", "/bin/launchctl")):
              print("BINARY", binary, binary.stat().st_size, hashlib.sha256(binary.read_bytes()).hexdigest())
              for line in tool("/usr/bin/file", str(binary)):
                  print("FILE", line)
              for line in tool("/usr/bin/dwarfdump", "--uuid", str(binary)):
                  print("BINARY_UUID", line)
              imports = set()
              for argv in (("/usr/bin/nm", "-um"), ("/usr/bin/dyld_info", "-imports")):
                  for line in tool(*argv, str(binary)):
                      if symbol.search(line):
                          imports.add(line.strip())
              for line in sorted(imports)[:60]:
                  print("IMPORT", binary, line)
              print("RELEVANT_IMPORT_COUNT", binary, len(imports))
              literal_atoms(binary)
              matches = [
                  line.strip()[:230]
                  for line in tool("/usr/bin/strings", "-a", "-t", "x", str(binary))
                  if action.search(line) and len(line) <= 500
              ]
              print("ACTION_LITERAL_COUNT", binary, len(matches))
              for line in matches[:65]:
                  print("ACTION_LITERAL", binary, line)

          # Symbolized static references only. No process attachment or Mach requests.
          binary = "/sbin/launchd"
          lines = tool("/usr/bin/otool", "-tvV", binary)
          policy_calls = re.compile(r"\b(?:b|bl)\b.*sandbox_(?:check|reference)")
          caller_calls = re.compile(r"\b(?:b|bl)\b.*(?:sandbox_check|audit_token|entitlement)")
          check_refs = [(index, line) for index, line in enumerate(lines) if policy_calls.search(line)]
          action_refs = [(index, line) for index, line in enumerate(lines)
                         if "literal pool" in line and action.search(line)]
          print("STATIC_POLICY_CALL_COUNT", len(check_refs))
          for index, line in check_refs[:24]:
              args = [row.strip()[:180] for row in lines[max(0, index - 12):index]
                      if "literal pool" in row or re.search(r"\b(?:mov|add|ldr)\s+[xw][0-3],", row)]
              print("STATIC_POLICY_CALL", line.strip()[:230], "NEARBY_ARGUMENTS", args)
          print("STATIC_ACTION_REFERENCE_COUNT", len(action_refs))
          for index, line in action_refs[:35]:
              nearby = [row.strip()[:180] for row in lines[max(0, index - 12):index + 13]
                        if caller_calls.search(row)]
              print("STATIC_ACTION_REFERENCE", line.strip()[:230], "NEARBY_CALLS", nearby)

          profile_roots = (
              "/System/Library/Sandbox/Profiles",
              "/usr/share/sandbox",
              "/System/Library/PrivateFrameworks/Sandbox.framework/Versions/A/Resources",
          )
          seen = set()
          profile_hits = 0
          for root in map(Path, profile_roots):
              print("PROFILE_ROOT", root, root.is_dir())
              for profile in sorted(root.rglob("*")):
                  if profile.suffix not in (".sb", ".sbpl") or profile.is_symlink() or not profile.is_file():
                      continue
                  physical = profile.resolve()
                  if physical in seen:
                      continue
                  seen.add(physical)
                  try:
                      lines = profile.read_bytes().splitlines()
                  except OSError as error:
                      print("PROFILE_READ_ERROR", profile, type(error).__name__)
                      continue
                  for lineno, line in enumerate(lines, 1):
                      match = profile_term.search(line.split(b";", 1)[0])
                      if match:
                          profile_hits += 1
                          if profile_hits <= 50:
                              print("PROFILE_RULE", f"{profile}:{lineno}", line.strip()[:230].decode(errors="replace"))
          print("PROFILE_SUMMARY", "files", len(seen), "matched_lines", profile_hits)

          # Inspect only exact operation-shaped NUL-terminated names in readable
          # system images. A name alone does not establish dispatch or policy use.
          for image in map(Path, (
              "/System/Library/Extensions/Sandbox.kext/Contents/MacOS/Sandbox",
              "/System/Library/KernelCollections/BootKernelExtensions.kc",
              "/System/Library/KernelCollections/SystemKernelExtensions.kc",
          )):
              if image.is_file():
                  try:
                      literal_atoms(image)
                  except (OSError, ValueError) as error:
                      print("IMAGE_READ_ERROR", image, type(error).__name__)
              else:
                  print("IMAGE_ABSENT", image)
          print("DISTINCT_LITERAL_ATOMS", len(candidates))
          PY
