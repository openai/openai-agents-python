name: Calibrate stock Darwin read-only bootstrap filtering

on:
  push:
    branches: [diag/python-trusted-darwin-offline-trust-5787]
    paths: [.github/workflows/diagnose-trusted-darwin-offline-trust.yml]

permissions:
  contents: read

jobs:
  stock-bootstrap-filter:
    if: github.repository == 'openai/openai-agents-python' && !github.event.deleted
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out the signed diagnostic workflow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github/workflows/diagnose-trusted-darwin-offline-trust.yml
          sparse-checkout-cone-mode: false
      - name: Compare one read-only lookup across three profiles
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = 11e305c077fcb4bd1eb3694352651d34ae957712
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/diagnose-trusted-darwin-offline-trust.yml
          sw_vers
          test "$RUNNER_OS/$RUNNER_ARCH" = macOS/ARM64
          test "$(sw_vers -buildVersion)" = 24H232
          work=$(mktemp -d "$RUNNER_TEMP/bootstrap-filter.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          cd "$work"

          cat > observe.c <<'C'
          #include <mach/mach.h>
          #include <stdint.h>
          #include <stdio.h>

          // Private symbol and packing from the published Sequoia XNU mach/message.h.
          extern mach_msg_return_t mach_msg2_internal(
              void *, uint64_t, uint64_t, uint64_t, uint64_t, uint64_t, uint64_t, uint64_t);
          static _Thread_local mach_port_t destination;
          static _Thread_local unsigned sends;
          static _Thread_local unsigned message_id;
          static _Thread_local unsigned transport_status;
          static _Thread_local int observing_send;

          void observe_bootstrap(mach_port_t port) {
              destination = port;
          }

          void report_bootstrap(void) {
              printf("BOOTSTRAP_OBSERVATION %u %08x %08x\n",
                     sends, message_id, transport_status);
          }

          static int begin_send(uint64_t options, mach_port_t port, unsigned id) {
              if (observing_send || destination == MACH_PORT_NULL ||
                  !(options & MACH_SEND_MSG) || port != destination) {
                  return 0;
              }
              observing_send = 1;
              if (sends++ == 0) {
                  message_id = id;
              }
              return 1;
          }

          static void end_send(int matched, mach_msg_return_t result) {
              if (matched) {
                  if (sends == 1) {
                      transport_status = (unsigned)result;
                  }
                  observing_send = 0;
              }
          }

          // MACH_SEND_FILTER_NONFATAL changes denial reporting, not the filter decision.
          // Apply it to the observed send in every leg.
          static const unsigned filter_nonfatal = 0x10000;
          static mach_msg_return_t observe_mach_msg2(
              void *data, uint64_t options, uint64_t bits_size, uint64_t ports,
              uint64_t voucher_id, uint64_t descriptors_receive, uint64_t size_priority,
              uint64_t timeout) {
              const int matched = begin_send(options, (mach_port_t)ports, (unsigned)(voucher_id >> 32));
              const mach_msg_return_t result = mach_msg2_internal(
                  data, options | (matched ? filter_nonfatal : 0), bits_size, ports,
                  voucher_id, descriptors_receive, size_priority, timeout);
              end_send(matched, result);
              return result;
          }

          static mach_msg_return_t observe_mach_msg(
              mach_msg_header_t *msg, mach_msg_option_t options, mach_msg_size_t send_size,
              mach_msg_size_t receive_size, mach_port_name_t receive_name,
              mach_msg_timeout_t timeout, mach_port_name_t notify) {
              const int matched = (options & MACH_SEND_MSG) &&
                  begin_send(options, msg->msgh_remote_port, (unsigned)msg->msgh_id);
              const mach_msg_return_t result = mach_msg(
                  msg, options | (matched ? filter_nonfatal : 0), send_size, receive_size,
                  receive_name, timeout, notify);
              end_send(matched, result);
              return result;
          }

          __attribute__((used, section("__DATA,__interpose")))
          static const struct { const void *replacement; const void *original; } interpose[] = {
              {(const void *)observe_mach_msg2, (const void *)mach_msg2_internal},
              {(const void *)observe_mach_msg, (const void *)mach_msg},
          };
          C

          cat > probe.c <<'C'
          #include <mach/mach.h>
          #include <sandbox.h>
          #include <servers/bootstrap.h>
          #include <stdio.h>
          #include <string.h>

          extern void observe_bootstrap(mach_port_t);
          extern void report_bootstrap(void);

          int main(int argc, char **argv) {
              if (argc != 3 || strncmp(argv[1], "com.example.nov9.calibration.", 29) != 0) {
                  return 2;
              }
              name_t service;
              if (strlcpy(service, argv[1], sizeof(service)) >= sizeof(service)) {
                  return 2;
              }
              mach_port_t inherited = MACH_PORT_NULL;
              mach_port_type_t type = 0;
              if (task_get_bootstrap_port(mach_task_self(), &inherited) != KERN_SUCCESS ||
                  !MACH_PORT_VALID(inherited) ||
                  mach_port_type(mach_task_self(), inherited, &type) != KERN_SUCCESS ||
                  !(type & MACH_PORT_TYPE_SEND) || (type & MACH_PORT_TYPE_RECEIVE) ||
                  inherited != bootstrap_port) {
                  fputs("NO_INHERITED_BOOTSTRAP_SEND_RIGHT\n", stderr);
                  return 3;
              }
              if (*argv[2]) {
                  char *error = NULL;
                  if (sandbox_init(argv[2], 0, &error) != 0) {
                      fprintf(stderr, "PROFILE_ERROR %.240s\n", error ? error : "unknown");
                      if (error) {
                          sandbox_free_error(error);
                      }
                      return 4;
                  }
                  puts("PROFILE_APPLIED");
              }
              observe_bootstrap(inherited);
              mach_port_t service_port = MACH_PORT_NULL;
              const kern_return_t result = bootstrap_look_up(inherited, service, &service_port);
              observe_bootstrap(MACH_PORT_NULL);
              report_bootstrap();
              const int got_port = MACH_PORT_VALID(service_port);
              if (got_port) {
                  mach_port_deallocate(mach_task_self(), service_port);
              }
              printf("LOOKUP_RESULT %d %d\n", result, got_port);
              return 0;
          }
          C

          xcrun clang -std=c11 -Wall -Wextra -Werror -dynamiclib \
            -install_name @rpath/libobserve.dylib observe.c -o libobserve.dylib
          xcrun clang -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            probe.c -L. -lobserve -Wl,-rpath,@executable_path -o probe

          python3 -I -S - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import uuid

          service = "com.example.nov9.calibration." + uuid.uuid4().hex
          dylib = Path("libobserve.dylib").resolve()
          env = {"PATH": "/usr/bin:/bin", "DYLD_INSERT_LIBRARIES": str(dylib), "LC_ALL": "C"}
          profile_base = "(version 1)(allow default)"

          def run(leg, profile):
              try:
                  proc = subprocess.run(
                      ["./probe", service, profile], env=env, timeout=10,
                      capture_output=True, text=True, errors="replace",
                  )
              except subprocess.TimeoutExpired:
                  raise SystemExit(f"INCONCLUSIVE {leg}: probe timed out")
              print(f"LEG {leg} exit={proc.returncode}", flush=True)
              for output in (proc.stdout, proc.stderr):
                  if output:
                      print(output[:1800], end="", flush=True)
              if proc.returncode:
                  raise SystemExit(f"INCONCLUSIVE {leg}: probe did not complete")
              observations = re.findall(
                  r"(?m)^BOOTSTRAP_OBSERVATION (\d+) ([0-9a-f]{8}) ([0-9a-f]{8})$", proc.stdout
              )
              lookup = re.findall(r"(?m)^LOOKUP_RESULT (-?\d+) ([01])$", proc.stdout)
              if len(observations) != 1 or observations[0][0] != "1" or len(lookup) != 1:
                  raise SystemExit(f"INCONCLUSIVE {leg}: no unique observed lookup to inherited port")
              if lookup[0][1] != "0":
                  raise SystemExit(f"INCONCLUSIVE {leg}: unexpectedly returned a service right")
              if profile and "PROFILE_APPLIED\n" not in proc.stdout:
                  raise SystemExit(f"INCONCLUSIVE {leg}: profile status missing")
              _, message, transport = observations[0]
              return int(message, 16), int(transport, 16), int(lookup[0][0])

          message, transport, status = run("unsandboxed", "")
          if not message >> 24 or transport != 0 or status != 1102:
              raise SystemExit("INCONCLUSIVE unsandboxed: no live nonzero-domain unknown-service reply")
          number = message & 0xFFFFFF
          prefix = profile_base + "(allow mach-bootstrap (apply-message-filter (deny mach-message-send)"
          allow = prefix + f" (allow mach-message-send (message-number {number}))))"
          deny = prefix + f" (allow mach-message-send (message-number {number ^ 1}))))"

          if run("filter-allow", allow) != (message, 0, 1102):
              raise SystemExit("INCONCLUSIVE filter-allow: original lookup did not survive")
          denied_message, denied_transport, denied_status = run("filter-deny", deny)
          if denied_message != message:
              raise SystemExit("INCONCLUSIVE filter-deny: message ID changed")
          if denied_transport == 0 and denied_status == 1102:
              raise SystemExit("FILTER_NOT_ENFORCED: deny leg received the same live reply")
          if denied_transport != 0x10000017:
              raise SystemExit("INCONCLUSIVE filter-deny: no kernel MACH_SEND_MSG_FILTERED")
          print(f"PASS read-only inherited-bootstrap filter full_id={message:08x} message_number={number}")
          PY
