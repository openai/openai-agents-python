name: Stock macOS plain bootstrap denial diagnostic

on:
  push:
    branches: [diag/python-macos-bootstrap-filter-5688]

permissions: {}

jobs:
  stock-seatbelt:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Compare stock identity under the SDK base and plain bootstrap denial
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'source %s\n' "$GITHUB_SHA"
          /usr/bin/sw_vers
          /usr/bin/uname -m

          scratch=$(/usr/bin/mktemp -d "$RUNNER_TEMP/bootstrap-plain-deny.XXXXXXXX")
          scratch=$(cd "$scratch" && pwd -P)
          work="$scratch/work"
          outside="$scratch/outside"
          capture="$work/capture"
          mkdir -p "$capture" "$outside"
          cd "$work"
          owned_service=
          cleanup() {
            if [[ -n "$owned_service" ]] && /bin/launchctl print "$owned_service" >/dev/null 2>&1; then
              /bin/launchctl bootout "$owned_service" || true
              if /bin/launchctl print "$owned_service" >/dev/null 2>&1; then
                printf 'disposable service cleanup failed\n' >&2
                return 1
              fi
            fi
            /bin/rm -rf "$scratch"
          }
          trap cleanup EXIT

          clean=(/usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/sh "HOME=$work" "TMPDIR=$work")
          ssh=(/usr/bin/ssh -G -T -F /dev/null -o CanonicalizeHostname=no 127.0.0.1)
          record() {
            local name=$1 status=0
            shift
            "$@" >"$capture/$name.out" 2>"$capture/$name.err" &
            probe_pid=$!
            wait "$probe_pid" || status=$?
            printf '%s exit %d pid %d\n' "$name" "$status" "$probe_pid"
            if [[ -s "$capture/$name.err" ]]; then
              /usr/bin/head -n 8 "$capture/$name.err"
            fi
            return "$status"
          }

          record host-id "${clean[@]}" /usr/bin/id -F
          record host-ssh "${clean[@]}" "${ssh[@]}"
          [[ -s "$capture/host-id.out" ]]
          /usr/bin/grep -q '^hostname 127\.0\.0\.1$' "$capture/host-ssh.out"

          # This is the exact Core base used by the prior workspace-write control.
          cat >"$scratch/sdk-base.sb" <<'SBPL'
          (version 1)

          ; inspired by Chrome's sandbox policy:
          ; https://source.chromium.org/chromium/chromium/src/+/main:sandbox/policy/mac/common.sb;l=273-319;drc=7b3962fe2e5fc9e2ee58000dc8fbf3429d84d3bd
          ; https://source.chromium.org/chromium/chromium/src/+/main:sandbox/policy/mac/renderer.sb;l=64;drc=7b3962fe2e5fc9e2ee58000dc8fbf3429d84d3bd

          ; start with closed-by-default
          (deny default)

          ; child processes inherit the policy of their parent
          (allow process-exec)
          (allow process-fork)
          (allow signal (target same-sandbox))

          ; process-info
          (allow process-info* (target same-sandbox))

          (allow file-write-data
            (require-all
              (path "/dev/null")
              (vnode-type CHARACTER-DEVICE)))

          ; sysctls permitted.
          (allow sysctl-read
            (sysctl-name "hw.activecpu")
            (sysctl-name "hw.busfrequency_compat")
            (sysctl-name "hw.byteorder")
            (sysctl-name "hw.cacheconfig")
            (sysctl-name "hw.cachelinesize_compat")
            (sysctl-name "hw.cpufamily")
            (sysctl-name "hw.cpufrequency_compat")
            (sysctl-name "hw.cputype")
            (sysctl-name "hw.l1dcachesize_compat")
            (sysctl-name "hw.l1icachesize_compat")
            (sysctl-name "hw.l2cachesize_compat")
            (sysctl-name "hw.l3cachesize_compat")
            (sysctl-name "hw.logicalcpu_max")
            (sysctl-name "hw.machine")
            (sysctl-name "hw.model")
            (sysctl-name "hw.memsize")
            (sysctl-name "hw.ncpu")
            (sysctl-name "hw.nperflevels")
            ; Chrome locks these CPU feature detection down a bit more tightly,
            ; but mostly for fingerprinting concerns which isn't an issue for codex.
            (sysctl-name-prefix "hw.optional.arm.")
            (sysctl-name-prefix "hw.optional.armv8_")
            (sysctl-name "hw.packages")
            (sysctl-name "hw.pagesize_compat")
            (sysctl-name "hw.pagesize")
            (sysctl-name "hw.physicalcpu")
            (sysctl-name "hw.physicalcpu_max")
            (sysctl-name "hw.logicalcpu")
            (sysctl-name "hw.cpufrequency")
            (sysctl-name "hw.tbfrequency_compat")
            (sysctl-name "hw.vectorunit")
            (sysctl-name "machdep.cpu.brand_string")
            (sysctl-name "kern.argmax")
            (sysctl-name "kern.hostname")
            (sysctl-name "kern.maxfilesperproc")
            (sysctl-name "kern.maxproc")
            (sysctl-name "kern.osproductversion")
            (sysctl-name "kern.osrelease")
            (sysctl-name "kern.ostype")
            (sysctl-name "kern.osvariant_status")
            (sysctl-name "kern.osversion")
            (sysctl-name "kern.secure_kernel")
            ; Python's ProcessPoolExecutor queries this through sysconf(_SC_SEM_NSEMS_MAX).
            (sysctl-name "kern.sysv.semmns")
            (sysctl-name "kern.usrstack64")
            (sysctl-name "kern.version")
            (sysctl-name "sysctl.proc_cputype")
            (sysctl-name "vm.loadavg")
            (sysctl-name-prefix "hw.perflevel")
            (sysctl-name-prefix "kern.proc.pgrp.")
            (sysctl-name-prefix "kern.proc.pid.")
            (sysctl-name-prefix "net.routetable.")
          )

          ; Allow Java to read some CPU info. This is misclassified as a "write" because
          ; userspace passes a memory buffer to the sysctl, but conceptually it is a read.
          (allow sysctl-write
            (sysctl-name "kern.grade_cputype"))

          ; IOKit
          (allow iokit-open
            (iokit-registry-entry-class "RootDomainUserClient")
          )

          ; needed to look up user info, see https://crbug.com/792228
          (allow mach-lookup
            (global-name "com.apple.system.opendirectoryd.libinfo")
          )

          ; Needed for python multiprocessing on MacOS for the SemLock
          (allow ipc-posix-sem)

          ; Needed for PyTorch/libomp on macOS to register OpenMP runtimes.
          (allow ipc-posix-shm-read-data
            ipc-posix-shm-write-create
            ipc-posix-shm-write-unlink
            (ipc-posix-name-regex #"^/__KMP_REGISTERED_LIB_[0-9]+$"))

          (allow mach-lookup
            (global-name "com.apple.PowerManagement.control")
          )

          ; allow openpty()
          (allow pseudo-tty)
          (allow file-read* file-write* file-ioctl (literal "/dev/ptmx"))
          (allow file-read* file-write*
            (require-all
              (regex #"^/dev/ttys[0-9]+")
              (extension "com.apple.sandbox.pty")))
          ; PTYs created before entering seatbelt may lack the extension; allow ioctl
          ; on those slave ttys so interactive shells detect a TTY and remain functional.
          (allow file-ioctl (regex #"^/dev/ttys[0-9]+"))
          SBPL
          printf '%s  %s\n' '5103332ddb8885ee5e1926de6c0ef23a61f4e55e31297506ae05fa4e0b24ba74' "$scratch/sdk-base.sb" | /usr/bin/shasum -a 256 -c
          cp "$scratch/sdk-base.sb" "$scratch/base.sb"
          cat >>"$scratch/base.sb" <<'SBPL'
          (allow file-read*)
          (allow file-write* (subpath (param "WORK")))
          (deny mach-lookup (xpc-service-name-prefix ""))
          (deny system-fcntl (fcntl-command 80 110))
          SBPL
          probe() {
            local name=$1 profile=$2
            shift 2
            record "$name" "${clean[@]}" /usr/bin/sandbox-exec -p "$(/bin/cat "$scratch/$profile.sb")" "-DWORK=$work" -- "$@"
          }
          cp "$scratch/base.sb" "$scratch/plain-deny.sb"
          printf '(deny mach-bootstrap)\n' >>"$scratch/plain-deny.sb"

          base_id=0
          base_ssh=0
          plain_id=0
          plain_ssh=0
          probe sdk-base-id base /usr/bin/id -F || base_id=$?
          probe sdk-base-ssh base "${ssh[@]}" || base_ssh=$?
          probe plain-deny-id plain-deny /usr/bin/id -F || plain_id=$?
          probe plain-deny-ssh plain-deny "${ssh[@]}" || plain_ssh=$?

          account_matches_host() {
            /usr/bin/cmp -s "$capture/host-id.out" "$capture/$1-id.out" &&
              /usr/bin/cmp -s "$capture/host-ssh.out" "$capture/$1-ssh.out"
          }
          if [[ "$base_id" != 0 || "$base_ssh" != 0 ]] || ! account_matches_host sdk-base; then
            printf 'result inconclusive: SDK baseline identity or offline SSH differs from host\n' >&2
            exit 1
          fi
          printf 'SDK baseline identity and offline SSH match host\n'
          if [[ "$plain_id" != 0 || "$plain_ssh" != 0 ]] || ! account_matches_host plain-deny; then
            printf 'result plain mach-bootstrap denial fails stock identity or offline SSH; gated controls skipped\n'
            exit 0
          fi
          printf 'plain denial identity and offline SSH match host\n'

          result=0
          write='printf canary > "$1"'
          record host-outside-write "${clean[@]}" /bin/sh -c "$write" sh "$outside/host"
          /bin/rm "$outside/host"
          probe inside-write plain-deny /bin/sh -c "$write" sh "$work/inside"
          [[ -f "$work/inside" ]]
          outside_status=0
          probe outside-write plain-deny /bin/sh -c "$write" sh "$outside/direct" || outside_status=$?
          if [[ "$outside_status" == 0 || -e "$outside/direct" ]]; then
            printf 'outside-write fence failed\n' >&2
            result=1
          else
            printf 'outside-write fence held\n'
          fi

          # Fork, create a separate session, then exec a stock shell. Reap that exact
          # child in both runs. This observes policy inheritance across detachment.
          detached='
            use POSIX qw(setsid);
            my $pid = fork();
            die "fork: $!" unless defined $pid;
            if ($pid == 0) {
              my $sid = setsid();
              die "setsid: $!" unless defined($sid) && $sid >= 0;
              print STDERR "descendant created a separate session\n";
              exec "/bin/sh", "-c", q{printf canary > "$1" || exit 78
                (printf canary > "$2")}, "sh", @ARGV;
              die "exec: $!";
            }
            die "waitpid: $!" unless waitpid($pid, 0) == $pid;
            exit(($? & 127) ? 79 : $? >> 8);
          '
          record host-descendant "${clean[@]}" /usr/bin/perl -e "$detached" "$work/host-child" "$outside/host-child"
          [[ -f "$work/host-child" && -f "$outside/host-child" ]]
          descendant_status=0
          probe plain-deny-descendant plain-deny /usr/bin/perl -e "$detached" "$work/child" "$outside/child" || descendant_status=$?
          if [[ "$descendant_status" != 1 || ! -f "$work/child" || -e "$outside/child" ]]; then
            printf 'detached descendant write control failed or was inconclusive\n' >&2
            result=1
          else
            printf 'detached descendant retained the outside-write fence\n'
          fi

          uid=$(/usr/bin/id -u)
          domain="gui/$uid"
          session_type=
          if ! /bin/launchctl print "$domain" >/dev/null 2>&1; then
            domain="user/$uid"
            session_type='<key>LimitLoadToSessionType</key><string>Background</string>'
          fi
          /bin/launchctl print "$domain" >/dev/null
          label="org.openai.agents.sdk-test.$(/usr/bin/uuidgen)"
          service="$domain/$label"
          plist="$work/$label.plist"
          cat >"$plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>Label</key><string>$label</string>
            <key>ProgramArguments</key><array><string>/usr/bin/touch</string><string>$work/job-ran</string></array>
            <key>RunAtLoad</key><false/>
            <key>KeepAlive</key><false/>
            <key>ExitTimeOut</key><integer>2</integer>
            <key>ThrottleInterval</key><integer>1</integer>
            $session_type
          </dict>
          </plist>
          PLIST
          /usr/bin/plutil -lint "$plist"
          if /bin/launchctl print "$service" >/dev/null 2>&1; then
            printf 'disposable launchd label already present\n' >&2
            exit 1
          fi
          owned_service=$service

          job_present() {
            /bin/launchctl print "$service" >/dev/null 2>&1
          }
          job_runs() {
            /bin/launchctl print "$service" | /usr/bin/awk '$1 == "runs" && $2 == "=" {print $3}'
          }
          remove_job() {
            record "$1" /bin/launchctl bootout "$service"
            if job_present; then
              printf 'disposable job still registered\n' >&2
              exit 1
            fi
          }

          record host-bootstrap /bin/launchctl bootstrap "$domain" "$plist"
          [[ "$(job_runs)" == 0 && ! -e "$work/job-ran" ]]
          record host-kickstart /bin/launchctl kickstart "$service"
          for ((attempt=0; attempt<50; attempt++)); do
            [[ -f "$work/job-ran" ]] && break
            /bin/sleep 0.1
          done
          [[ -f "$work/job-ran" ]]
          printf 'host kickstart created the job marker\n'
          remove_job host-bootout
          /bin/rm "$work/job-ran"

          for profile in base plain-deny; do
            create_status=0
            created=no
            probe "$profile-bootstrap" "$profile" /bin/launchctl bootstrap "$domain" "$plist" || create_status=$?
            if job_present; then
              created=yes
              remove_job "$profile-reset-job"
            fi
            printf '%s job registered %s\n' "$profile" "$created"
            if [[ "$profile" == plain-deny && ( "$create_status" == 0 || "$created" == yes ) ]]; then
              result=1
            fi

            record "$profile-host-register" /bin/launchctl bootstrap "$domain" "$plist"
            [[ "$(job_runs)" == 0 && ! -e "$work/job-ran" ]]
            kick_status=0
            probe "$profile-kickstart" "$profile" /bin/launchctl kickstart "$service" || kick_status=$?
            /bin/sleep 0.25
            runs=$(job_runs)
            [[ "$runs" =~ ^[0-9]+$ ]]
            marker=no
            [[ ! -e "$work/job-ran" ]] || marker=yes
            printf '%s existing job runs %s marker %s\n' "$profile" "$runs" "$marker"
            if [[ "$profile" == plain-deny && ( "$kick_status" == 0 || "$runs" != 0 || "$marker" == yes ) ]]; then
              result=1
            fi
            remove_job "$profile-bootout"
            /bin/rm -f "$work/job-ran"
          done
          printf 'disposable job removed\n'
          printf 'result completed gated controls with status %d\n' "$result"
          exit "$result"
