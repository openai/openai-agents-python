name: Full verification for apply_patch path fix

on:
  push:
    branches:
      - fix/apply-patch-posix-path-normalization

permissions:
  contents: write

env:
  OPENAI_API_KEY: fake-for-tests

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apply-patch-posix-path-normalization
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true
      - run: make sync
      - name: Repository verification
        run: env UV_DEFAULT_INDEX=https://pypi.org/simple bash .agents/skills/code-change-verification/scripts/run.sh
      - name: Remove verification workflow
        if: success()
        run: |
          rm -f .github/workflows/full-verify-posix-patch-paths.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove full verification workflow" || exit 0
          git push origin HEAD:fix/apply-patch-posix-path-normalization
