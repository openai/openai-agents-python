name: Codex preview wheels

on:
  push:
    branches: [feat/simple-codex]
    paths: &wheel_paths
      - 'src/**'
      - 'native/**'
      - 'examples/codex/native_workspace.py'
      - 'examples/codex/native_approval.py'
      - 'tests/models/test_operation_tracing_parity.py'
      - 'tests/testing_processor.py'
      - 'tests/conftest.py'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/codex-preview.yml'
      - '.github/scripts/install-codex-preview-tools.sh'
  pull_request:
    branches: [feat/simple-codex]
    paths: *wheel_paths
  # The push trigger also works before this workflow reaches the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: >-
      github.ref == 'refs/heads/feat/simple-codex' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.version.outputs.preview }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Require an explicit alpha candidate
        id: version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('native/codex/Cargo.toml').read_text())['package']['version']
          match = re.fullmatch(r'(\d+\.\d+\.\d+)(?:-alpha\.|a)(\d+)', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'preview={str(match is not None).lower()}', file=output)
              if match:
                  print(f'version={match[1]}a{match[2]}', file=output)
                  print(f'tag=v{match[1]}-alpha.{match[2]}', file=output)
          if not match:
              if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
                  raise SystemExit('Choose an unused X.Y.Z-alpha.N version in native/codex/Cargo.toml before building a preview.')
              print('::notice::Skipping preview wheels until source metadata selects an alpha version.')

  build:
    needs: candidate
    if: needs.candidate.outputs.preview == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            test_native: true
            platform: manylinux_2_28_x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: manylinux_2_28_aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macosx_11_0_arm64
            image: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win_amd64
            image: ''
    # Reuse the harness's provisioned cold-build runners in the official repository.
    runs-on: >-
      ${{ fromJSON(
        github.repository == 'openai/openai-agents-python' && matrix.runner == 'ubuntu-24.04' && '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' ||
        github.repository == 'openai/openai-agents-python' && matrix.runner == 'ubuntu-24.04-arm' && '{"group":"codex-runners","labels":"codex-linux-arm64"}' ||
        github.repository == 'openai/openai-agents-python' && matrix.runner == 'windows-latest' && '{"group":"codex-runners","labels":"codex-windows-x64-xl"}' ||
        github.repository == 'openai/openai-agents-python' && matrix.runner == 'macos-latest' && '"macos-26-xlarge"' ||
        toJSON(matrix.runner)
      ) }}
    container: ${{ matrix.image || null }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.95.0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      WHEEL_TARGET: ${{ matrix.target }}
      WHEEL_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.11.14'
          enable-cache: false
      - name: Select isolated build directories
        run: |
          # Short roots keep Cargo's Codex checkout within the Windows path limit.
          {
            printf 'CARGO_HOME=%s/c\n' "$RUNNER_TEMP"
            printf 'CARGO_TARGET_DIR=%s/t\n' "$RUNNER_TEMP"
            printf 'UV_CACHE_DIR=%s/codex-uv\n' "$RUNNER_TEMP"
            printf 'UV_PROJECT_ENVIRONMENT=%s/codex-build-tools\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then
            printf 'CARGO_BUILD_JOBS=%s\n' "$(nproc)" >> "$GITHUB_ENV"
            printf '%s\n' /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
            printf 'PYO3_PYTHON=%s\n' /opt/python/cp312-cp312/bin/python >> "$GITHUB_ENV"
            test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.28'
          fi
      - name: Install Rust and Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          case "$(uname -m)" in
            x86_64) checksum=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c ;;
            aarch64) checksum=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c ;;
          esac
          installer="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 2 \
            --output "$installer" "https://static.rust-lang.org/rustup/archive/1.28.2/$(uname -m)-unknown-linux-gnu/rustup-init"
          printf '%s  %s\n' "$checksum" "$installer" | sha256sum --check --strict
          chmod +x "$installer"
          "$installer" -y --default-toolchain none --no-modify-path
          printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
          bash .github/scripts/install-codex-preview-tools.sh
      # Codex selects Cargo.lock's checksum-pinned vendored protoc on every platform.
      - name: Select the pinned toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Install hash-pinned Python build tools
        run: |
          uv venv --python 3.12 --no-python-downloads "$UV_PROJECT_ENVIRONMENT"
          uv pip install --python "$UV_PROJECT_ENVIRONMENT" --require-hashes --only-binary=:all: \
            --requirements native/codex/build-requirements.txt
      - name: Build the combined native wheel
        env:
          UV_NO_BUILD_ISOLATION: '1'
          UV_OFFLINE: '1'
        run: |
          options=()
          if [[ "$RUNNER_OS" == Linux ]]; then options+=(--compatibility manylinux_2_28); fi
          if [[ "${{ matrix.test_native }}" == true ]]; then options+=(--test-native); fi
          uv run --no-sync python scripts/build_codex_wheel.py \
            --out "$GITHUB_WORKSPACE/dist" --target "$WHEEL_TARGET" "${options[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [candidate, build]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        platform: [manylinux_2_28_x86_64, manylinux_2_28_aarch64, macosx_11_0_arm64, win_amd64]
    runs-on: >-
      ${{ matrix.platform == 'manylinux_2_28_x86_64' && 'ubuntu-24.04' ||
          matrix.platform == 'manylinux_2_28_aarch64' && 'ubuntu-24.04-arm' ||
          matrix.platform == 'macosx_11_0_arm64' && 'macos-latest' || 'windows-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            native/codex/verify_installed.py
            examples/codex/native_workspace.py
            examples/codex/native_approval.py
            pyproject.toml
            tests/__init__.py
            tests/models/__init__.py
            tests/testing_processor.py
            tests/conftest.py
            tests/models/test_operation_tracing_parity.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: codex-wheel-${{ matrix.platform }}
          path: ${{ runner.temp }}/codex-wheel
      - name: Exercise a fresh installation outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          VERIFIER: ${{ github.workspace }}/native/codex/verify_installed.py
          EXAMPLES_DIR: ${{ github.workspace }}/examples/codex
        run: |
          import os, shutil, subprocess, sys, venv
          from pathlib import Path
          wheel, = Path('codex-wheel').glob('*.whl')
          venv.create('codex-venv', with_pip=True)
          python = Path('codex-venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--only-binary=:all:', str(wheel)], check=True)
          shutil.copy2(os.environ['VERIFIER'], 'verify_installed.py')
          command = [str(python), '-I', 'verify_installed.py', '--output', 'installed.json']
          if sys.platform == 'darwin' and sys.version_info[:2] == (3, 14):
              examples = Path('codex-example-entrypoints')
              examples.mkdir()
              for name in ('native_workspace.py', 'native_approval.py'):
                  shutil.copy2(Path(os.environ['EXAMPLES_DIR']) / name, examples / name)
              command.extend(('--examples-dir', str(examples)))
          subprocess.run(command, check=True)
      - name: Verify logical request parity through the installed wheel
        working-directory: ${{ runner.temp }}
        env:
          CODEX_TRACING_NATIVE_TEST: '1'
          PARITY_TESTS: ${{ github.workspace }}/tests/models/test_operation_tracing_parity.py
        run: |
          import os, subprocess
          from pathlib import Path
          python = Path('codex-venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--only-binary=:all:',
                          'pytest>=9.0.3', 'pytest-asyncio', 'opentelemetry-sdk>=1.45.0,<2'], check=True)
          subprocess.run([str(python), '-I', '-m', 'pytest', os.environ['PARITY_TESTS'],
                          '--import-mode=importlib', '-q'], check=True)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-installed-${{ matrix.platform }}-${{ matrix.python }}
          path: ${{ runner.temp }}/installed.json
          if-no-files-found: error
          retention-days: 14

  distributions:
    needs: [candidate, build, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: codex-wheel-*
          merge-multiple: true
          path: dist
      - name: Validate all four wheel identities and create checksums
        shell: python
        env:
          PREVIEW_VERSION: ${{ needs.candidate.outputs.version }}
          PREVIEW_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          import hashlib, json, os, zipfile
          from email.parser import BytesParser
          from pathlib import Path
          root = Path('dist')
          version = os.environ['PREVIEW_VERSION']
          platforms = ['manylinux_2_28_x86_64', 'manylinux_2_28_aarch64', 'macosx_11_0_arm64', 'win_amd64']
          expected = {f'openai_agents-{version}-cp310-abi3-{platform}.whl': platform for platform in platforms}
          assert {path.name for path in root.iterdir()} == set(expected), 'Expected exactly four platform wheels'
          hashes = {}
          for name, platform in expected.items():
              path = root / name
              with zipfile.ZipFile(path) as archive:
                  metadata, = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
                  package = BytesParser().parsebytes(archive.read(metadata))
                  wheel = BytesParser().parsebytes(archive.read(metadata.removesuffix('METADATA') + 'WHEEL'))
                  assert package['Name'] == 'openai-agents' and package['Version'] == version
                  assert wheel.get_all('Tag') == [f'cp310-abi3-{platform}']
                  assert wheel['Root-Is-Purelib'] == 'false'
              hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256SUMS').write_text(''.join(f'{hashes[name]}  {name}\n' for name in sorted(hashes)))
          receipt = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['GITHUB_SHA'],
              'source_branch': os.environ['GITHUB_REF_NAME'],
              'workflow': os.environ['GITHUB_WORKFLOW_REF'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'version': version,
              'tag': os.environ['PREVIEW_TAG'],
              'sha256': hashes,
          }
          (root / 'BUILD.json').write_text(json.dumps(receipt, indent=2) + '\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
