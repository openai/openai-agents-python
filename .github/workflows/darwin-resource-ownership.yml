name: Qualify macOS supervisor path protection
on:
  push:
    branches: [test/darwin-resource-ownership-20261104]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.14"
          enable-cache: false
          python-version: "3.14"
      - name: Check exact supervisor rule with a writable temporary root
        working-directory: .github/qualification/darwin-resource-ownership/bootstrap-port-qualification
        run: |
          set -eu
          sw_vers
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 build --locked --features clear-bootstrap
          uv run --no-project --python 3.14 python -I -B probe_supervisor.py "$PWD/target/debug/sdk-darwin-bootstrap-entry"
