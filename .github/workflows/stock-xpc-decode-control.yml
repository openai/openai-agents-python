name: Stock macOS XPC decode controls

on:
  push:
    branches:
      - diagnostics/nov9-stock-xpc-decode-a12
    paths:
      - .github/workflows/stock-xpc-decode-control.yml
      - .github/diagnostics/stock-xpc-decode-control.c

permissions:
  contents: read

jobs:
  decode-controls:
    runs-on: macos-15
    timeout-minutes: 4
    steps:
      - name: Check out the exact diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compare typed and stock named XPC on fixture-only ports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          /usr/bin/sw_vers
          /usr/bin/uname -m
          test "$(/usr/bin/sw_vers -productVersion)" = 15.8.2
          test "$(/usr/bin/sw_vers -buildVersion)" = 24H232
          test "$(/usr/bin/uname -m)" = arm64
          test "$(/usr/bin/id -u)" -ne 0
          source=.github/diagnostics/stock-xpc-decode-control.c
          printf '%s  %s\n' be1af7b3622e9e70bc261a1d3773c7facb96666e1a8217e3393bd657a2f73dd9 "$source" | /usr/bin/shasum -a 256 -c -
          temp_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/stock-xpc-decode.XXXXXXXX")"
          trap '/bin/rm -rf -- "$temp_dir"' EXIT
          /usr/bin/xcrun --sdk macosx clang -std=c11 -fblocks -D_DARWIN_C_SOURCE \
            -Wall -Wextra -Werror -Wno-deprecated-declarations \
            "$source" -lbsm -o "$temp_dir/canary"
          python3 - "$temp_dir/canary" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          def run(mode):
              print(f"control {mode} started", flush=True)
              with subprocess.Popen(
                  [sys.argv[1], mode],
                  env={"PATH": "/usr/bin:/bin"},
                  start_new_session=True,
              ) as proc:
                  try:
                      status = proc.wait(timeout=25)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(proc.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      proc.wait()
                      print(f"control {mode} exceeded its 25-second watchdog", flush=True)
                      return 124
              print(f"control {mode} exit={status}", flush=True)
              return status if status >= 0 else 128 - status

          typed = run("typed")
          named = run("named")
          if named:
              raw_typed = run("typed-raw")
              raw_named = run("named-raw")
              print(
                  f"raw comparison typed={raw_typed} named={raw_named}",
                  flush=True,
              )
          sys.exit(typed or named)
          PY
