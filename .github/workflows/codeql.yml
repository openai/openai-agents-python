name: CodeQL

on:
  push:
    branches: [main, feat/codex-harness]
  pull_request:
    branches: [main, feat/codex-harness]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 6 * * 2'

permissions: {}

jobs:
  analyze:
    # Require every language job for analysis execution. Findings need the separate
    # CodeQL code-scanning rule: Alerts = All, Security alerts = All on each protected branch.
    # A successful analysis job does not mean that no alerts were found.
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && matrix.language == 'rust' && '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' || '"ubuntu-latest"') }}
    timeout-minutes: ${{ matrix.language == 'rust' && 180 || 45 }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, rust, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the native Rust toolchain for analysis
        if: matrix.language == 'rust'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.95.0" >> "$GITHUB_ENV"

      - name: Prepare verified native sources for Rust analysis
        if: matrix.language == 'rust'
        run: make native-prepare

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.language == 'rust' && '.github/codeql/rust.yml' || '' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
