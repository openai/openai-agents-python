name: Native Docker bind metadata (diagnostic)
on:
  push:
    branches: [ci/hillclimb/python-docker-bind-metadata]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: >-
      github.repository == 'openai/openai-agents-python' &&
      github.ref == 'refs/heads/ci/hillclimb/python-docker-bind-metadata' &&
      !github.event.deleted
    # Scope access to the Docker daemon to a dedicated, ephemeral GitHub-hosted VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      UV_FROZEN: "1"
      CODEX_DOCKER_TEST_SOCKET: /var/run/docker.sock
      CODEX_DOCKER_TEST_IMAGE: agents-native-docker:${{ github.run_id }}-${{ github.run_attempt }}
      NATIVE_DOCKER_EVIDENCE: ${{ github.workspace }}/native-docker-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.14"
          python-version: "3.11"
      - name: Restore the three exact inputs from the previous diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/previous-diagnostic.zip"
          staged="$RUNNER_TEMP/previous-diagnostic-native"
          gh api repos/openai/openai-agents-python/actions/artifacts/14142514293/zip > "$archive"
          ARCHIVE="$archive" STAGED="$staged" python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path(os.environ["ARCHIVE"])
          assert archive.stat().st_size == 174627790
          with archive.open("rb") as f:
              assert hashlib.file_digest(f, "sha256").hexdigest() == '506ff91f0fe56fe688ec63f040d49e29e5582fd6862ed0e635d2e648df033ca4'

          target = Path(os.environ["STAGED"])
          target.mkdir()
          expected = {"exec-server-fixture": "89a4f12a36a225bd099e2ed17800c5fbfc2a193e3326a4c1e8f9c4971c639fdb", "openai_agents-0.24.0a8-cp310-abi3-manylinux_2_28_x86_64.whl": "75c9091b933147a85485706f959772271f9613a6f3f8aaf350f240594d9f10ee", "openai_agents-0.24.0a8-cp310-abi3-manylinux_2_28_x86_64.whl.pristine.json": "03dd5024334e02856b71a78d9f76956b087d5a697a912c0bf45ed7a2d7d3344a"}
          with ZipFile(archive) as source:
              for name, digest in expected.items():
                  with source.open(name) as f:
                      assert hashlib.file_digest(f, "sha256").hexdigest() == digest
                  (target / name).write_bytes(source.read(name))
          executor = target / "exec-server-fixture"
          executor.chmod(0o755)
          wheel, = target.glob("*.whl")
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"OPENAI_AGENTS_NATIVE_WHEEL={wheel}\n")
              env.write(f"CODEX_EXEC_SERVER_TEST_BINARY={executor}\n")
          PY
      - name: Install dependencies
        run: make sync
      - name: Prepare the pinned Docker test image
        run: |
          test "$(uname -m)" = x86_64
          test -S "$CODEX_DOCKER_TEST_SOCKET"
          test -x "$CODEX_EXEC_SERVER_TEST_BINARY"
          mkdir -m 0700 "$NATIVE_DOCKER_EVIDENCE"
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" version \
            --format 'client={{.Client.Version}} server={{.Server.Version}}' \
            > "$NATIVE_DOCKER_EVIDENCE/docker-version.txt"
          uname -r > "$NATIVE_DOCKER_EVIDENCE/kernel-version.txt"
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" build --pull \
            --file packages/codex/tests/fixtures/native-docker.Dockerfile \
            --tag "$CODEX_DOCKER_TEST_IMAGE" packages/codex/tests/fixtures
          image_id=$(docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" image inspect \
            --format '{{.Id}}' "$CODEX_DOCKER_TEST_IMAGE")
          echo "CODEX_DOCKER_TEST_IMAGE=$image_id" >> "$GITHUB_ENV"
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" image inspect "$image_id" \
            > "$NATIVE_DOCKER_EVIDENCE/image.json"
          sha256sum "$CODEX_EXEC_SERVER_TEST_BINARY" "$OPENAI_AGENTS_NATIVE_WHEEL" \
            "$OPENAI_AGENTS_NATIVE_WHEEL.pristine.json" \
            packages/codex/tests/fixtures/native-docker.Dockerfile \
            > "$NATIVE_DOCKER_EVIDENCE/inputs.sha256"
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" run --rm --network none \
            "$image_id" /usr/bin/bwrap --version \
            > "$NATIVE_DOCKER_EVIDENCE/bwrap-version.txt"
      - name: Install the confined diagnostic runner profiles
        id: profiles
        env:
          NATIVE_DOCKER_RECIPE: packages/codex/tests/fixtures/native-docker.Dockerfile
        run: bash .github/scripts/install-native-docker-profiles.sh
      - name: Probe enforced runner policy denials
        if: ${{ !cancelled() && steps.profiles.outcome == 'success' }}
        run: |
          profile_name="agents-native-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" run --rm --interactive --network none \
            --label "openai-agents.native-ci-profile=$profile_name" \
            --security-opt "apparmor=$profile_name" \
            --security-opt seccomp=/etc/openai-agents-native-docker/seccomp.json \
            "$CODEX_DOCKER_TEST_IMAGE" python3 - "$profile_name" \
            < .github/scripts/probe-native-docker-profiles.py \
            > "$NATIVE_DOCKER_EVIDENCE/probes.json"
      - name: Test strict Docker path and identity grants
        if: ${{ !cancelled() && steps.profiles.outcome == 'success' }}
        env:
          CODEX_DOCKER_TEST_PROFILE_MANIFEST: /etc/openai-agents-native-docker/manifest.json
          AGENTS_RECORD_DOCKER_BIND_METADATA: '1'
        run: |
          uv run --no-sync python packages/codex/scripts/test_native.py --sdk -m pytest -q -s \
            packages/codex/tests/test_native_docker_path_authority.py \
            packages/codex/tests/test_native_docker_run_as.py \
            --junitxml="$NATIVE_DOCKER_EVIDENCE/native-docker.xml"
      - name: Collect synthetic audit evidence and unload the diagnostic profile
        if: ${{ always() }}
        run: |
          mkdir -p "$NATIVE_DOCKER_EVIDENCE"
          profile_name="agents-native-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          set +e
          sudo journalctl -k --since "$(cat "$NATIVE_DOCKER_EVIDENCE/start-time" 2>/dev/null || date --iso-8601=seconds)" \
            --no-pager | grep -E "profile=\"$profile_name([\"/])" \
            > "$NATIVE_DOCKER_EVIDENCE/profile-audit.log"
          audit_status=("${PIPESTATUS[@]}")
          set -e
          printf 'journal_status=%s profile_match_status=%s\n' "${audit_status[0]}" "${audit_status[1]}" \
            > "$NATIVE_DOCKER_EVIDENCE/audit-status.txt"
          if sudo test -f /etc/openai-agents-native-docker/apparmor.profile; then
            python3 .github/scripts/cleanup-native-docker-containers.py \
              > "$NATIVE_DOCKER_EVIDENCE/container-cleanup.json"
            sudo grep -E "^$profile_name \\((enforce|complain)\\)$" /sys/kernel/security/apparmor/profiles \
              > "$NATIVE_DOCKER_EVIDENCE/profile-status.txt" || true
            sudo apparmor_parser --remove --skip-cache /etc/openai-agents-native-docker/apparmor.profile
            ! sudo grep -E "^$profile_name \\((enforce|complain)\\)$" /sys/kernel/security/apparmor/profiles
          fi
          if (( audit_status[0] != 0 || audit_status[1] != 0 )); then
            echo "Synthetic profile audit collection failed." >&2
            exit 1
          fi
      - name: Publish confined-runner diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-docker-bind-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_DOCKER_EVIDENCE }}
          if-no-files-found: error
          retention-days: 1
      - name: Keep this one-off observation out of qualification
        if: ${{ !cancelled() }}
        run: |
          echo "Diagnostic only. This job never qualifies a native artifact."
          exit 1
