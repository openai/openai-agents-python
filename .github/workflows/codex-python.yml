name: Build installable SDK package

on:
  workflow_call:
    inputs:
      native_provenance:
        type: string
        required: true
      runner:
        type: string
        required: true
      native_source_run:
        type: string
        required: false
        default: ''
      native_artifacts:
        type: string
        required: false
        default: "{}"
      native_dependency_run:
        type: string
        required: false
        default: ''
      native_dependencies:
        type: string
        required: false
        default: "{}"
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.build.outputs.artifact_digest }}
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Native snapshot (${{ inputs.runner }})
    runs-on: >-
      ${{ fromJSON(
        github.repository == 'openai/openai-agents-python' && inputs.runner == 'ubuntu-24.04' && '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' ||
        github.repository == 'openai/openai-agents-python' && inputs.runner == 'ubuntu-24.04-arm' &&
          github.event_name == 'push' && (github.ref_name == 'feat/codex-harness' || startsWith(github.ref_name, 'ci/hillclimb/')) &&
          '{"group":"codex-runners","labels":"codex-linux-arm64"}' ||
        github.repository == 'openai/openai-agents-python' && inputs.runner == 'windows-latest' &&
          (inputs.native_source_run == '' &&
           ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
             (github.event.pull_request.stack.base.ref || github.base_ref) == 'feat/codex-harness') ||
            (github.event_name == 'push' && (github.ref_name == 'feat/codex-harness' || startsWith(github.ref_name, 'ci/hillclimb/')))) &&
           '{"group":"codex-runners","labels":"codex-windows-x64-xl"}' ||
           '{"group":"codex-runners","labels":"codex-windows-x64"}') ||
        github.repository == 'openai/openai-agents-python' && inputs.runner == 'macos-latest' &&
          (inputs.native_source_run != '' && '"macos-15"' ||
           (github.event_name == 'push' && startsWith(github.ref_name, 'ci/hillclimb/')) &&
           '"macos-26-xlarge"' || '"macos-15-xlarge"') ||
        toJSON(inputs.runner)
      ) }}
    # PyPA manylinux 2026.11.07-1. See https://github.com/pypa/manylinux/actions/runs/42368406253.
    container: &native_build_image >-
      ${{ inputs.native_source_run == '' &&
        (inputs.runner == 'ubuntu-24.04' &&
          'quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36' ||
         inputs.runner == 'ubuntu-24.04-arm' &&
          'quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21')
        || '' }}
    outputs:
      artifact_id: ${{ steps.snapshot.outputs.artifact-id }}
      artifact_digest: ${{ steps.snapshot.outputs.artifact-digest }}
      native_provenance: ${{ steps.producer-identity.outputs.provenance }}
      direct_manual: ${{ steps.producer-identity.outputs.direct_manual }}
    # Allow cold builds of the bundled Codex runtime on the smaller ARM64, macOS and Windows runners.
    timeout-minutes: ${{ (inputs.runner == 'ubuntu-24.04-arm' || startsWith(inputs.runner, 'windows-') || startsWith(inputs.runner, 'macos-')) && 180 || 100 }}
    defaults:
      run:
        shell: bash
    env:
      OPENAI_AGENTS_NATIVE_BUILD_IMAGE: *native_build_image
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: 1.95.0
      OPENAI_AGENTS_NATIVE_TIMINGS: "1"
      MATURIN_PGO: ${{ inputs.runner == 'ubuntu-24.04' && 'true' || 'false' }}
      # PEP 517 frontends may copy only the wheel out of the backend directory.
      OPENAI_AGENTS_NATIVE_RECEIPT_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reject unbound build inputs
        run: |
          for config in .python-version uv.toml .venv; do
            if [[ -e "$config" || -L "$config" ]]; then
              echo "Native CI uses pyproject.toml; unsupported root build configuration: $config" >&2
              exit 1
            fi
          done
          if [[ -n "${OPENAI_AGENTS_NATIVE_BUILD_IMAGE:-}" ]]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fi
          native_bytecode=$(git ls-files -- ':(glob,icase)**/__pycache__' ':(glob,icase)**/__pycache__/**' ':(glob,icase)**/*.py[co]') || exit 1
          if [[ -n "$native_bytecode" ]]; then
            echo "Native CI rejects tracked Python bytecode and cache paths." >&2
            exit 1
          fi
      - name: Select the manylinux build environment
        if: env.OPENAI_AGENTS_NATIVE_BUILD_IMAGE != ''
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          {
            printf '%s\n' 'OPENAI_AGENTS_NATIVE_MANYLINUX=manylinux_2_28' 'OPENSSL_STATIC=1'
            printf 'OPENAI_AGENTS_NATIVE_RECEIPT_DIR=%s/dist\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
      - name: Check the Linux ARM64 build host
        if: inputs.runner == 'ubuntu-24.04-arm'
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          if [[ -z "$OPENAI_AGENTS_NATIVE_BUILD_IMAGE" ]]; then
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39"
          fi
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          getconf GNU_LIBC_VERSION
          df -h "$RUNNER_TEMP"
          # Leave CPU and memory headroom on the 16-core build runner.
          # Other events retain the standard 4-core GitHub-hosted runner.
          if [[ "$GITHUB_REPOSITORY" == openai/openai-agents-python &&
                "$GITHUB_EVENT_NAME" == push && ("$GITHUB_REF_NAME" == feat/codex-harness || "$GITHUB_REF_NAME" == ci/hillclimb/*) ]]; then
            echo "CARGO_BUILD_JOBS=14" >> "$GITHUB_ENV"
          else
            echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
          fi
      - name: Select shared Cargo directories
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-native-target" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/agents-native-uv" >> "$GITHUB_ENV"
          # Match Maturin's macOS environment before compiling shared dependencies.
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET:-11.0}" >> "$GITHUB_ENV"
            echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-undefined -C link-arg=dynamic_lookup" >> "$GITHUB_ENV"
          fi
      - name: Configure Linux dependency registries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME"
          if [[ -e "$CARGO_HOME/config" || -e "$CARGO_HOME/config.toml" ]]; then
            echo "Unexpected Cargo configuration in fresh CI directory." >&2
            exit 1
          fi
          cat > "$CARGO_HOME/config.toml" <<'TOML'
          [source.crates-io]
          replace-with = "socket-firewall"

          [source.socket-firewall]
          registry = "sparse+https://openai.firewall.socket.dev/cargo/"
          TOML
          {
            for variable in NPM_CONFIG_REGISTRY npm_config_registry PNPM_CONFIG_REGISTRY pnpm_config_registry COREPACK_NPM_REGISTRY YARN_NPM_REGISTRY_SERVER BUN_CONFIG_REGISTRY; do
              printf '%s=%s\n' "$variable" 'https://openai.firewall.socket.dev/npm/'
            done
            for variable in UV_DEFAULT_INDEX UV_INDEX_URL PIP_INDEX_URL; do
              printf '%s=%s\n' "$variable" 'https://openai.firewall.socket.dev/pypi/simple/'
            done
          } >> "$GITHUB_ENV"
      - name: Configure cold harness PR builds
        # The dependency cache uses the standard build settings.
        if: >-
          github.repository == 'openai/openai-agents-python' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.stack.base.ref || github.base_ref) == 'feat/codex-harness' &&
          inputs.native_source_run == '' && inputs.native_dependency_run == ''
        env:
          COLD_PR_RUST_OPT_LEVEL: ${{ runner.os == 'macOS' && 's' || '1' }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "MATURIN_PGO=false" >> "$GITHUB_ENV"
          else
            {
              echo "CARGO_PROFILE_RELEASE_LTO=off"
              echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
              echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=$COLD_PR_RUST_OPT_LEVEL"
            } >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: env.OPENAI_AGENTS_NATIVE_BUILD_IMAGE == ''
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Install a shared-library Python for the manylinux build
        if: env.OPENAI_AGENTS_NATIVE_BUILD_IMAGE != ''
        run: |
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/agents-build-python"
          uv python install --no-bin 3.12
          python="$(uv python find --managed-python 3.12)"
          libdir="$("$python" -I -S -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          test -f "$libdir/libpython3.12.so"
          printf '%s\n' "$(dirname -- "$python")" >> "$GITHUB_PATH"
          printf 'UV_PYTHON=%s\nPYO3_PYTHON=%s\n' "$python" "$python" >> "$GITHUB_ENV"
      - name: Install native build tools
        if: inputs.native_source_run == ''
        uses: ./.github/actions/setup-native
        env:
          OPENAI_AGENTS_RESTORE_NATIVE_DEPENDENCIES: ${{ inputs.native_dependency_run != '' && '1' || '0' }}
      - name: Report the Linux ARM64 build toolchain
        if: inputs.runner == 'ubuntu-24.04-arm'
        run: |
          rustc -vV
          rustc -vV | grep -Fx 'host: aarch64-unknown-linux-gnu'
          clang --version
      - name: Prepare the source distribution
        # Use one stable source path for Cargo, the wheel and the test executor.
        run: |
          uv build --sdist
          python -I -S - <<'PYTHON'
          import os
          import tarfile
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "agents-native-source"
          source.mkdir()
          archive_path, = Path("dist").glob("openai_agents-*.tar.gz")
          with tarfile.open(archive_path) as archive:
              archive.extractall(source, filter="data")
          extracted, = source.iterdir()
          project = source / "project"
          extracted.rename(project)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"OPENAI_AGENTS_BUILD_SOURCE={project.resolve()}\n")
          PYTHON
      - name: Restore verified Rust dependencies
        if: inputs.native_source_run == '' && inputs.native_dependency_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_DEPENDENCIES: ${{ inputs.native_dependencies }}
          NATIVE_DEPENDENCY_RUN: ${{ inputs.native_dependency_run }}
        run: python -I -S .github/scripts/native-dependencies.py restore
      - name: Download the qualified native build
        if: inputs.native_source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACTS: ${{ inputs.native_artifacts }}
          NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/agents-native-qualified
        run: python -I -S .github/scripts/download-native-snapshot.py
      - name: Select the qualified wheel and test executor
        if: inputs.native_source_run != ''
        run: |
          python -I -S - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "agents-native-qualified"
          wheel, = source.glob("openai_agents-*.whl")
          name = "exec-server-fixture" + (".exe" if os.name == "nt" else "")
          Path("dist").mkdir(exist_ok=True)
          shutil.copy2(source / name, Path("dist") / name)
          shutil.copy2(wheel, Path("dist") / wheel.name)
          shutil.copy2(wheel.with_name(wheel.name + ".pristine.json"), Path("dist") / (wheel.name + ".pristine.json"))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"OPENAI_AGENTS_NATIVE_WHEEL={wheel.resolve()}\n")
          PYTHON
      - name: Build the SDK and native runtime together
        if: inputs.native_source_run == ''
        run: uv build --wheel "$OPENAI_AGENTS_BUILD_SOURCE" --out-dir "$GITHUB_WORKSPACE/dist"
      - name: Test Windows project-search filename handling
        if: >-
          runner.os == 'Windows' && inputs.native_source_run == '' &&
          !(github.event_name == 'push' && github.ref_name == 'ci/hillclimb/python-windows-early-05')
        run: |
          python -I -S - <<'PYTHON'
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["OPENAI_AGENTS_BUILD_SOURCE"]) / "packages/codex"
          sys.path.insert(0, str(root / "scripts"))
          from native_env import cargo_build_options

          options, _ = cargo_build_options(root, dict(os.environ))
          subprocess.run(
              ["cargo", "test", "--locked", "--release", *options, "-p", "codex-exec-server",
               "--lib", "invalid_filename", "--", "--nocapture"],
              cwd=root / ".upstream/codex/codex-rs", check=True,
          )
          PYTHON
      - name: Build the shared test executor
        if: inputs.native_source_run == ''
        run: |
          python -I -S - <<'PYTHON'
          import os
          import shutil
          import subprocess
          import sys
          import sysconfig
          from pathlib import Path
          root = Path(os.environ["OPENAI_AGENTS_BUILD_SOURCE"]) / "packages/codex"
          fixture = Path("tests/fixtures/exec_server.rs")
          (root / fixture).parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(Path("packages/codex") / fixture, root / fixture)
          sys.path.insert(0, str(root / "scripts"))
          from native_env import build_environment, cargo_build_options
          environment = build_environment(root)
          options, build_target = cargo_build_options(root, environment)
          environment["PYO3_PYTHON"] = sys.executable
          if os.environ.get("OPENAI_AGENTS_NATIVE_BUILD_IMAGE"):
              libdir = sysconfig.get_config_var("LIBDIR")
              environment["LD_LIBRARY_PATH"] = os.pathsep.join(
                  part for part in (libdir, environment.get("LD_LIBRARY_PATH")) if part
              )
          environment.setdefault("RUST_MIN_STACK", str(16 * 1024 * 1024))
          # Compile the filtered binding regression without optimizing the entire
          # test harness. Keep dependencies and every packaged product optimized.
          if not (
              os.environ.get("RUNNER_OS") == "Windows"
              and os.environ.get("GITHUB_EVENT_NAME") == "push"
              and os.environ.get("GITHUB_REF_NAME") == "ci/hillclimb/python-windows-early-05"
          ):
              subprocess.run(
                  ["cargo", "test", "--release", "--locked", *options,
                   "--config", "profile.release.package.codex-agents-python.opt-level=0", "--lib",
                   "python_tools::managed_tests::prepared_request_rechecks_admission_after_no_edit_reply",
                   "--", "--exact"],
                  cwd=root, env=environment, check=True,
              )
          subprocess.run(["cargo", "build", "--release", "--locked", "--timings", *options, "--example", "exec-server-fixture"], cwd=root, env=environment, check=True)
          target = Path(environment["CARGO_TARGET_DIR"])
          if not target.is_absolute():
              target = root / target
          if build_target:
              target /= Path(build_target).stem
          name = "exec-server-fixture" + (".exe" if os.name == "nt" else "")
          shutil.copy2(target / "release" / "examples" / name, Path("dist") / name)
          PYTHON
      - name: Verify macOS executable symbol resolution
        if: runner.os == 'macOS'
        run: |
          python -I -S - <<'PYTHON'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          sys.path.insert(0, str(Path("packages/codex/scripts").resolve()))
          from native_helpers import native_helpers

          wheel, = Path("dist").glob("openai_agents-*.whl")
          expected = {f"agents/bin/{name}" for name in native_helpers("darwin")}
          with tempfile.TemporaryDirectory(prefix="agents-macos-symbols-") as directory:
              with ZipFile(wheel) as archive:
                  members = [info.filename for info in archive.infolist()
                             if info.filename.startswith("agents/bin/") and not info.is_dir()]
                  if set(members) != expected or len(members) != len(expected):
                      raise SystemExit("Wheel executable inventory differs from native_helpers")
                  products = []
                  for member in sorted(expected):
                      product = Path(directory) / Path(member).name
                      product.write_bytes(archive.read(member))
                      products.append(product)
              products.append(Path("dist/exec-server-fixture"))
              for product in products:
                  if not product.is_file():
                      raise SystemExit(f"Missing native executable: {product}")
                  result = subprocess.run(["xcrun", "nm", "-m", "-u", str(product)],
                                          capture_output=True, text=True, check=True)
                  if "(dynamically looked up)" in result.stdout:
                      raise SystemExit(f"Deferred symbols in {product.name}:\n{result.stdout}")
                  print(f"Verified linked imports: {product.name}")
          PYTHON
      - name: Preserve captured producer identity
        id: producer-identity
        env:
          NATIVE_PROVENANCE: ${{ inputs.native_provenance }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python -I -S - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          direct_manual = (os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
                           and os.environ["CALLER_WORKFLOW_REF"].split("@", 1)[0]
                           == os.environ["GITHUB_REPOSITORY"] + "/.github/workflows/codex-python.yml")
          value = os.environ["NATIVE_PROVENANCE"]
          if direct_manual:
              value = json.dumps({"repository_id": os.environ["GITHUB_REPOSITORY_ID"],
                                  "source_sha": os.environ["GITHUB_SHA"],
                                  "head_ref": os.environ["GITHUB_REF_NAME"],
                                  "run_id": os.environ["GITHUB_RUN_ID"],
                                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                                  "pull_request": None}, sort_keys=True)
          elif not value:
              raise SystemExit("Native producer identity is required outside direct manual runs")
          json.loads(value)
          Path("dist/native-provenance.json").write_text(value)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("provenance=" + value + "\n")
              output.write("direct_manual=" + str(direct_manual).lower() + "\n")
          PYTHON
      - name: Identify native build inputs
        id: native-inputs
        run: |
          python -I -S - <<'PYTHON'
          import os
          import runpy
          from pathlib import Path
          identity = runpy.run_path('packages/codex/scripts/source_integrity.py')['native_bundle_identity'](Path('.'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('identity=' + identity + '\n')
          PYTHON
      - name: Verify the lower-glibc Linux package
        if: env.OPENAI_AGENTS_NATIVE_BUILD_IMAGE != ''
        run: |
          python -I -S - <<'PYTHON'
          import platform
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          sys.path.insert(0, str(Path("packages/codex/scripts").resolve()))
          from native_helpers import native_helpers

          def verify_elf(path, name):
              versions = subprocess.check_output(["readelf", "-W", "-V", str(path)], text=True)
              dynamic = subprocess.check_output(["readelf", "-W", "-d", str(path)], text=True)
              required = {
                  (int(major), int(minor))
                  for major, minor in re.findall(r"\bGLIBC_(\d+)\.(\d+)", versions)
              }
              major, minor = max(required, default=(0, 0))
              if (major, minor) > (2, 28):
                  raise SystemExit(f"{name} requires glibc {major}.{minor}, above 2.28")
              # Older readelf versions can display DT_RELR by its numeric tag.
              if "GLIBC_ABI_DT_RELR" in versions or re.search(r"^\s*0x0*24\s", dynamic, re.M):
                  raise SystemExit(f"{name} requires DT_RELR")
              if re.search(r"NEEDED.*\[lib(?:crypto|ssl)\.so", dynamic):
                  raise SystemExit(f"{name} requires a system OpenSSL library")
              print(f"Verified manylinux 2.28 ABI: {name}")

          wheel, = Path("dist").glob("openai_agents-*.whl")
          if not wheel.name.endswith(f"-manylinux_2_28_{platform.machine()}.whl"):
              raise SystemExit(f"Unexpected manylinux wheel tag: {wheel.name}")
          expected = {"agents/_native.abi3.so"}
          expected.update(f"agents/bin/{name}" for name in native_helpers("linux"))
          found = set()
          with tempfile.TemporaryDirectory() as directory, ZipFile(wheel) as archive:
              if "agents/licenses/OPENSSL_LICENSE" not in archive.namelist():
                  raise SystemExit("Wheel is missing the bundled OpenSSL license")
              for index, member in enumerate(archive.infolist()):
                  with archive.open(member) as source:
                      magic = source.read(4)
                      if magic != b"\x7fELF":
                          continue
                      path = Path(directory) / str(index)
                      with path.open("wb") as output:
                          output.write(magic)
                          shutil.copyfileobj(source, output)
                      verify_elf(path, member.filename)
                      found.add(member.filename)
          if missing := expected - found:
              raise SystemExit(f"Missing Linux native components: {sorted(missing)}")
          verify_elf(Path("dist/exec-server-fixture"), "exec-server-fixture")
          PYTHON
          smoke_env="$RUNNER_TEMP/manylinux-smoke"
          uv venv --python /opt/python/cp310-cp310/bin/python "$smoke_env"
          uv pip install --no-build --link-mode copy --python "$smoke_env/bin/python" \
            "$GITHUB_WORKSPACE"/dist/openai_agents-*.whl
          "$smoke_env/bin/python" -I packages/codex/scripts/verify_installed.py \
            --output "$RUNNER_TEMP/manylinux-installed.json"
      - name: Publish the native snapshot
        id: snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-snapshot-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-inputs.outputs.identity }}
          path: |
            dist/*.whl
            dist/*.whl.pristine.json
            dist/exec-server-fixture*
            dist/native-provenance.json
          if-no-files-found: error
          retention-days: 90
      - name: Prepare Rust dependency cache
        if: github.event_name == 'push' && inputs.native_source_run == '' && inputs.runner != 'ubuntu-24.04-arm' && (inputs.runner != 'windows-latest' || github.ref_name != 'ci/hillclimb/python-windows-early-05')
        run: python -I -S .github/scripts/native-dependencies.py pack
      - name: Publish Rust dependencies
        if: github.event_name == 'push' && inputs.native_source_run == '' && inputs.runner != 'ubuntu-24.04-arm' && (inputs.runner != 'windows-latest' || github.ref_name != 'ci/hillclimb/python-windows-early-05')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-dependencies-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/native-dependencies.tar
            dist/native-dependencies.json
            dist/native-provenance.json
          compression-level: 1
          if-no-files-found: error
          retention-days: 14
      - name: Report native build configuration
        if: always()
        env:
          NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
        run: |
          if [[ "$RUNNER_OS/$RUNNER_ARCH" == Linux/ARM64 ]]; then
            df -h "$RUNNER_TEMP"
          fi
          python -I -S - <<'PYTHON'
          import os
          from pathlib import Path
          donor = os.environ["NATIVE_SOURCE_RUN"]
          if donor:
              source = f"Qualified native artifact from run {donor}"
          else:
              source = "Compiled native package"
          cpus = os.cpu_count()
          jobs = os.environ.get("CARGO_BUILD_JOBS", f"Cargo default ({cpus} logical CPUs)")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"### Native build\n\n{source}\n\n")
              summary.write(f"Runner: {os.environ.get('RUNNER_OS')} / {os.environ.get('RUNNER_ARCH')}; Cargo jobs: {jobs}\n\n")
              summary.write("See the named workflow steps for snapshot transfer, wheel build, executor build and installation-check durations.\n")
              if not donor:
                  summary.write("Cargo compilation and concurrency reports, when produced, are in the native-timings artifact.\n")
          PYTHON
      - name: Share native compilation timings
        if: always() && inputs.native_source_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-timings-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/agents-native-target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  windows-filename:
    name: Windows project-search filename regression
    if: >-
      inputs.runner == 'windows-latest' && inputs.native_source_run == '' &&
      github.event_name == 'push' && github.ref_name == 'ci/hillclimb/python-windows-early-05'
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && '{"group":"codex-runners","labels":"codex-windows-x64"}' || '"windows-latest"') }}
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: 1.95.0
      OPENAI_AGENTS_BUILD_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Select isolated Cargo directories
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-filename-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-filename-target" >> "$GITHUB_ENV"
      - name: Install native build tools
        uses: ./.github/actions/setup-native
      - name: Prepare the pinned Codex and RMCP source
        run: python -I -S packages/codex/scripts/prepare_codex.py
      - name: Test Windows project-search filename handling
        run: |
          python -I -S - <<'PYTHON'
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["OPENAI_AGENTS_BUILD_SOURCE"]) / "packages/codex"
          sys.path.insert(0, str(root / "scripts"))
          from native_env import cargo_build_options

          options, _ = cargo_build_options(root, dict(os.environ))
          subprocess.run(
              ["cargo", "test", "--locked", "--release", *options, "-p", "codex-exec-server",
               "--lib", "invalid_filename", "--", "--nocapture"],
              cwd=root / ".upstream/codex/codex-rs", check=True,
          )
          PYTHON
      - name: Run the exact native binding admission regression
        run: |
          python -I -S - <<'PYTHON'
          import os
          import subprocess
          import sys
          from pathlib import Path
          root = Path(os.environ["OPENAI_AGENTS_BUILD_SOURCE"]) / "packages/codex"
          sys.path.insert(0, str(root / "scripts"))
          from native_env import build_environment, cargo_build_options
          environment = build_environment(root)
          options, _ = cargo_build_options(root, environment)
          environment["PYO3_PYTHON"] = sys.executable
          environment.setdefault("RUST_MIN_STACK", str(16 * 1024 * 1024))
          subprocess.run(
              ["cargo", "test", "--release", "--locked", *options,
               "--config", "profile.release.package.codex-agents-python.opt-level=0", "--lib",
               "python_tools::managed_tests::prepared_request_rechecks_admission_after_no_edit_reply",
               "--", "--exact"],
              cwd=root, env=environment, check=True,
          )
          PYTHON
      - name: Verify the prepared native source after testing
        run: |
          python -I -S - <<'PYTHON'
          import sys
          from pathlib import Path
          root = Path("packages/codex").resolve()
          sys.path.insert(0, str(root / "scripts"))
          from source_integrity import verify_pristine_source, verify_rmcp_source
          verify_pristine_source(root)
          verify_rmcp_source(root)
          PYTHON

  qualify-manual:
    needs: build
    if: needs.build.outputs.direct_manual == 'true'
    uses: ./.github/workflows/codex-python-qualify.yml
    with:
      runner: ${{ inputs.runner }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      native_provenance: ${{ needs.build.outputs.native_provenance }}
