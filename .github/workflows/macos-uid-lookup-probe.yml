name: macOS UID lookup capture probe
on:
  push:
    branches: [codex/macos-uid-lookup-probe-20261111-1023]
permissions:
  contents: read
jobs:
  capture-deny:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Compile bounded local witness
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.c" <<'PROBE_SOURCE'
          #include <mach/mach.h>
          #include <mach/task_special_ports.h>
          #include <servers/bootstrap.h>
          #include <xpc/xpc.h>
          #include <spawn.h>
          #include <pthread.h>
          #include <stdatomic.h>
          #include <signal.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include <sys/wait.h>
          #include <time.h>
          #include <unistd.h>
          extern char **environ;
          extern int posix_spawnattr_setspecialport_np(posix_spawnattr_t *, mach_port_t, int);
          extern int posix_spawnattr_set_registered_ports_np(posix_spawnattr_t *, mach_port_t *, uint32_t);
          extern int xpc_pipe_receive(mach_port_t, xpc_object_t *);
          extern void *xpc_pipe_create_from_port(mach_port_t, uint64_t);
          extern int xpc_pipe_routine(void *,xpc_object_t,xpc_object_t *);
          extern int xpc_pipe_routine_reply(xpc_object_t);
          extern void xpc_dictionary_get_audit_token(xpc_object_t,audit_token_t *);
          struct server { mach_port_t sink; pid_t child; _Atomic bool stop; _Atomic int count; };
          static const char *names[]={"com.apple.system.opendirectoryd.libinfo","com.apple.system.DirectoryService.libinfo_v1","com.apple.system.opendirectoryd.membership"};
          static void *receive_requests(void *arg) {
            struct server *s=arg;
            while(!atomic_load(&s->stop)) {
              xpc_object_t request=NULL;
              int error=xpc_pipe_receive(s->sink,&request);
              if(error) { if(atomic_load(&s->stop))break; printf("{\"decoder_error\":%d}\n",error); usleep(1000); continue; }
              if(!request)continue;
              atomic_fetch_add(&s->count,1);
              audit_token_t token={0}; xpc_dictionary_get_audit_token(request,&token);
              bool owner=(pid_t)token.val[5]==s->child;
              bool probe=xpc_dictionary_get_bool(request,"_codex_probe");
              if(probe)printf("{\"post_exec_verified\":%s}\n",owner?"true":"false");
              else {
                printf("{\"request_owner_matches\":%s,\"keys\":[",owner?"true":"false");
                __block bool first=true;
                xpc_dictionary_apply(request,^bool(const char *key,xpc_object_t value) {
                  bool safe=strlen(key)<=64;
                  for(const char *p=key;*p;p++) if(!((*p>='a'&&*p<='z')||(*p>='A'&&*p<='Z')||(*p>='0'&&*p<='9')||*p=='_'||*p=='-'||*p=='.'))safe=false;
                  if(safe) { printf("%s\"%s\"",first?"":",",key);first=false; }
                  if(xpc_get_type(value)==XPC_TYPE_STRING) {
                    const char *text=xpc_string_get_string_ptr(value);
                    for(size_t i=0;i<sizeof(names)/sizeof(names[0]);i++) if(!strcmp(text,names[i]))fprintf(stderr,"{\"recognized_service\":\"%s\",\"key\":\"%s\"}\n",names[i],safe?key:"unidentified");
                  }
                  return true;
                });
                printf("]");
                const char *numbers[]={"subsystem","routine","type","handle","flags","targetpid"};
                for(size_t i=0;i<sizeof(numbers)/sizeof(numbers[0]);i++) {
                  xpc_object_t value=xpc_dictionary_get_value(request,numbers[i]);
                  if(value && xpc_get_type(value)==XPC_TYPE_UINT64)printf(",\"%s\":%llu",numbers[i],(unsigned long long)xpc_uint64_get_value(value));
                  if(value && xpc_get_type(value)==XPC_TYPE_INT64)printf(",\"%s\":%lld",numbers[i],(long long)xpc_int64_get_value(value));
                }
                printf("}\n");
              }
              xpc_object_t reply=xpc_dictionary_create_reply(request);
              if(reply) {
                xpc_dictionary_set_int64(reply,"error",ENOTSUP);
                if(probe && owner)xpc_dictionary_set_bool(reply,"_codex_probe_ack",true);
                int sent=xpc_pipe_routine_reply(reply);
                if(sent)printf("{\"denial_reply_error\":%d}\n",sent);
                xpc_release(reply);
              }
              xpc_release(request); fflush(stdout);
            }
            return NULL;
          }
          int main(int argc,char **argv) {
            if(argc==2 && !strcmp(argv[1],"--post-exec")) {
              mach_port_t current=MACH_PORT_NULL;
              if(task_get_special_port(mach_task_self(),TASK_BOOTSTRAP_PORT,&current)!=KERN_SUCCESS || current==MACH_PORT_NULL || current!=bootstrap_port)return 120;
              void *pipe=xpc_pipe_create_from_port(current,0); if(!pipe)return 121;
              xpc_object_t request=xpc_dictionary_create(NULL,NULL,0),reply=NULL;
              xpc_dictionary_set_bool(request,"_codex_probe",true);
              int error=xpc_pipe_routine(pipe,request,&reply);
              bool ok=error==0 && reply && xpc_dictionary_get_bool(reply,"_codex_probe_ack");
              xpc_release(request); if(reply)xpc_release(reply); xpc_release((xpc_object_t)pipe);
              if(!ok)return 122;
              int null=open("/dev/null",O_RDWR); if(null<0 || dup2(null,1)<0 || dup2(null,2)<0)return 123;
              execl("/usr/bin/id","id","-F",(char*)NULL);return 124;
            }
            struct server server={0};
            if(mach_port_allocate(mach_task_self(),MACH_PORT_RIGHT_RECEIVE,&server.sink)!=KERN_SUCCESS || mach_port_insert_right(mach_task_self(),server.sink,server.sink,MACH_MSG_TYPE_MAKE_SEND)!=KERN_SUCCESS)return 125;
            posix_spawnattr_t attr; posix_spawnattr_init(&attr);
            mach_port_t empty[3]={0};
            if(posix_spawnattr_set_registered_ports_np(&attr,empty,3) || posix_spawnattr_setspecialport_np(&attr,server.sink,TASK_BOOTSTRAP_PORT))return 126;
            posix_spawnattr_setflags(&attr,POSIX_SPAWN_SETPGROUP);posix_spawnattr_setpgroup(&attr,0);
            char *args[]={argv[0],"--post-exec",NULL};
            if(posix_spawn(&server.child,argv[0],NULL,&attr,args,environ))return 127;
            posix_spawnattr_destroy(&attr);
            pthread_t thread; if(pthread_create(&thread,NULL,receive_requests,&server))return 128;
            int status=0; bool timed_out=true;
            for(int i=0;i<300;i++){if(waitpid(server.child,&status,WNOHANG)==server.child){timed_out=false;break;}usleep(10000);}
            if(timed_out){kill(-server.child,SIGKILL);kill(server.child,SIGKILL);waitpid(server.child,&status,0);}
            atomic_store(&server.stop,true);mach_port_mod_refs(mach_task_self(),server.sink,MACH_PORT_RIGHT_RECEIVE,-1);pthread_join(thread,NULL);mach_port_deallocate(mach_task_self(),server.sink);
            printf("{\"command\":\"id\",\"decoder\":\"system-xpc-pipe\",\"exit\":%d,\"signal\":%d,\"timed_out\":%s,\"messages\":%d}\n",WIFEXITED(status)?WEXITSTATUS(status):-1,WIFSIGNALED(status)?WTERMSIG(status):0,timed_out?"true":"false",atomic_load(&server.count));
            return 0;
          }
          PROBE_SOURCE
          clang -fblocks -Wall -Wextra -Werror "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe"
      - name: Decode and deny lookup protocol keys
        shell: bash
        run: |
          "$RUNNER_TEMP/probe"
