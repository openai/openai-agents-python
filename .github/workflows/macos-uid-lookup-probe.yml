name: macOS UID lookup capture probe
on:
  push:
    branches: [codex/macos-uid-lookup-probe-20261111-1023]
permissions:
  contents: read
jobs:
  capture-deny:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Compile bounded local witness
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.c" <<'PROBE_SOURCE'
          #include <mach/mach.h>
          #include <mach/mig_errors.h>
          #include <mach/ndr.h>
          #include <mach/task_special_ports.h>
          #include <servers/bootstrap.h>
          #include <spawn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <pthread.h>
          #include <stdatomic.h>
          extern char **environ;
          static unsigned char lookup_template[512];
          static size_t lookup_template_size;
          static mach_msg_id_t lookup_template_id;
          extern int posix_spawnattr_setspecialport_np(posix_spawnattr_t *, mach_port_t, int);
          extern int posix_spawnattr_set_registered_ports_np(posix_spawnattr_t *, mach_port_t *, uint32_t);
          #include <errno.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/wait.h>
          #include <time.h>
          #include <unistd.h>
          
          static const char *self;
          static const mach_msg_id_t sentinel_id = 0x434458;
          struct sentinel { mach_msg_header_t h; uint32_t global_matches_task; };
          #pragma pack(push,4)
          struct identity_lookup { mach_msg_header_t h; NDR_record_t ndr; char name[128]; int32_t target; unsigned char instance[16]; uint64_t flags; };
          #pragma pack(pop)
          _Static_assert(sizeof(struct identity_lookup)==188,"lookup wire size");
          
          static const char *names[] = {
            "com.apple.system.opendirectoryd.libinfo_debug",
            "com.apple.system.opendirectoryd.libinfo",
            "com.apple.system.DirectoryService.libinfo_v1",
            "com.apple.system.opendirectoryd.membership",
            "com.apple.xpc.launchd"
          };
          static const char *identity(const void *data, size_t size) {
            const unsigned char *p = data;
            for (size_t n=0; n<sizeof(names)/sizeof(names[0]); n++) {
              size_t len=strlen(names[n]);
              for (size_t i=0; i+len<size; i++)
                if (!memcmp(p+i,names[n],len) && p[i+len]==0) return names[n];
            }
            return "unidentified";
          }
          static int64_t millis(void) {
            struct timespec t; clock_gettime(CLOCK_MONOTONIC,&t);
            return (int64_t)t.tv_sec*1000+t.tv_nsec/1000000;
          }
          static void witness(const char *command, int mode) {
            mach_port_t task=mach_task_self(), sink=MACH_PORT_NULL;
            if (mode>=2 && (mach_port_allocate(task,MACH_PORT_RIGHT_RECEIVE,&sink)!=KERN_SUCCESS ||
                mach_port_insert_right(task,sink,sink,MACH_MSG_TYPE_MAKE_SEND)!=KERN_SUCCESS)) exit(120);
            posix_spawnattr_t attr; posix_spawn_file_actions_t files;
            if(posix_spawnattr_init(&attr) || posix_spawn_file_actions_init(&files)) exit(121);
            if(posix_spawnattr_setflags(&attr,POSIX_SPAWN_SETPGROUP) || posix_spawnattr_setpgroup(&attr,0)) exit(122);
            if(mode!=0) {
              mach_port_t empty[3]={MACH_PORT_NULL,MACH_PORT_NULL,MACH_PORT_NULL};
              int ports=posix_spawnattr_set_registered_ports_np(&attr,empty,3);
              int bootstrap=posix_spawnattr_setspecialport_np(&attr,mode>=2?sink:MACH_PORT_NULL,TASK_BOOTSTRAP_PORT);
              if(ports || bootstrap) { printf("{\"spawn_registered_error\":%d,\"spawn_bootstrap_error\":%d}\n",ports,bootstrap); exit(123); }
            }
            if(mode<2 && (posix_spawn_file_actions_addopen(&files,1,"/dev/null",O_RDWR,0) || posix_spawn_file_actions_addopen(&files,2,"/dev/null",O_RDWR,0))) exit(124);
            char *id_args[]={"/usr/bin/id","-F",NULL};
            char *ssh_args[]={"/usr/bin/ssh","-G","-F","/dev/null","-o","CanonicalizeHostname=no","-o","ProxyCommand=none","example.invalid",NULL};
            char *captured_args[]={(char*)self,"--post-exec",(char*)command,NULL};
            char **args=mode>=2?captured_args:!strcmp(command,"id")?id_args:ssh_args;
            fflush(stdout); pid_t child;
            int spawn=posix_spawn(&child,args[0],&files,&attr,args,environ);
            posix_spawn_file_actions_destroy(&files); posix_spawnattr_destroy(&attr);
            if(spawn) { printf("{\"spawn_error\":%d}\n",spawn); exit(125); }
            int status=0, received=0; bool timed_out=false;
            int64_t deadline=millis()+3000;
            while (waitpid(child,&status,WNOHANG)==0) {
              if (millis()>deadline) { timed_out=true; kill(-child,SIGKILL); kill(child,SIGKILL); waitpid(child,&status,0); break; }
              if (mode<2) { usleep(10000); continue; }
              union { mach_msg_header_t h; unsigned char bytes[65536]; } message;
              memset(&message,0,sizeof(message));
              kern_return_t kr=mach_msg(&message.h,MACH_RCV_MSG|MACH_RCV_TIMEOUT|MACH_RCV_VOUCHER|MACH_RCV_TRAILER_TYPE(MACH_MSG_TRAILER_FORMAT_0)|MACH_RCV_TRAILER_ELEMENTS(MACH_RCV_TRAILER_AUDIT),0,sizeof(message),sink,50,MACH_PORT_NULL);
              if (kr==MACH_RCV_TIMED_OUT) continue;
              if (kr!=KERN_SUCCESS) { printf("{\"receive_error\":%d}\n",kr); kill(-child,SIGKILL); kill(child,SIGKILL); waitpid(child,&status,0); break; }
              received++;
              unsigned count=0; const char *service=identity(message.bytes,message.h.msgh_size);
              if (message.h.msgh_id==sentinel_id && message.h.msgh_size==sizeof(struct sentinel)) {
                struct sentinel *note=(void*)&message;
                printf("{\"command\":\"%s\",\"post_exec_bootstrap_present\":true,\"global_matches_task\":%s}\n",command,note->global_matches_task?"true":"false");
                service="probe-post-exec-sentinel";
              }
              if ((message.h.msgh_bits&MACH_MSGH_BITS_COMPLEX) && message.h.msgh_size>=sizeof(mach_msg_header_t)+sizeof(mach_msg_body_t)) {
                mach_msg_body_t *body=(void*)(message.bytes+sizeof(mach_msg_header_t));
                count=body->msgh_descriptor_count;
                unsigned char *p=(unsigned char*)(body+1), *end=message.bytes+message.h.msgh_size;
                for (unsigned i=0;i<count && i<8 && p+sizeof(mach_msg_type_descriptor_t)<=end;i++) {
                  mach_msg_descriptor_t *d=(void*)p; size_t size=0;
                  switch(d->type.type) {
                    case MACH_MSG_PORT_DESCRIPTOR: size=sizeof(mach_msg_port_descriptor_t); break;
                    case MACH_MSG_OOL_DESCRIPTOR:
                    case MACH_MSG_OOL_VOLATILE_DESCRIPTOR:
                      size=sizeof(mach_msg_ool_descriptor_t);
                      if (p+size<=end && d->out_of_line.address && d->out_of_line.size<=65536) {
                        const char *found=identity(d->out_of_line.address,d->out_of_line.size);
                        if (strcmp(found,"unidentified")) service=found;
                      }
                      break;
                    case MACH_MSG_OOL_PORTS_DESCRIPTOR: size=sizeof(mach_msg_ool_ports_descriptor_t); break;
                    default: size=0; break;
                  }
                  if (!size || p+size>end) break;
                  p+=size;
                }
              }
              printf("{\"command\":\"%s\",\"message_id\":%d,\"size\":%u,\"complex\":%s,\"descriptors\":%u,\"recognized_service\":\"%s\"}\n",command,message.h.msgh_id,message.h.msgh_size,(message.h.msgh_bits&MACH_MSGH_BITS_COMPLEX)?"true":"false",count,service);
              if(message.h.msgh_id==0x40000324) printf("{\"command\":\"%s\",\"lookup_header_remote_type\":%u,\"voucher_present\":%s,\"expected_size\":%zu}\n",command,MACH_MSGH_BITS_REMOTE(message.h.msgh_bits),message.h.msgh_voucher_port?"true":"false",sizeof(struct identity_lookup));
              if(mode==3 && !(message.h.msgh_bits&MACH_MSGH_BITS_COMPLEX) && message.h.msgh_size>sizeof(message.h) && message.h.msgh_size-sizeof(message.h)<=sizeof(lookup_template) && !strcmp(service,"com.apple.system.opendirectoryd.libinfo") && MACH_MSGH_BITS_REMOTE(message.h.msgh_bits)==MACH_MSG_TYPE_MOVE_SEND_ONCE) {
                size_t offset=(message.h.msgh_size+3u)&~3u;mach_msg_audit_trailer_t *audit=(void*)(message.bytes+offset);
                if(audit->msgh_trailer_type==MACH_MSG_TRAILER_FORMAT_0 && audit->msgh_trailer_size>=sizeof(*audit) && (pid_t)audit->msgh_audit.val[5]==child) {
                  lookup_template_size=message.h.msgh_size-sizeof(message.h);lookup_template_id=message.h.msgh_id;
                  memcpy(lookup_template,message.bytes+sizeof(message.h),lookup_template_size);
                  printf("{\"trusted_system_uid_template_id\":%d,\"body_size\":%zu}\n",lookup_template_id,lookup_template_size);
                }
              }
              /* The host's public serializer has been defining the sole admitted lookup. */
              if (mode==2 && message.h.msgh_id==lookup_template_id && message.h.msgh_size==sizeof(message.h)+lookup_template_size && !(message.h.msgh_bits&MACH_MSGH_BITS_COMPLEX) && MACH_MSGH_BITS_REMOTE(message.h.msgh_bits)==MACH_MSG_TYPE_MOVE_SEND_ONCE) {
                size_t offset=(message.h.msgh_size+3u)&~3u;
                mach_msg_audit_trailer_t *audit=(void*)(message.bytes+offset);
                bool owner=audit->msgh_trailer_type==MACH_MSG_TRAILER_FORMAT_0 && audit->msgh_trailer_size>=sizeof(*audit) && (pid_t)audit->msgh_audit.val[5]==child;
                bool same=!memcmp(message.bytes+sizeof(message.h),lookup_template,lookup_template_size);
                printf("{\"command\":\"%s\",\"trusted_body_matches\":%s,\"owner_matches\":%s}\n",command,same?"true":"false",owner?"true":"false");
                if (owner && same) {
                  mach_port_t voucher=message.h.msgh_voucher_port;
                  message.h.msgh_voucher_port=MACH_PORT_NULL;
                  message.h.msgh_bits &= ~MACH_MSGH_BITS_VOUCHER_MASK;
                  kern_return_t disposed=voucher==MACH_PORT_NULL?KERN_SUCCESS:mach_port_deallocate(task,voucher);
                  printf("{\"command\":\"%s\",\"voucher_disposal_result\":%d}\n",command,disposed);
                  if(disposed!=KERN_SUCCESS) { mach_msg_destroy(&message.h); continue; }
                  mach_port_t reply=message.h.msgh_remote_port, local_reply=MACH_PORT_NULL;
                  if(mach_port_allocate(task,MACH_PORT_RIGHT_RECEIVE,&local_reply)!=KERN_SUCCESS) exit(144);
                  message.h.msgh_remote_port=bootstrap_port; message.h.msgh_local_port=local_reply;
                  message.h.msgh_bits=MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND,MACH_MSG_TYPE_MAKE_SEND_ONCE);
                  kr=mach_msg(&message.h,MACH_SEND_MSG|MACH_SEND_TIMEOUT,message.h.msgh_size,0,MACH_PORT_NULL,100,MACH_PORT_NULL);
                  printf("{\"command\":\"%s\",\"identity_lookup_forward_result\":%d}\n",command,kr);
                  if(kr==KERN_SUCCESS) {
                    union {mach_msg_header_t h;unsigned char bytes[65536];} response={0};
                    kr=mach_msg(&response.h,MACH_RCV_MSG|MACH_RCV_TIMEOUT|MACH_RCV_VOUCHER|MACH_RCV_TRAILER_TYPE(MACH_MSG_TRAILER_FORMAT_0)|MACH_RCV_TRAILER_ELEMENTS(MACH_RCV_TRAILER_AUDIT),0,sizeof(response),local_reply,500,MACH_PORT_NULL);
                    printf("{\"command\":\"%s\",\"identity_reply_receive\":%d,\"identity_reply_id\":%d,\"identity_reply_size\":%u}\n",command,kr,response.h.msgh_id,response.h.msgh_size);
                    if(kr==KERN_SUCCESS) {
                      size_t ro=(response.h.msgh_size+3u)&~3u;mach_msg_audit_trailer_t *ra=(void*)(response.bytes+ro);
                      bool trusted=ra->msgh_trailer_type==MACH_MSG_TRAILER_FORMAT_0 && ra->msgh_trailer_size>=sizeof(*ra) && ra->msgh_audit.val[1]==0;
                      bool shape=response.h.msgh_id==0x20000000 && response.h.msgh_remote_port==MACH_PORT_NULL;
                      unsigned rights=0;
                      if(response.h.msgh_bits&MACH_MSGH_BITS_COMPLEX) {
                        mach_msg_body_t *body=(void*)(response.bytes+sizeof(response.h));rights=body->msgh_descriptor_count;
                        mach_msg_port_descriptor_t *right=(void*)(body+1);
                        shape=shape && rights==1 && response.h.msgh_size>=sizeof(response.h)+sizeof(*body)+sizeof(*right) && right->type==MACH_MSG_PORT_DESCRIPTOR && right->disposition==MACH_MSG_TYPE_MOVE_SEND;
                      }
                      printf("{\"command\":\"%s\",\"root_reply_owner\":%s,\"reply_shape\":%s,\"returned_rights\":%u}\n",command,trusted?"true":"false",shape?"true":"false",rights);
                      if(response.h.msgh_voucher_port) {mach_port_deallocate(task,response.h.msgh_voucher_port);response.h.msgh_voucher_port=MACH_PORT_NULL;response.h.msgh_bits&=~MACH_MSGH_BITS_VOUCHER_MASK;}
                      if(trusted && shape) {
                        response.h.msgh_remote_port=reply;response.h.msgh_local_port=MACH_PORT_NULL;
                        response.h.msgh_bits=MACH_MSGH_BITS(MACH_MSG_TYPE_MOVE_SEND_ONCE,0)|(response.h.msgh_bits&MACH_MSGH_BITS_COMPLEX);
                        kr=mach_msg(&response.h,MACH_SEND_MSG|MACH_SEND_TIMEOUT,response.h.msgh_size,0,MACH_PORT_NULL,100,MACH_PORT_NULL);
                        printf("{\"command\":\"%s\",\"identity_reply_forward_result\":%d}\n",command,kr);
                        if(kr!=KERN_SUCCESS)mach_msg_destroy(&response.h);
                        mach_port_mod_refs(task,local_reply,MACH_PORT_RIGHT_RECEIVE,-1);
                        continue;
                      }
                      mach_msg_destroy(&response.h);
                    }
                  }
                  mach_port_mod_refs(task,local_reply,MACH_PORT_RIGHT_RECEIVE,-1);
                  message.h.msgh_remote_port=reply; message.h.msgh_local_port=MACH_PORT_NULL;
                  message.h.msgh_bits=MACH_MSGH_BITS(MACH_MSG_TYPE_MOVE_SEND_ONCE,0);
                }
              }
              /* All other requests have been denied, including transferred rights. */
              if (message.h.msgh_remote_port!=MACH_PORT_NULL) {
                mig_reply_error_t reply={0};
                reply.Head.msgh_bits=MACH_MSGH_BITS(MACH_MSGH_BITS_REMOTE(message.h.msgh_bits),0);
                reply.Head.msgh_size=sizeof(reply); reply.Head.msgh_remote_port=message.h.msgh_remote_port;
                reply.Head.msgh_id=message.h.msgh_id+100; reply.NDR=NDR_record; reply.RetCode=MIG_BAD_ID;
                message.h.msgh_remote_port=MACH_PORT_NULL;
                kr=mach_msg(&reply.Head,MACH_SEND_MSG|MACH_SEND_TIMEOUT,sizeof(reply),0,MACH_PORT_NULL,100,MACH_PORT_NULL);
                if (kr!=KERN_SUCCESS) mach_msg_destroy(&reply.Head);
              }
              if(message.h.msgh_voucher_port!=MACH_PORT_NULL) {
                mach_port_deallocate(task,message.h.msgh_voucher_port);
                message.h.msgh_voucher_port=MACH_PORT_NULL;
                message.h.msgh_bits &= ~MACH_MSGH_BITS_VOUCHER_MASK;
              }
              mach_msg_destroy(&message.h);
            }
            printf("{\"command\":\"%s\",\"mode\":\"%s\",\"exit\":%d,\"signal\":%d,\"timed_out\":%s,\"messages\":%d}\n",command,mode==0?"host":mode==1?"cleared":mode==3?"trusted-system-emitter":"identity-only",WIFEXITED(status)?WEXITSTATUS(status):-1,WIFSIGNALED(status)?WTERMSIG(status):0,timed_out?"true":"false",received);
            if (mode>=2) {
              mach_port_mod_refs(task,sink,MACH_PORT_RIGHT_RECEIVE,-1);
              mach_port_deallocate(task,sink);
          
            }
          }
          int main(int argc, char **argv) {
            self=argv[0];
            if (argc==3 && !strcmp(argv[1],"--post-exec")) {
              mach_port_t endpoint=MACH_PORT_NULL, reply=MACH_PORT_NULL;
              if (task_get_special_port(mach_task_self(),TASK_BOOTSTRAP_PORT,&endpoint)!=KERN_SUCCESS || endpoint==MACH_PORT_NULL ||
                  mach_port_allocate(mach_task_self(),MACH_PORT_RIGHT_RECEIVE,&reply)!=KERN_SUCCESS) return 128;
              struct sentinel note={0}; note.h.msgh_bits=MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND,MACH_MSG_TYPE_MAKE_SEND_ONCE);
              note.h.msgh_size=sizeof(note); note.h.msgh_remote_port=endpoint; note.h.msgh_local_port=reply;
              note.h.msgh_id=sentinel_id; note.global_matches_task=bootstrap_port==endpoint;
              kern_return_t sent=mach_msg(&note.h,MACH_SEND_MSG|MACH_SEND_TIMEOUT,sizeof(note),0,MACH_PORT_NULL,500,MACH_PORT_NULL);
              printf("{\"command\":\"%s\",\"task_bootstrap_name\":%u,\"global_bootstrap_name\":%u,\"sentinel_send_result\":%d}\n",argv[2],endpoint,bootstrap_port,sent); fflush(stdout);
              if(sent!=KERN_SUCCESS) return 129;
              struct { mig_reply_error_t response; mach_msg_max_trailer_t trailer; } answer={0};
              kern_return_t received=mach_msg(&answer.response.Head,MACH_RCV_MSG|MACH_RCV_TIMEOUT,0,sizeof(answer),reply,1000,MACH_PORT_NULL);
              printf("{\"command\":\"%s\",\"sentinel_receive_result\":%d,\"reply_id\":%d,\"reply_result\":%d}\n",argv[2],received,answer.response.Head.msgh_id,answer.response.RetCode); fflush(stdout);
              if(received!=KERN_SUCCESS || answer.response.Head.msgh_id!=sentinel_id+100 || answer.response.RetCode!=MIG_BAD_ID) return 130;
              if(!note.global_matches_task) return 131;
              if(!strcmp(argv[2],"denied-service")) {
                mach_port_t denied=MACH_PORT_NULL;
                kern_return_t lookup=bootstrap_look_up(bootstrap_port,"com.apple.xpc.launchd",&denied);
                printf("{\"denied_launchd_lookup_result\":%d,\"right_received\":%s}\n",lookup,denied?"true":"false");
                if(denied)mach_port_deallocate(mach_task_self(),denied);
                return lookup!=KERN_SUCCESS && denied==MACH_PORT_NULL?0:145;
              }
              int null=open("/dev/null",O_RDWR); if(null<0 || dup2(null,1)<0 || dup2(null,2)<0) return 133; if(null>2)close(null);
              if (!strcmp(argv[2],"id")) execl("/usr/bin/id","id","-F",(char*)NULL);
              else execl("/usr/bin/ssh","ssh","-G","-F","/dev/null","-o","CanonicalizeHostname=no","-o","ProxyCommand=none","example.invalid",(char*)NULL);
              return 132;
            }
            witness("id",3);
            if(!lookup_template_size)return 142;
            for(int mode=0;mode<3;mode++) { witness("id",mode); witness("ssh",mode); }
            witness("denied-service",2);
            return 0;
          }
          PROBE_SOURCE
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe"
      - name: Observe exact identity lookup route
        shell: bash
        run: |
          "$RUNNER_TEMP/probe"
      - name: Inspect installed read-only message filter interface
        shell: python
        run: |
          from pathlib import Path
          count = 0
          for path in sorted(Path('/System/Library/Sandbox/Profiles').glob('*.sb')):
              try:
                  lines = path.read_text().splitlines()
              except (OSError, UnicodeError):
                  continue
              for index, line in enumerate(lines):
                  if any(word in line for word in ('apply-message-filter', 'mach-message-send', 'message-id')):
                      print(f'{path.name}:{index+1}: ' + line.strip())
                      count += 1
                      if count >= 50:
                          break
              if count >= 50:
                  break
          print(f'public_os_filter_lines={count}')
      - name: Read installed filter declaration syntax
        shell: python
        run: |
          from pathlib import Path
          lines = Path('/System/Library/Sandbox/Profiles/airlock.sb').read_text().splitlines()
          for first, last in [(510, 565), (625, 645)]:
              for index in range(first-1, min(last, len(lines))):
                  print(f'airlock.sb:{index+1}: {lines[index]}')
      - name: Test launchd-owned creation policy and authority controls
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/seatbelt-base.sb" <<'POLICY_SOURCE'
          (version 1)
          
          ; inspired by Chrome's sandbox policy:
          ; https://source.chromium.org/chromium/chromium/src/+/main:sandbox/policy/mac/common.sb;l=273-319;drc=7b3962fe2e5fc9e2ee58000dc8fbf3429d84d3bd
          ; https://source.chromium.org/chromium/chromium/src/+/main:sandbox/policy/mac/renderer.sb;l=64;drc=7b3962fe2e5fc9e2ee58000dc8fbf3429d84d3bd
          
          ; start with closed-by-default
          (deny default)
          
          ; child processes inherit the policy of their parent
          (allow process-exec)
          (allow process-fork)
          (allow signal (target same-sandbox))
          
          ; process-info
          (allow process-info* (target same-sandbox))
          
          (allow file-write-data
            (require-all
              (path "/dev/null")
              (vnode-type CHARACTER-DEVICE)))
          
          ; sysctls permitted.
          (allow sysctl-read
            (sysctl-name "hw.activecpu")
            (sysctl-name "hw.busfrequency_compat")
            (sysctl-name "hw.byteorder")
            (sysctl-name "hw.cacheconfig")
            (sysctl-name "hw.cachelinesize_compat")
            (sysctl-name "hw.cpufamily")
            (sysctl-name "hw.cpufrequency_compat")
            (sysctl-name "hw.cputype")
            (sysctl-name "hw.l1dcachesize_compat")
            (sysctl-name "hw.l1icachesize_compat")
            (sysctl-name "hw.l2cachesize_compat")
            (sysctl-name "hw.l3cachesize_compat")
            (sysctl-name "hw.logicalcpu_max")
            (sysctl-name "hw.machine")
            (sysctl-name "hw.model")
            (sysctl-name "hw.memsize")
            (sysctl-name "hw.ncpu")
            (sysctl-name "hw.nperflevels")
            ; Chrome locks these CPU feature detection down a bit more tightly,
            ; but mostly for fingerprinting concerns which isn't an issue for codex.
            (sysctl-name-prefix "hw.optional.arm.")
            (sysctl-name-prefix "hw.optional.armv8_")
            (sysctl-name "hw.packages")
            (sysctl-name "hw.pagesize_compat")
            (sysctl-name "hw.pagesize")
            (sysctl-name "hw.physicalcpu")
            (sysctl-name "hw.physicalcpu_max")
            (sysctl-name "hw.logicalcpu")
            (sysctl-name "hw.cpufrequency")
            (sysctl-name "hw.tbfrequency_compat")
            (sysctl-name "hw.vectorunit")
            (sysctl-name "machdep.cpu.brand_string")
            (sysctl-name "kern.argmax")
            (sysctl-name "kern.hostname")
            (sysctl-name "kern.maxfilesperproc")
            (sysctl-name "kern.maxproc")
            (sysctl-name "kern.osproductversion")
            (sysctl-name "kern.osrelease")
            (sysctl-name "kern.ostype")
            (sysctl-name "kern.osvariant_status")
            (sysctl-name "kern.osversion")
            (sysctl-name "kern.secure_kernel")
            ; Python's ProcessPoolExecutor queries this through sysconf(_SC_SEM_NSEMS_MAX).
            (sysctl-name "kern.sysv.semmns")
            (sysctl-name "kern.usrstack64")
            (sysctl-name "kern.version")
            (sysctl-name "sysctl.proc_cputype")
            (sysctl-name "vm.loadavg")
            (sysctl-name-prefix "hw.perflevel")
            (sysctl-name-prefix "kern.proc.pgrp.")
            (sysctl-name-prefix "kern.proc.pid.")
            (sysctl-name-prefix "net.routetable.")
          )
          
          ; Allow Java to read some CPU info. This is misclassified as a "write" because
          ; userspace passes a memory buffer to the sysctl, but conceptually it is a read.
          (allow sysctl-write
            (sysctl-name "kern.grade_cputype"))
          
          ; IOKit
          (allow iokit-open
            (iokit-registry-entry-class "RootDomainUserClient")
          )
          
          ; needed to look up user info, see https://crbug.com/792228
          (allow mach-lookup
            (global-name "com.apple.system.opendirectoryd.libinfo")
          )
          
          ; Needed for python multiprocessing on MacOS for the SemLock
          (allow ipc-posix-sem)
          
          ; Needed for PyTorch/libomp on macOS to register OpenMP runtimes.
          (allow ipc-posix-shm-read-data
            ipc-posix-shm-write-create
            ipc-posix-shm-write-unlink
            (ipc-posix-name-regex #"^/__KMP_REGISTERED_LIB_[0-9]+$"))
          
          (allow mach-lookup
            (global-name "com.apple.PowerManagement.control")
          )
          
          ; allow openpty()
          (allow pseudo-tty)
          (allow file-read* file-write* file-ioctl (literal "/dev/ptmx"))
          (allow file-read* file-write*
            (require-all
              (regex #"^/dev/ttys[0-9]+")
              (extension "com.apple.sandbox.pty")))
          ; PTYs created before entering seatbelt may lack the extension; allow ioctl
          ; on those slave ttys so interactive shells detect a TTY and remain functional.
          (allow file-ioctl (regex #"^/dev/ttys[0-9]+"))
          POLICY_SOURCE
          cat > "$RUNNER_TEMP/denied-helper.c" <<'POLICY_SOURCE'
          #include <mach/mach.h>
          #include <servers/bootstrap.h>
          #include <stdio.h>
          #include <unistd.h>
          #pragma clang diagnostic ignored "-Wdeprecated-declarations"
          int main(void) {
            mach_port_t result=MACH_PORT_NULL, receive=MACH_PORT_NULL;
            kern_return_t lookup=bootstrap_look_up(bootstrap_port,"com.apple.xpc.launchd",&result);
            int lookup_denied=lookup!=KERN_SUCCESS && result==MACH_PORT_NULL;
            if(result)mach_port_deallocate(mach_task_self(),result);
            if(mach_port_allocate(mach_task_self(),MACH_PORT_RIGHT_RECEIVE,&receive)!=KERN_SUCCESS)return 150;
            if(mach_port_insert_right(mach_task_self(),receive,receive,MACH_MSG_TYPE_MAKE_SEND)!=KERN_SUCCESS)return 151;
            char service[128];snprintf(service,sizeof(service),"com.openai.codex.uidprobe.registration.%d",getpid());
            kern_return_t registered=bootstrap_register(bootstrap_port,service,receive);
            if(registered==KERN_SUCCESS) { kern_return_t removed=bootstrap_register(bootstrap_port,service,MACH_PORT_NULL); if(removed!=KERN_SUCCESS)return 153; }
            mach_port_mod_refs(mach_task_self(),receive,MACH_PORT_RIGHT_RECEIVE,-1);
            mach_port_deallocate(mach_task_self(),receive);
            return lookup_denied && registered!=KERN_SUCCESS?0:152;
          }
          POLICY_SOURCE
          cat > "$RUNNER_TEMP/launchd-policy-probe.py" <<'POLICY_SOURCE'
          import json
          import os
          from pathlib import Path
          import plistlib
          import subprocess
          import sys
          import tempfile
          import time
          import uuid
          
          
          def run(args, timeout=5):
              try:
                  completed = subprocess.run(args, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=timeout)
                  return completed.returncode
              except subprocess.TimeoutExpired:
                  return 124
          
          
          def emit(**values):
              print(json.dumps(values), flush=True)
          
          
          def worker(root):
              root = Path(root)
              info = json.loads((root / 'input.json').read_text())
              results = []
              for profile in ('strict', 'trusted', 'trusted-unrestricted', 'trusted-minimal-mach'):
                  prefix = [] if profile == 'trusted-unrestricted' else ['/usr/bin/sandbox-exec', '-f', str(root / (profile + '.sb'))]
                  commands = {
                      'uid': ['/usr/bin/id', '-F'],
                      'ssh': ['/usr/bin/ssh', '-G', '-F', '/dev/null', '-o', 'CanonicalizeHostname=no', '-o', 'ProxyCommand=none', 'example.invalid'],
                      'denied-service-and-registration': [info['helper']],
                      'bootstrap': ['/bin/launchctl', 'bootstrap', info['domain'], str(root / 'workspace/new-job.plist')],
                      'submit': ['/bin/launchctl', 'submit', '-l', info['submit'], '--', '/usr/bin/touch', str(root / 'escaped-submit')],
                      'kickstart': ['/bin/launchctl', 'kickstart', info['domain'] + '/' + info['target']],
                      'bootout-existing': ['/bin/launchctl', 'bootout', info['domain'] + '/' + info['target']],
                  }
                  for name, argv in commands.items():
                      result = dict(profile=profile, operation=name, exit=run(prefix + argv))
                      results.append(result)
                      emit(**result)
              (root / 'worker-result.json').write_text(json.dumps(results))
          
          
          def parent():
              root = Path(tempfile.mkdtemp(prefix='codex-uid-policy-', dir=os.environ['RUNNER_TEMP']))
              (root / 'workspace').mkdir()
              suffix = uuid.uuid4().hex
              gui = 'gui/' + str(os.getuid())
              domain = gui if run(['/bin/launchctl', 'print', gui]) == 0 else 'user/' + str(os.getuid())
              labels = {name: 'com.openai.codex.uidprobe.' + suffix + '.' + name for name in ('target', 'candidate', 'new', 'submit')}
              script = str(Path(__file__).resolve())
              info = dict(domain=domain, target=labels['target'], submit=labels['submit'], helper=str(Path(os.environ['RUNNER_TEMP']) / 'denied-helper'))
              (root / 'input.json').write_text(json.dumps(info))
              base = Path(os.environ['RUNNER_TEMP'], 'seatbelt-base.sb').read_text()
              (root / 'strict.sb').write_text(base + '\n(allow file-read*)\n(allow file-write* (subpath ' + json.dumps(str(root / 'workspace')) + '))\n')
              (root / 'trusted.sb').write_text(base + '\n(allow file-read* file-write*)\n')
              (root / 'trusted-minimal-mach.sb').write_text('(version 1)(allow default)(deny mach-lookup)(allow mach-lookup (global-name \"com.apple.system.opendirectoryd.libinfo\"))(deny mach-register)(deny job-creation)')
              jobs = {
                  'target': {'Label': labels['target'], 'ProgramArguments': ['/usr/bin/touch', str(root / 'escaped-target')], 'RunAtLoad': False},
                  'new': {'Label': labels['new'], 'ProgramArguments': ['/usr/bin/touch', str(root / 'escaped-bootstrap')], 'RunAtLoad': True},
                  'candidate': {'Label': labels['candidate'], 'ProgramArguments': [sys.executable, script, '--worker', str(root)], 'RunAtLoad': True, 'Policies': {'DenyCreatingOtherJobs': True}, 'StandardOutPath': str(root / 'candidate.log'), 'StandardErrorPath': str(root / 'candidate-error.log')},
              }
              for name, data in jobs.items():
                  path = root / ('workspace/new-job.plist' if name == 'new' else name + '.plist')
                  path.write_bytes(plistlib.dumps(data))
              try:
                  host_registration = run(['/bin/launchctl', 'bootstrap', domain, str(root / 'target.plist')])
                  emit(profile='host', operation='register-target', exit=host_registration)
                  candidate_registration = run(['/bin/launchctl', 'bootstrap', domain, str(root / 'candidate.plist')])
                  emit(profile='host', operation='register-policy-candidate', exit=candidate_registration)
                  if host_registration != 0 or candidate_registration != 0:
                      emit(host_setup_failed=True)
                      return
                  deadline = time.monotonic() + 30
                  while not (root / 'worker-result.json').exists() and time.monotonic() < deadline:
                      time.sleep(.1)
                  if (root / 'worker-result.json').exists():
                      for row in json.loads((root / 'worker-result.json').read_text()):
                          emit(**row)
                  else:
                      emit(worker_completed=False)
                  emit(escaped_submit=(root / 'escaped-submit').exists(), escaped_bootstrap=(root / 'escaped-bootstrap').exists(), escaped_target=(root / 'escaped-target').exists())
                  emit(profile='host', operation='target-still-registered', exit=run(['/bin/launchctl', 'print', domain + '/' + labels['target']]))
                  host_kickstart = run(['/bin/launchctl', 'kickstart', domain + '/' + labels['target']])
                  deadline = time.monotonic() + 3
                  while not (root / 'escaped-target').exists() and time.monotonic() < deadline:
                      time.sleep(.05)
                  emit(profile='host', operation='kickstart-target', exit=host_kickstart, marker=(root / 'escaped-target').exists())
              finally:
                  for label in labels.values():
                      run(['/bin/launchctl', 'bootout', domain + '/' + label])
                      run(['/bin/launchctl', 'remove', label])
                  emit(owned_jobs_cleanup_completed=True)
          
          
          if __name__ == '__main__':
              if len(sys.argv) == 3 and sys.argv[1] == '--worker':
                  worker(sys.argv[2])
              else:
                  parent()
          POLICY_SOURCE
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/denied-helper.c" -o "$RUNNER_TEMP/denied-helper"
          python3 "$RUNNER_TEMP/launchd-policy-probe.py"
