name: Test Linux sandbox package sources

on:
  push:
    branches: [ci/probe-native-voice-linux-packages-20261111]

permissions:
  contents: read

jobs:
  sandbox-packages:
    runs-on:
      group: codex-runners
      labels: codex-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the native sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/use-ubuntu-archive-if-needed.sh
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes bubblewrap dnsmasq-base
          bwrap --version
          dnsmasq --version
