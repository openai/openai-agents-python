name: Native voice CI diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"
  OPENAI_API_KEY: fake-for-tests
  PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
  PYTEST_ADDOPTS: "-rA -vv --tb=short -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true --max-worker-restart=0"

jobs:
  linux-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f2ad3f1051a50ac9f08516a9401bb6425164a42e
          persist-credentials: false
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.14"
          enable-cache: false
          python-version: "3.13"
      - name: Reuse the exact qualified native build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/openai/openai-agents-python/actions/artifacts/13639309475/zip > "$RUNNER_TEMP/native.zip"
          python - <<'PYTHON'
          import hashlib
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archive = Path(os.environ["RUNNER_TEMP"]) / "native.zip"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "8bc1bff3a48f19b562c5a0921bde6c94be6fbad66012a27607a375336534cf24"
          artifacts = archive.parent / "agents-native"
          with zipfile.ZipFile(archive) as bundle:
              assert all(Path(name).name == name for name in bundle.namelist())
              bundle.extractall(artifacts)
          wheel, = artifacts.glob("openai_agents-*.whl")
          executor = Path(os.environ["GITHUB_WORKSPACE"]) / "packages/codex/target/debug/examples/exec-server-fixture"
          executor.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(artifacts / "exec-server-fixture", executor)
          executor.chmod(executor.stat().st_mode | 0o111)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"OPENAI_AGENTS_NATIVE_WHEEL={wheel.resolve()}\n")
              output.write(f"CODEX_EXEC_SERVER_TEST_BINARY={executor.resolve()}\n")
          PYTHON
      - name: Install dependencies
        timeout-minutes: 8
        run: make sync
      - name: Allow the test executor and packaged helper to create sandboxes
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          helper="$(uv run --no-sync python - <<'PYTHON'
          import os
          from pathlib import Path
          import agents
          helper = (Path(agents.__file__).resolve().parent / "bin" / "codex-linux-sandbox").resolve()
          assert helper.is_file() and os.access(helper, os.X_OK), "packaged Linux helper is not executable"
          runtime = helper.with_name("codex-sdk-runtime")
          assert runtime.is_file() and os.access(runtime, os.X_OK), "packaged runtime is not executable"
          print(helper)
          PYTHON
          )"
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            executor="$GITHUB_WORKSPACE/packages/codex/target/debug/examples/exec-server-fixture"
            sudo tee /etc/apparmor.d/agents-sdk-test-executor > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile agents-sdk-test-executor "$executor" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/agents-sdk-test-executor
            sudo tee /etc/apparmor.d/agents-sdk-linux-sandbox > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile agents-sdk-linux-sandbox "$helper" flags=(unconfined) {
            userns,
          }
          profile agents-sdk-linux-runtime "${helper%/*}/codex-sdk-runtime" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/agents-sdk-linux-sandbox
          fi
      - name: Run tests with a hard deadline
        timeout-minutes: 18
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voice-diagnostic"
          set +e
          timeout --signal=TERM --kill-after=30s 3m uv run python packages/codex/scripts/test_native.py --sdk -m pytest -x -vv --tb=long packages/codex/tests/test_native_hosted_performance_integration.py::test_hosted_capture_before_open_and_fresh_session_grants > "$RUNNER_TEMP/voice-diagnostic/tests.log" 2>&1
          result=$?
          tail -n 300 "$RUNNER_TEMP/voice-diagnostic/tests.log"
          exit "$result"
      - name: Capture runner diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voice-diagnostic"
          {
            date -u
            free -m
            df -h
            ps -eo pid,ppid,stat,rss,comm
            sudo dmesg --ctime | tail -n 100
          } > "$RUNNER_TEMP/voice-diagnostic/runner.log" 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-voice-ci-diagnostic
          path: ${{ runner.temp }}/voice-diagnostic
          retention-days: 3
