name: Tests

on:
  push:
    branches:
      - main
      - feat/codex-harness
  pull_request:
    # All PRs, including stacked PRs
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      native_only:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  # Use GitHub's Re-run failed jobs action to retry this run.

permissions:
  contents: read
  actions: read

env:
  UV_FROZEN: "1"
  CARGO_BUILD_JOBS: "3"
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.run }}
      windows: ${{ steps.release-windows.outputs.run }}
      native_source_run: ${{ steps.native-source.outputs.run_id }}
      native_artifacts: ${{ steps.native-source.outputs.artifacts }}
      native_dependency_run: ${{ steps.native-source.outputs.dependency_run }}
      native_dependencies: ${{ steps.native-source.outputs.dependencies }}
      native_provenance: ${{ steps.producer-identity.outputs.provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Select Windows test coverage
        id: release-windows
        env:
          V1_QUALIFICATION: ${{ inputs.native_only || github.ref_name == 'feat/codex-harness' || github.base_ref == 'feat/codex-harness' || github.event.merge_group.base_ref == 'refs/heads/feat/codex-harness' }}
          DEFAULT_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python -I -S - <<'PYTHON'
          import json
          import os
          import re
          import subprocess

          # Public v1 source qualification always covers all native platforms,
          # including the first branch push, whose before SHA is all zeroes.
          if os.environ.get("V1_QUALIFICATION") == "true":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("run=true\n")
              raise SystemExit(0)

          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          default_push = os.environ.get("DEFAULT_BRANCH_PUSH") == "true"
          versions = []
          try:
              revisions = (os.environ["HEAD_SHA"],) if manual else (
                  os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              )
              for sha in revisions:
                  if not re.fullmatch(r"[0-9a-f]{40}", sha):
                      raise ValueError("event ref is not a full commit SHA")
                  manifest = json.loads(subprocess.check_output(
                      ["git", "show", f"{sha}:.release-please-manifest.json"], text=True
                  ))
                  version = manifest["."]
                  if not isinstance(version, str) or not version.strip():
                      raise ValueError("missing committed root release version")
                  versions.append(version)
          except (KeyError, TypeError, ValueError, subprocess.CalledProcessError) as error:
              raise SystemExit(f"Cannot compare release versions; Tests cannot qualify this commit: {error}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(manual or default_push or versions[0] != versions[1]).lower()}\n")
          PYTHON
      - name: Capture native producer identity
        id: producer-identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_BRANCH: ${{ github.ref_name }}
          PRODUCER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python -I -S - <<'PYTHON'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          record = {"repository_id": os.environ["GITHUB_REPOSITORY_ID"],
                    "source_sha": os.environ["PRODUCER_SHA"],
                    "head_ref": os.environ["PRODUCER_BRANCH"],
                    "run_id": os.environ["GITHUB_RUN_ID"],
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "pull_request": None}
          if (os.environ["GITHUB_EVENT_NAME"] == "push"
                  and record["head_ref"] not in {os.environ["DEFAULT_BRANCH"], "feat/codex-harness"}):
              query = urllib.parse.urlencode({"state": "open", "head": os.environ["GITHUB_REPOSITORY_OWNER"] + ":" + record["head_ref"], "per_page": 100})
              url = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/pulls?" + query
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                                          "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  pulls = json.load(response)
              if len(pulls) >= 100:
                  raise SystemExit("Incomplete open PR metadata; cannot capture native producer identity")
              # More than one page cannot establish a unique open association.
              if len(pulls) < 100:
                  matches = [pr for pr in pulls if pr["head"]["sha"] == record["source_sha"]
                             and pr["head"]["ref"] == record["head_ref"]
                             and str((pr["head"].get("repo") or {}).get("id")) == record["repository_id"]
                             and str((pr["base"].get("repo") or {}).get("id")) == record["repository_id"]]
                  if len(matches) == 1:
                      pr = matches[0]
                      record["pull_request"] = {"number": pr["number"],
                                                "base_repo_id": str(pr["base"]["repo"]["id"]),
                                                "head_repo_id": str(pr["head"]["repo"]["id"]),
                                                "base_ref": pr["base"]["ref"], "head_ref": pr["head"]["ref"]}
          encoded = json.dumps(record, sort_keys=True)
          (Path(os.environ["RUNNER_TEMP"]) / "native-provenance.json").write_text(encoded)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("provenance=" + encoded + "\n")
              if record["pull_request"]:
                  output.write("pr_number=" + str(record["pull_request"]["number"]) + "\n")
                  output.write("base_ref=" + record["pull_request"]["base_ref"] + "\n")
          PYTHON
      - name: Publish native producer identity
        if: github.event_name == 'push' && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-provenance
          path: ${{ runner.temp }}/native-provenance.json
          if-no-files-found: error
          retention-days: 90
      - name: Select a qualified native build
        id: native-source
        if: >-
          github.repository == 'openai/openai-agents-python' && steps.changes.outputs.run == 'true' &&
          ((github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch ||
          github.ref_name == 'feat/codex-harness' || inputs.native_only)) ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ (github.base_ref || steps.producer-identity.outputs.base_ref || github.ref_name) == 'feat/codex-harness' && 'feat/codex-harness' || github.event.repository.default_branch }}
          CURRENT_PR: ${{ github.event.pull_request.number || steps.producer-identity.outputs.pr_number || '' }}
          CURRENT_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          CURRENT_BASE_REF: ${{ github.base_ref || steps.producer-identity.outputs.base_ref || '' }}
          REQUIRE_WINDOWS: ${{ steps.release-windows.outputs.run }}
        run: |
          python -I -S - <<'PYTHON'
          import json
          import os
          import re
          import runpy
          import subprocess
          import tempfile
          import tarfile
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zipfile import ZipFile

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL'] + '/repos/' + repo + '/actions'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          download_archive = runpy.run_path('.github/scripts/download-native-snapshot.py')['download_archive']
          integrity = runpy.run_path('packages/codex/scripts/source_integrity.py')
          native_inputs = integrity['native_inputs']
          native_identity = integrity['native_bundle_identity'](Path('.'))

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)

          def records(url, key):
              results, page = [], 1
              while True:
                  response = get(url + f'&per_page=100&page={page}')
                  batch = response[key]
                  results.extend(batch)
                  if len(results) == response['total_count']:
                      return results
                  if not batch or len(results) > response['total_count']:
                      raise SystemExit('Incomplete source metadata; cannot verify native build provenance')
                  page += 1

          def ancestor(before, after):
              return bool(re.fullmatch(r'[0-9a-f]{40}', before or '')) and subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', before, after], stderr=subprocess.DEVNULL
              ).returncode == 0

          def timestamp(value):
              parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if parsed.utcoffset() is None:
                  raise SystemExit('Incomplete native publication timestamp')
              return parsed

          def compatible(run, dependencies=False):
              if (repo != 'openai/openai-agents-python' or run['event'] != 'push'
                      or run['repository']['full_name'] != repo
                      or str(run['repository']['id']) != os.environ['GITHUB_REPOSITORY_ID']
                      or (run.get('head_repository') or {}).get('full_name') != repo
                      or str(run['id']) == os.environ['GITHUB_RUN_ID']):
                  return False
              branch_source = run['path'] == '.github/workflows/native-python-push.yml'
              canonical_source = run['path'] == '.github/workflows/tests.yml'
              if branch_source:
                  if (not os.environ.get('CURRENT_PR') or run['head_branch'] != os.environ['CURRENT_HEAD_REF']
                          or not ancestor(run['head_sha'], os.environ['CURRENT_PR_HEAD'])):
                      return False
              elif canonical_source:
                  if run['head_branch'] != os.environ['SOURCE_BRANCH'] or not ancestor(run['head_sha'], 'HEAD'):
                      return False
              else:
                  return False
              expected = {'.github/workflows/codex-python.yml', '.github/workflows/codex-python-qualify.yml'}
              if branch_source:
                  expected.add('.github/workflows/tests.yml')
              references = run.get('referenced_workflows') or []
              if not references:
                  return False
              if (len(references) != len(expected)
                      or {item['path'].split('@', 1)[0] for item in references} != {repo + '/' + path for path in expected}):
                  return False
              for item in references:
                  if (item['sha'] != run['head_sha']
                          or item['path'] != item['path'].split('@', 1)[0] + '@' + run['head_sha']
                          or item['ref'] != 'refs/heads/' + run['head_branch']):
                      return False
              source = run['head_sha']
              for path in expected | {run['path'], '.github/workflows/tests.yml'}:
                  prior = subprocess.run(['git', 'show', f'{source}:{path}'], capture_output=True)
                  if prior.returncode or prior.stdout != Path(path).read_bytes():
                      return False
              # Compare the same native closure that the wheel receipt validates.
              # Python sources and dependencies are repacked and qualified afresh.
              controls = ('.github/actions/setup-native/action.yml',
                          '.github/scripts/download-native-snapshot.py',
                          '.github/scripts/native-dependencies.py',
                          'packages/codex/tests/fixtures/exec_server.rs')
              for path in controls:
                  prior = subprocess.run(['git', 'show', f'{source}:{path}'], capture_output=True)
                  if prior.returncode or prior.stdout != Path(path).read_bytes():
                      return False
              with tempfile.TemporaryDirectory(prefix='agents-native-inputs-') as directory:
                  with tempfile.TemporaryFile() as archive:
                      result = subprocess.run(['git', 'archive', source, 'packages/codex', 'pyproject.toml', 'LICENSE', '.gitignore'],
                                              stdout=archive)
                      if result.returncode:
                          return False
                      archive.seek(0)
                      with tarfile.open(fileobj=archive) as tree:
                          tree.extractall(directory, filter='data')
                  try:
                      before = native_inputs(Path(directory) / 'packages/codex')
                      after = native_inputs(Path('packages/codex').resolve())
                  except (OSError, ValueError, KeyError):
                      return False
              if dependencies:
                  before = {path: digest for path, digest in before.items()
                            if not (path.startswith('packages/codex/rust/') and path.endswith('.rs'))}
                  after = {path: digest for path, digest in after.items()
                           if not (path.startswith('packages/codex/rust/') and path.endswith('.rs'))}
              return before == after

          def qualified(run, dependencies=False):
              if run['status'] != 'completed' or run['conclusion'] != 'success' or not compatible(run, dependencies):
                  return None
              run_api = api + '/runs/' + str(run['id'])
              jobs = records(run_api + '/jobs?filter=all', 'jobs')
              prefix = 'native-only / ' if run['path'].endswith('native-python-push.yml') else ''
              sdk_starts = []
              for job in jobs:
                  name = job['name'].removeprefix(prefix)
                  if name.startswith('produce-') or name == 'changes' or job.get('conclusion') == 'skipped':
                      continue
                  if not job['started_at']:
                      if job.get('status') == 'queued':
                          continue
                      raise SystemExit('Incomplete SDK execution history')
                  sdk_starts.append(timestamp(job['started_at']))
              if not sdk_starts:
                  return None
              earliest_sdk = min(sdk_starts)
              artifacts = records(run_api + '/artifacts?', 'artifacts')
              # This small record was captured once, before any native or SDK qualification.
              captures = []
              for job in jobs:
                  if job['name'] != prefix + 'changes':
                      continue
                  for step in job.get('steps', []):
                      if step['name'] != 'Publish native producer identity' or step.get('conclusion') != 'success':
                          continue
                      for artifact in artifacts:
                          if (artifact['name'] == 'native-provenance' and not artifact['expired']
                                  and timestamp(step['started_at']) <= timestamp(artifact['created_at'])
                                  <= timestamp(step['completed_at']) < earliest_sdk):
                              captures.append((artifact, job['run_attempt']))
              if len(captures) != 1:
                  return None
              capture, attempt = captures[0]
              with tempfile.TemporaryFile() as archive:
                  download_archive(capture['id'], capture['digest'], str(run['id']), 'native-provenance', archive)
                  with ZipFile(archive) as bundle:
                      if bundle.namelist() != ['native-provenance.json']:
                          raise SystemExit('Invalid native producer identity archive')
                      provenance = json.loads(bundle.read('native-provenance.json'))
              if (provenance['source_sha'] != run['head_sha'] or provenance['run_id'] != str(run['id'])
                      or provenance['run_attempt'] != str(attempt)
                      or provenance['repository_id'] != os.environ['GITHUB_REPOSITORY_ID']
                      or provenance['head_ref'] != run['head_branch']):
                  raise SystemExit('Inconsistent native producer identity')
              if run['path'].endswith('native-python-push.yml'):
                  pr = provenance['pull_request']
                  if (not pr or str(pr['number']) != os.environ.get('CURRENT_PR')
                          or pr['head_repo_id'] != os.environ['GITHUB_REPOSITORY_ID']
                          or pr['base_repo_id'] != os.environ['GITHUB_REPOSITORY_ID']
                          or pr['head_ref'] != os.environ['CURRENT_HEAD_REF']
                          or pr['base_ref'] != os.environ['CURRENT_BASE_REF']):
                      return None
              elif provenance['pull_request'] is not None:
                  raise SystemExit('Canonical native producer has unexpected PR scope')
              platforms = {'linux': ('ubuntu-24.04', 'Linux-X64'), 'macos': ('macos-latest', 'macOS-ARM64')}
              if os.environ.get('REQUIRE_WINDOWS') != 'false':
                  platforms['windows'] = ('windows-latest', 'Windows-X64')
              selected = {}
              for platform, (runner, identity) in platforms.items():
                  qualifiers = [job for job in jobs if job['name'] == prefix + f'native-{platform} / Native package ({runner})']
                  if not qualifiers:
                      return None
                  latest_attempt = max(job['run_attempt'] for job in qualifiers)
                  qualifiers = [job for job in qualifiers if job['run_attempt'] == latest_attempt]
                  if len(qualifiers) != 1 or qualifiers[0]['conclusion'] != 'success':
                      return None
                  valid = []
                  for producer in jobs:
                      if (producer['name'] != prefix + f'produce-{platform} / Native snapshot ({runner})'
                              or producer['conclusion'] != 'success'):
                          continue
                      steps = {step['name']: step for step in producer.get('steps', [])}
                      fresh = (steps.get('Build the SDK and native runtime together', {}).get('conclusion') == 'success'
                               and steps.get('Build the shared test executor', {}).get('conclusion') == 'success'
                               and steps.get('Download the qualified native build', {}).get('conclusion') == 'skipped')
                      copied = (steps.get('Build the SDK and native runtime together', {}).get('conclusion') == 'skipped'
                                and steps.get('Build the shared test executor', {}).get('conclusion') == 'skipped'
                                and steps.get('Download the qualified native build', {}).get('conclusion') == 'success')
                      if not (fresh or (copied and not dependencies)):
                          continue
                      publication = steps.get('Publish Rust dependencies' if dependencies else 'Publish the native snapshot', {})
                      if dependencies and steps.get('Prepare Rust dependency cache', {}).get('conclusion') != 'success':
                          continue
                      if publication.get('conclusion') != 'success':
                          continue
                      for artifact in artifacts:
                          expected_name = ('native-dependencies-' + identity if dependencies else
                                           'native-snapshot-' + identity + '-' + native_identity)
                          if (artifact['name'] == expected_name and not artifact['expired']
                                  and timestamp(publication['started_at']) <= timestamp(artifact['created_at'])
                                  <= timestamp(publication['completed_at']) < earliest_sdk):
                              if not re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest']):
                                  raise SystemExit('Invalid native snapshot digest')
                              valid.append({'id': artifact['id'], 'digest': artifact['digest'], 'provenance': provenance,
                                            **({} if dependencies else {'name': artifact['name']})})
                  if len(valid) != 1:
                      return None
                  selected[identity] = valid[0]
              return selected

          # Discover exact matching artifacts, including producers older than recent docs runs.
          # Bound lookup work even when many matching artifacts are retained.
          # API failures remain visible; an absent ready artifact never waits for a producer.
          def candidates():
              query = urllib.parse.urlencode({'name': 'native-snapshot-Linux-X64-' + native_identity, 'per_page': 100})
              branches = {os.environ['SOURCE_BRANCH']}
              if os.environ.get('CURRENT_PR'):
                  branches.add(os.environ['CURRENT_HEAD_REF'])
              seen = set()
              for artifact in get(api + '/artifacts?' + query)['artifacts'][:100]:
                  run = artifact['workflow_run']
                  run_id = run['id']
                  if (artifact['expired'] or run_id in seen
                          or str(run['repository_id']) != os.environ['GITHUB_REPOSITORY_ID']
                          or str(run['head_repository_id']) != os.environ['GITHUB_REPOSITORY_ID']
                          or run['head_branch'] not in branches):
                      continue
                  if len(seen) >= 20:
                      return
                  seen.add(run_id)
                  yield get(api + '/runs/' + str(run_id))

          def dependency_candidates():
              if os.environ.get('CURRENT_PR'):
                  query = urllib.parse.urlencode({'branch': os.environ['CURRENT_HEAD_REF'], 'event': 'push', 'status': 'success', 'per_page': 20})
                  yield from get(api + '/workflows/native-python-push.yml/runs?' + query)['workflow_runs']
              query = urllib.parse.urlencode({'branch': os.environ['SOURCE_BRANCH'], 'event': 'push', 'status': 'success', 'per_page': 20})
              yield from get(api + '/workflows/tests.yml/runs?' + query)['workflow_runs']

          # Prefer ready native products; use the existing bounded dependency fallback on a miss.
          def select():
              for dependencies, runs in ((False, candidates()), (True, dependency_candidates())):
                  for run in runs:
                      selected = qualified(run, dependencies)
                      if selected:
                          run_key, artifact_key = ('dependency_run', 'dependencies') if dependencies else ('run_id', 'artifacts')
                          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                              output.write(f"{run_key}={run['id']}\n")
                              output.write(artifact_key + '=' + json.dumps(selected, sort_keys=True) + '\n')
                          print(f"Reusing {'Rust dependencies' if dependencies else 'native build'} from {repo} push run {run['id']} at {run['head_sha']}")
                          return
              print('No qualified native build or dependencies are available. Building from source now.')
          select()
          PYTHON

  produce-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/codex-python.yml
    with:
      runner: ubuntu-24.04
      native_source_run: ${{ needs.changes.outputs.native_source_run }}
      native_artifacts: ${{ needs.changes.outputs.native_artifacts }}
      native_dependency_run: ${{ needs.changes.outputs.native_dependency_run }}
      native_dependencies: ${{ needs.changes.outputs.native_dependencies }}
      native_provenance: ${{ needs.changes.outputs.native_provenance }}

  produce-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/codex-python.yml
    with:
      runner: windows-latest
      native_source_run: ${{ needs.changes.outputs.native_source_run }}
      native_artifacts: ${{ needs.changes.outputs.native_artifacts }}
      native_dependency_run: ${{ needs.changes.outputs.native_dependency_run }}
      native_dependencies: ${{ needs.changes.outputs.native_dependencies }}
      native_provenance: ${{ needs.changes.outputs.native_provenance }}

  produce-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/codex-python.yml
    with:
      runner: macos-latest
      native_source_run: ${{ needs.changes.outputs.native_source_run }}
      native_artifacts: ${{ needs.changes.outputs.native_artifacts }}
      native_dependency_run: ${{ needs.changes.outputs.native_dependency_run }}
      native_dependencies: ${{ needs.changes.outputs.native_dependencies }}
      native_provenance: ${{ needs.changes.outputs.native_provenance }}

  native-linux:
    needs: [changes, produce-linux, produce-windows, produce-macos]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' &&
      needs.produce-linux.result == 'success' && needs.produce-macos.result == 'success' &&
      ((needs.changes.outputs.windows == 'true' && needs.produce-windows.result == 'success') ||
      (needs.changes.outputs.windows == 'false' && needs.produce-windows.result == 'skipped'))
    uses: ./.github/workflows/codex-python-qualify.yml
    with:
      runner: ubuntu-24.04
      artifact_id: ${{ needs.produce-linux.outputs.artifact_id }}
      artifact_digest: ${{ needs.produce-linux.outputs.artifact_digest }}
      native_provenance: ${{ needs.changes.outputs.native_provenance }}

  native-windows:
    needs: [changes, produce-linux, produce-windows, produce-macos]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' &&
      needs.produce-linux.result == 'success' && needs.produce-macos.result == 'success' &&
      ((needs.changes.outputs.windows == 'true' && needs.produce-windows.result == 'success') ||
      (needs.changes.outputs.windows == 'false' && needs.produce-windows.result == 'skipped')) && needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/codex-python-qualify.yml
    with:
      runner: windows-latest
      artifact_id: ${{ needs.produce-windows.outputs.artifact_id }}
      artifact_digest: ${{ needs.produce-windows.outputs.artifact_digest }}
      native_provenance: ${{ needs.changes.outputs.native_provenance }}

  native-macos:
    needs: [changes, produce-linux, produce-windows, produce-macos]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' &&
      needs.produce-linux.result == 'success' && needs.produce-macos.result == 'success' &&
      ((needs.changes.outputs.windows == 'true' && needs.produce-windows.result == 'success') ||
      (needs.changes.outputs.windows == 'false' && needs.produce-windows.result == 'skipped'))
    uses: ./.github/workflows/codex-python-qualify.yml
    with:
      runner: macos-latest
      artifact_id: ${{ needs.produce-macos.outputs.artifact_id }}
      artifact_digest: ${{ needs.produce-macos.outputs.artifact_digest }}
      native_provenance: ${{ needs.changes.outputs.native_provenance }}

  lint:
    needs: [changes, produce-linux, produce-windows, produce-macos]
    if: >-
      !inputs.native_only &&
      !cancelled() && needs.changes.result == 'success' &&
      ((needs.changes.outputs.code == 'false' && needs.produce-linux.result == 'skipped' &&
      needs.produce-windows.result == 'skipped' && needs.produce-macos.result == 'skipped') ||
      (needs.changes.outputs.code == 'true' && needs.produce-linux.result == 'success' &&
      needs.produce-macos.result == 'success' &&
      ((needs.changes.outputs.windows == 'true' && needs.produce-windows.result == 'success') ||
      (needs.changes.outputs.windows == 'false' && needs.produce-windows.result == 'skipped'))))
    env:
      UV_NO_SYNC: "1"
      PYTHONPATH: src:packages/codex/src
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # setup-uv v10.3.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --group dev --no-install-project
      - name: Verify formatting
        if: steps.changes.outputs.run == 'true'
        run: make format-check
      - name: Run lint
        if: steps.changes.outputs.run == 'true'
        run: make lint
      - name: Skip lint
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping lint for non-code changes."

  typecheck:
    if: ${{ !inputs.native_only }}
    needs: native-linux
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || '"ubuntu-latest"') }}
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # setup-uv v10.3.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Restore mypy cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'Makefile') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'Makefile') }}-
      - name: Use the shared native build
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/use-native
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: make sync
      - name: Run typecheck
        if: steps.changes.outputs.run == 'true'
        run: make typecheck
      - name: Skip typecheck
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping typecheck for non-code changes."

  mypy-win32:
    if: ${{ !inputs.native_only }}
    needs: native-linux
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || '"ubuntu-latest"') }}
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # setup-uv v10.3.0; uv 0.11.14
        with:
          version: "0.11.14"
