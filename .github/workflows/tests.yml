      - name: Run mypy for Windows
        if: steps.changes.outputs.run == 'true'
        run: uv run mypy --platform win32 src
      - name: Skip Windows mypy
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping Windows mypy for non-code changes."

  tests:
    needs: [changes, native-linux]
    if: >-
      !inputs.native_only &&
      !cancelled() && needs.changes.result == 'success' &&
      ((needs.changes.outputs.code == 'false' && needs.native-linux.result == 'skipped') ||
      (needs.changes.outputs.code == 'true' && needs.native-linux.result == 'success'))
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || '"ubuntu-latest"') }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      OPENAI_API_KEY: fake-for-tests
      PYTEST_ADDOPTS: "-rA"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # setup-uv v10.3.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Use the shared native build
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/use-native
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: make sync
      - name: Allow the test executor and packaged helper to create sandboxes
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          helper="$(uv run --no-sync python - <<'PYTHON'
          import os
          from pathlib import Path
          import agents
          helper = (Path(agents.__file__).resolve().parent / "bin" / "codex-linux-sandbox").resolve()
          assert helper.is_file() and os.access(helper, os.X_OK), "packaged Linux helper is not executable"
          runtime = helper.with_name("codex-sdk-runtime")
          assert runtime.is_file() and os.access(runtime, os.X_OK), "packaged runtime is not executable"
          print(helper)
          PYTHON
          )"
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            executor="$GITHUB_WORKSPACE/packages/codex/target/debug/examples/exec-server-fixture"
            sudo tee /etc/apparmor.d/agents-sdk-test-executor > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile agents-sdk-test-executor "$executor" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/agents-sdk-test-executor
            sudo tee /etc/apparmor.d/agents-sdk-linux-sandbox > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile agents-sdk-linux-sandbox "$helper" flags=(unconfined) {
            userns,
          }
          profile agents-sdk-linux-runtime "${helper%/*}/codex-sdk-runtime" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/agents-sdk-linux-sandbox
          fi
      - name: Run native SDK tests
        if: steps.changes.outputs.run == 'true'
        run: make tests
      - name: Qualify native tracing and decoded OTLP transports
        if: steps.changes.outputs.run == 'true' && matrix.python-version == '3.11'
        env:
          AGENTS_REQUIRE_TRACING_QUALIFICATION: '1'
        run: |
          uv run --with grpcio==1.85.0 --with opentelemetry-proto==1.45.1 python packages/codex/scripts/test_native.py --sdk -m pytest -q packages/codex/tests/test_tracing_native.py packages/codex/tests/test_telemetry_transports.py
      - name: Verify the qualified wheel archive
        if: steps.changes.outputs.run == 'true' && matrix.python-version == '3.11'
        env:
          OPENAI_AGENTS_WHEEL: ${{ env.OPENAI_AGENTS_NATIVE_WHEEL }}
        run: PYTHONPATH=. uv run --no-sync python -m pytest -q packages/codex/tests/test_distribution.py
      - name: Verify copied documentation code against the qualified wheel
        if: steps.changes.outputs.run == 'true' && matrix.python-version == '3.11'
        run: |
          uv pip install --no-deps --target "$RUNNER_TEMP/docs-wheel" "$OPENAI_AGENTS_NATIVE_WHEEL"
          PYTHONPATH="$RUNNER_TEMP/docs-wheel" uv run --no-sync python .github/scripts/check_docs.py
          PYTHONPATH="$RUNNER_TEMP/docs-wheel" uv run --no-sync python -m pytest -q packages/codex/tests/test_docs_code.py
      - name: Set up Node for the optional Vercel client example
        if: steps.changes.outputs.run == 'true' && matrix.python-version == '3.11'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify the optional Vercel client example with ai 6.0.315
        if: steps.changes.outputs.run == 'true' && matrix.python-version == '3.11'
        env:
          AGENTS_REQUIRE_VERCEL_CLIENT: '1'
        run: |
          npm ci --prefix packages/codex/tests/vercel-client --ignore-scripts
          uv run --no-sync python packages/codex/scripts/test_native.py --sdk -m pytest -q packages/codex/tests/test_vercel_client.py
      - name: Verify the complete browser starter with ai 6.0.315
        if: steps.changes.outputs.run == 'true' && matrix.python-version == '3.11'
        env:
          AGENTS_REQUIRE_WEB_BROWSER: '1'
        run: |
          npm ci --prefix packages/codex/examples/web_starter --ignore-scripts
          npm run build --prefix packages/codex/examples/web_starter
          npm exec --prefix packages/codex/examples/web_starter -- playwright install --with-deps chromium
          uv run --no-sync python packages/codex/scripts/test_native.py --sdk -m pytest -q packages/codex/tests/test_web_starter_browser.py
      - name: Verify the optional AG-UI example
        if: steps.changes.outputs.run == 'true' && matrix.python-version == '3.11'
        run: |
          uv run --with-requirements packages/codex/examples/ag_ui/requirements.txt python -c 'import ag_ui.core'
          uv run --with-requirements packages/codex/examples/ag_ui/requirements.txt python packages/codex/scripts/test_native.py --sdk -m pytest -q packages/codex/tests/test_ag_ui_example.py
      - name: Verify the optional MCP Tasks adapter
        if: steps.changes.outputs.run == 'true'
        run: |
          uv run --with mcp==2.0.0 --with mcp-types==2.0.0 --with uvicorn --with starlette python -c 'from agents.experimental.mcp_tasks import MCPTasksProvider'
          uv run --with mcp==2.0.0 --with mcp-types==2.0.0 --with uvicorn --with starlette python packages/codex/scripts/test_native.py --sdk -m pytest -q packages/codex/tests/test_deferred_mcp_response_budget.py packages/codex/tests/test_deferred_mcp_tasks.py packages/codex/tests/test_deferred_mcp_tasks_import.py packages/codex/tests/test_deferred_mcp_wire_primitives.py packages/codex/tests/test_deferred_mcp_worker_context.py
      - name: Skip tests
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping tests for non-code changes."

  native-macos-sandbox:
