          PYTHONUNBUFFERED: "1"
        run: make tests
      - name: Skip native macOS sandbox tests
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping native macOS sandbox tests for non-code changes."

  tests-windows:
    if: ${{ !inputs.native_only }}
    needs: native-windows
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && '{"group":"codex-runners","labels":"codex-windows-x64"}' || '"windows-latest"') }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    env:
      OPENAI_API_KEY: fake-for-tests
      PYTEST_ADDOPTS: "-rA"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect code changes
        id: changes
        shell: bash
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # setup-uv v10.3.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Use the shared native build
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/use-native
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --group dev
      - name: Run parallel tests
        id: parallel-tests
        if: steps.changes.outputs.run == 'true'
        run: uv run python packages/codex/scripts/test_native.py --sdk -m pytest -n 8 --dist worksteal -m "not serial" -vv --tb=short -o faulthandler_timeout=180 -o faulthandler_exit_on_timeout=true
      - name: Run serial tests after all workers exit
        if: ${{ !cancelled() && (steps.parallel-tests.outcome == 'success' || steps.parallel-tests.outcome == 'failure') }}
        run: uv run python .github/scripts/run_serial_tests.py
      - name: Skip tests
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping tests for non-code changes."

  build-docs:
    needs: [changes, produce-linux, produce-windows, produce-macos]
    if: >-
      !inputs.native_only &&
      !cancelled() && needs.changes.result == 'success' &&
      ((needs.changes.outputs.code == 'false' && needs.produce-linux.result == 'skipped' &&
      needs.produce-windows.result == 'skipped' && needs.produce-macos.result == 'skipped') ||
      (needs.changes.outputs.code == 'true' && needs.produce-linux.result == 'success' &&
      needs.produce-macos.result == 'success' &&
      ((needs.changes.outputs.windows == 'true' && needs.produce-windows.result == 'success') ||
      (needs.changes.outputs.windows == 'false' && needs.produce-windows.result == 'skipped'))))
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || '"ubuntu-latest"') }}
    timeout-minutes: 100
    env:
      UV_NO_SYNC: "1"
      PYTHONPATH: src:packages/codex/src
      OPENAI_API_KEY: fake-for-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect docs changes
        id: changes
        run: ./.github/scripts/detect-changes.sh docs "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # setup-uv v10.3.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --group dev --no-install-project
      - name: Check documentation imports
        if: steps.changes.outputs.run == 'true'
        run: uv run --no-sync python .github/scripts/check_docs.py --imports-only
      - name: Build docs
        if: steps.changes.outputs.run == 'true'
        run: make build-docs
      - name: Skip docs build
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping docs build for non-docs changes."
