name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-launchd-diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile isolated bootstrap shim
        run: >-
          /usr/bin/clang -O0 -Wall -Wextra
          .github/scripts/standalone-launchd-probe/bootstrap-exec.c
          -o "$RUNNER_TEMP/bootstrap-exec"
      - name: Record launchd behavior and owned cleanup
        run: >-
          python3 -I -S .github/scripts/standalone-launchd-probe/probe.py
          --shim "$RUNNER_TEMP/bootstrap-exec"
          --output "$RUNNER_TEMP/launchd-probe.json"
