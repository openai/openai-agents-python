name: Stock macOS XPC try-receive inspection

on:
  push:
    branches:
      - diagnostics/nov9-stock-xpc-decode-a12
    paths:
      - .github/workflows/stock-xpc-try-receive-inspection.yml

permissions:
  contents: read

jobs:
  inspect-stock-libxpc:
    runs-on: macos-15
    timeout-minutes: 4
    steps:
      - name: Check out the exact diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect the loaded system libxpc from a synthetic process
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          /usr/bin/sw_vers
          /usr/bin/uname -m
          test "$(/usr/bin/sw_vers -productVersion)" = 15.8.2
          test "$(/usr/bin/sw_vers -buildVersion)" = 24H232
          test "$(/usr/bin/uname -m)" = arm64
          test "$(/usr/bin/id -u)" -ne 0
          sdk=$(/usr/bin/xcrun --sdk macosx --show-sdk-path)
          /usr/bin/xcrun --sdk macosx --show-sdk-version
          stub="$sdk/usr/lib/system/libxpc.tbd"
          /usr/bin/shasum -a 256 "$stub"
          if /usr/bin/grep -Eq '[[:space:]]_xpc_pipe_try_receive([,[:space:]]|$)' "$stub"; then
            printf '%s\n' 'sdk_export=xpc_pipe_try_receive'
          else
            printf '%s\n' 'sdk_export=xpc_pipe_try_receive absent'
          fi
          temp_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/stock-xpc-inspection.XXXXXXXX")"
          trap '/bin/rm -rf -- "$temp_dir"' EXIT
          cat > "$temp_dir/probe.c" <<'C'
          #include <xpc/xpc.h>

          int main(void) {
              xpc_object_t value = xpc_bool_create(true);
              xpc_release(value);
              return 0;
          }
          C
          /usr/bin/xcrun --sdk macosx clang -std=c11 -arch arm64 -g -O0 -Wall -Wextra -Werror \
            "$temp_dir/probe.c" -o "$temp_dir/probe"
          cat > "$temp_dir/stock_xpc_observer.py" <<'PY'
          import lldb

          def observe(debugger, command, result, internal_dict):
              target = debugger.GetSelectedTarget()
              process = target.GetProcess()
              frame = process.GetSelectedThread().GetFrameAtIndex(0)
              if (
                  process.GetState() != lldb.eStateStopped
                  or frame.GetFunctionName() != "main"
                  or frame.GetModule().GetFileSpec() != target.GetExecutable()
              ):
                  result.SetError("expected the synthetic executable stopped at main")
                  return

              path = "/usr/lib/system/libxpc.dylib"
              module = target.FindModule(lldb.SBFileSpec(path))
              if not module.IsValid():
                  result.SetError("system libxpc was not loaded")
                  return
              uuid = module.GetUUIDString()
              if not uuid or not module.GetTriple().startswith("arm64"):
                  result.SetError("system libxpc image identity is incomplete")
                  return

              result.AppendMessage(f"loaded_image={path} uuid={uuid} triple={module.GetTriple()}")
              for name in (
                  "xpc_pipe_try_receive",
                  "xpc_pipe_receive",
                  "_xpc_pipe_handle_mig",
                  "xpc_receive_mach_msg_validate_hdr",
                  "_xpc_payload_create_from_mach_msg",
              ):
                  symbol = module.FindSymbol(name, lldb.eSymbolTypeCode)
                  if not symbol.IsValid():
                      result.AppendMessage(f"symbol={name} status=unavailable")
                      continue
                  start = symbol.GetStartAddress()
                  end = symbol.GetEndAddress()
                  address = start.GetFileAddress()
                  size = end.GetFileAddress() - address
                  if (
                      not start.IsValid()
                      or not end.IsValid()
                      or start.GetSection() != end.GetSection()
                      or size < 4
                      or size % 4
                  ):
                      result.AppendMessage(f"symbol={name} status=unknown_extent")
                      continue
                  count = min(size // 4, 192)
                  instructions = target.ReadInstructions(start, count)
                  result.AppendMessage(
                      f"symbol={name} address=0x{address:x} size={size} "
                      f"instructions={instructions.GetSize()} truncated={count < size // 4}"
                  )
                  for instruction in instructions:
                      offset = instruction.GetAddress().GetFileAddress() - address
                      result.AppendMessage(
                          f"  +0x{offset:x} {instruction.GetMnemonic(target)} "
                          f"{instruction.GetOperands(target)} {instruction.GetComment(target)}"
                      )
              result.AppendMessage("historical_abi=unqualified call_attempted=false")

          def __lldb_init_module(debugger, internal_dict):
              debugger.HandleCommand("command script add -f stock_xpc_observer.observe observe-stock-xpc")
          PY
          python3 - "$temp_dir" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          workdir = sys.argv[1]
          command = [
              "/usr/bin/xcrun", "lldb", "--batch", "--no-lldbinit", "--no-use-colors",
              "-o", "settings set target.disable-aslr false",
              "-o", "breakpoint set --name main --shlib probe",
              "-o", "run",
              "-o", "command script import ./stock_xpc_observer.py",
              "-o", "observe-stock-xpc",
              "-o", "process kill",
              "--", f"{workdir}/probe",
          ]
          with subprocess.Popen(command, cwd=workdir, start_new_session=True) as proc:
              try:
                  status = proc.wait(timeout=25)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(proc.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  proc.wait()
                  print("lldb exceeded its 25-second watchdog", flush=True)
                  status = 124
          sys.exit(status if status >= 0 else 128 - status)
          PY
