name: Temporary Codex macOS parity diagnosis

on:
  push:
    branches: [feature/codex-operation-tracing]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 61d97f8f1b0519c7312996c827a46eb5e4b7a1f1
          persist-credentials: false
          sparse-checkout: |
            native/codex/verify_installed.py
            pyproject.toml
            tests/__init__.py
            tests/models/__init__.py
            tests/testing_processor.py
            tests/conftest.py
            tests/models/test_operation_tracing_parity.py
            tests/models/test_codex_mutable_tool_hooks.py
            tests/mcp/__init__.py
            tests/mcp/helpers.py
            tests/mcp/model_compat.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: codex-wheel-macosx_11_0_arm64
          path: ${{ runner.temp }}/codex-wheel
          run-id: 44859239869
          github-token: ${{ github.token }}
      - name: Exercise a fresh installation outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          VERIFIER: ${{ github.workspace }}/native/codex/verify_installed.py
        run: |
          import os, shutil, subprocess, venv
          from pathlib import Path
          wheel, = Path('codex-wheel').glob('*.whl')
          venv.create('codex-venv', with_pip=True)
          python = Path('codex-venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--only-binary=:all:', str(wheel)], check=True)
          shutil.copy2(os.environ['VERIFIER'], 'verify_installed.py')
          subprocess.run([str(python), '-I', 'verify_installed.py', '--output', 'installed.json'], check=True)
      - name: Time the unchanged first parity case and the no-DNS fixture
        working-directory: ${{ runner.temp }}
        env:
          CODEX_TRACING_NATIVE_TEST: '1'
          PARITY_TESTS: ${{ github.workspace }}/tests/models/test_operation_tracing_parity.py
        run: |
          import hashlib, json, os, shutil, subprocess, sys, time
          from pathlib import Path
          python = Path('codex-venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--only-binary=:all:',
                          'pytest>=9.0.3', 'pytest-asyncio', 'opentelemetry-sdk>=1.45.0,<2'], check=True)
          tests = Path(os.environ['PARITY_TESTS'])
          probe = Path('timing_probe.py').resolve()
          probe.write_text('"""Run an installed-wheel parity case with synchronous startup timing only."""\nimport faulthandler\nimport socket\nimport sys\nimport time\nimport pytest\n\n\nclass TimingProbe:\n    @pytest.hookimpl(hookwrapper=True)\n    def pytest_runtest_call(self, item):\n        if \'test_operation_tracing_parity[default-run-default]\' not in item.nodeid:\n            yield\n            return\n        import agents.run_internal.run_loop as run_loop\n        started = time.monotonic()\n        restored = []\n\n        def observe(owner, name):\n            original = getattr(owner, name)\n\n            def timed(*args, **kwargs):\n                before = time.monotonic()\n                print(f\'PROBE {name} entering +{before-started:.3f}s\', flush=True)\n                try:\n                    return original(*args, **kwargs)\n                finally:\n                    print(f\'PROBE {name} leaving duration={time.monotonic()-before:.3f}s\', flush=True)\n            setattr(owner, name, timed)\n            restored.append((owner, name, original))\n\n        observe(socket, \'getfqdn\')\n        observe(item.module._ResponsesFixture, \'__init__\')\n        observe(item.module, \'_model_provider\')\n        observe(item.module, \'tool\')\n        observe(item.module, \'Agent\')\n        observe(run_loop, \'gather_with_cancel\')\n        faulthandler.dump_traceback_later(10, repeat=True)\n        try:\n            yield\n        finally:\n            faulthandler.cancel_dump_traceback_later()\n            for owner, name, original in reversed(restored):\n                setattr(owner, name, original)\n            print(f\'PROBE total={time.monotonic()-started:.3f}s\', flush=True)\n\n\nraise SystemExit(pytest.main([*sys.argv[1:], \'--import-mode=importlib\', \'-q\', \'-s\'], plugins=[TimingProbe()]))\n')
          wheel, = Path('codex-wheel').glob('*.whl')
          receipt = {'source_head': '61d97f8f1b0519c7312996c827a46eb5e4b7a1f1',
                     'artifact_run': 44859239869, 'wheel': wheel.name,
                     'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'cases': []}
          def run_case(label, path):
              command = [str(python), '-I', str(probe),
                         str(path) + '::test_operation_tracing_parity[default-run-default]']
              started = time.monotonic()
              try:
                  result = subprocess.run(command, text=True, stdout=subprocess.PIPE,
                                          stderr=subprocess.STDOUT, timeout=120)
                  code, output = result.returncode, result.stdout
              except subprocess.TimeoutExpired as error:
                  code = 124
                  output = error.stdout or b''
                  if isinstance(output, bytes):
                      output = output.decode(errors='replace')
              Path(label + '.log').write_text(output)
              print('CASE ' + label, flush=True)
              print(output, flush=True)
              receipt['cases'].append({'label': label, 'exit_code': code,
                                       'seconds': time.monotonic() - started,
                                       'command': command})
          run_case('unchanged', tests)
          candidate = Path('no-dns-candidate').resolve()
          candidate.mkdir()
          shutil.copytree(tests.parents[1], candidate / 'tests')
          shutil.copy2(tests.parents[2] / 'pyproject.toml', candidate / 'pyproject.toml')
          patched = candidate / 'tests/models/test_operation_tracing_parity.py'
          source = patched.read_text()
          assert source.count('class _ResponsesFixture:') == 1
          assert source.count('self.server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)') == 1
          source = source.replace('from pathlib import Path\n',
                                  'from pathlib import Path\nfrom socketserver import TCPServer\n')
          source = source.replace('class _ResponsesFixture:',
              'class _LoopbackHTTPServer(ThreadingHTTPServer):\n'
              '    def server_bind(self) -> None:\n'
              '        TCPServer.server_bind(self)\n'
              '        self.server_name, self.server_port = self.server_address[:2]\n\n\n'
              'class _ResponsesFixture:')
          source = source.replace('self.server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)',
                                  'self.server = _LoopbackHTTPServer(("127.0.0.1", 0), Handler)')
          patched.write_text(source)
          run_case('no-dns', patched)
          Path('diagnosis.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: codex-macos-parity-diagnosis-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/installed.json
            ${{ runner.temp }}/diagnosis.json
            ${{ runner.temp }}/unchanged.log
            ${{ runner.temp }}/no-dns.log
          if-no-files-found: warn
          retention-days: 7
