name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "uv.lock"
      - ".github/workflows/docs.yml"

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false
  queue: max

jobs:
  build_docs:
    env:
      UV_NO_SYNC: "1"
      PYTHONPATH: src
    if: github.repository == 'openai/openai-agents-python'
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-python' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || '"ubuntu-latest"') }}
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.docs-deploy.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Determine docs deployment changes
        id: docs-deploy
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./.github/scripts/detect-changes.sh docs-deploy
      - name: Setup uv
        if: steps.docs-deploy.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # setup-uv v10.3.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Install dependencies
        if: steps.docs-deploy.outputs.run == 'true'
        env:
          UV_FROZEN: "1"
        run: uv sync --group dev --no-install-project
      - name: Build docs
        if: steps.docs-deploy.outputs.run == 'true'
        env:
          UV_FROZEN: "1"
        run: make build-docs
      - name: Upload site
        if: steps.docs-deploy.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy_docs:
    needs: build_docs
    if: needs.build_docs.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout published branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: published
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
      - name: Publish static files
        shell: bash
        run: |
          # Copy only static files; keep checkout metadata outside the artifact.
          rsync --recursive --delete --exclude=.git site/ published/
          touch published/.nojekyll
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add --all
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m "Deploy docs for $GITHUB_SHA"
            git -C published push origin HEAD:gh-pages
          fi
