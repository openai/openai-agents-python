name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "uv.lock"

permissions:
  contents: write # This allows pushing to gh-pages

jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Determine docs deployment changes
        id: docs-deploy
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./.github/scripts/detect-changes.sh docs-deploy
      - name: Setup uv
        if: steps.docs-deploy.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # setup-uv v9.0.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Install dependencies
        if: steps.docs-deploy.outputs.run == 'true'
        run: make sync
      - name: Deploy docs
        if: steps.docs-deploy.outputs.run == 'true'
        run: make deploy-docs
