name: Update strict schema regression expectations

on:
  push:
    branches:
      - fix/strict-schema-defaults-4390-current

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-schema-defaults-4390-current
          fetch-depth: 0
      - name: Update assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_function_schema.py')
          text = path.read_text()
          replacements = {
              'assert optional_schema.get("default") == 5.0': 'assert "default" not in optional_schema',
              'assert name_schema.get("default") == "Unknown"': 'assert "default" not in name_schema',
              'assert factor_schema.get("default") == 1.0': 'assert "default" not in factor_schema',
          }
          expected_counts = {
              'assert optional_schema.get("default") == 5.0': 2,
              'assert name_schema.get("default") == "Unknown"': 2,
              'assert factor_schema.get("default") == 1.0': 2,
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != expected_counts[old]:
                  raise SystemExit(f'unexpected count for {old!r}: {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/followup-4529.yml
      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(schema): align strict default expectations"
          git push origin HEAD:fix/strict-schema-defaults-4390-current
