name: Native products for SDK pull requests

on:
  push:
    branches-ignore: [main, feat/codex-harness, ci/benchmark-python-macos-codex-runner-20261105]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  native-only:
    if: github.repository == 'openai/openai-agents-python' && !github.event.deleted && github.ref_name != github.event.repository.default_branch
    uses: ./.github/workflows/tests.yml
    with:
      native_only: true
