name: Native products for SDK pull requests

on:
  push:
    # Ordinary branches build on a cache miss in their PR workflow.
    branches: ['ci/native-bundle/**']

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  native-only:
    if: github.repository == 'openai/openai-agents-python' && !github.event.deleted && github.ref_name != github.event.repository.default_branch
    uses: ./.github/workflows/tests.yml
    with:
      native_only: true
