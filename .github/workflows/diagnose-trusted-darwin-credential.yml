name: Qualify Python trusted Darwin credential isolation

on:
  push:
    branches: [diag/python-trusted-darwin-credential-5688]

permissions:
  contents: read

jobs:
  credential-isolation:
    if: github.repository == 'openai/openai-agents-python'
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: e06a4ca27df0175bf03c37475586d34655976680
      SOURCE_TREE: cef116a1c72559ed8a8bacf751124938e6f6183a
      NATIVE_IDENTITY: c75b6461a3181c836bce2354bb140c960986b264e13a22524b3be490b86e6799
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      MATURIN_PGO: 'false'
      RUSTFLAGS: '-C link-arg=-undefined -C link-arg=dynamic_lookup'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.14'
          enable-cache: false
      - name: Verify and stage the frozen candidate
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH/$(uname -m)" = macOS/ARM64/arm64
          sw_vers
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$SOURCE_COMMIT" HEAD)" = \
            .github/workflows/diagnose-trusted-darwin-credential.yml
          project="$RUNNER_TEMP/agents-native-source/project"
          mkdir -p "$project"
          git archive "$SOURCE_COMMIT" | tar -xf - -C "$project"
          cd "$project"
          python -I -S - <<'PY'
          import os
          import runpy
          from pathlib import Path

          project = Path.cwd()
          tools = runpy.run_path("packages/codex/scripts/source_integrity.py")
          identity = tools["native_bundle_identity"](project)
          assert identity == os.environ["NATIVE_IDENTITY"], identity
          print(f"Source {os.environ['SOURCE_COMMIT']} tree {os.environ['SOURCE_TREE']}")
          print(f"Native build identity {identity}")
          PY
          shasum -a 256 packages/codex/rust/environment.rs \
            packages/codex/tests/test_native_codex_login.py \
            packages/codex/tests/test_native_codex_login_refresh.py
      - uses: ./.github/actions/setup-native
      - name: Build the exact macOS wheel
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/agents-native-source/project"
          dist="$RUNNER_TEMP/credential-wheel"
          mkdir "$dist"
          cd "$project"
          env -u OPENAI_AGENTS_NATIVE_WHEEL \
            CARGO_HOME="$RUNNER_TEMP/agents-cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/agents-native-target" \
            UV_CACHE_DIR="$RUNNER_TEMP/agents-native-uv" \
            OPENAI_AGENTS_NATIVE_RECEIPT_DIR="$dist" \
            uv build --wheel --out-dir "$dist"
      - name: Verify and install the wheel
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/agents-native-source/project"
          stage="$RUNNER_TEMP/credential-probe"
          mkdir -p "$stage/home" "$stage/tmp"
          cd "$project"
          uv export --frozen --group dev --no-emit-workspace --no-hashes \
            --format requirements.txt --output-file "$stage/constraints.txt" > /dev/null
          uv venv --python "$(command -v python)" "$stage/venv"
          probe="$stage/venv/bin/python"
          shopt -s nullglob
          wheels=("$RUNNER_TEMP/credential-wheel"/openai_agents-*.whl)
          test "${#wheels[@]}" -eq 1
          pip_install=(uv pip install --python "$probe" --only-binary :all: --constraint "$stage/constraints.txt")
          "${pip_install[@]}" aiohttp cryptography hatchling pytest pytest-asyncio
          "$probe" -I -B - "${wheels[0]}" <<'PY'
          import runpy
          import sys
          from pathlib import Path

          wheel = Path(sys.argv[1])
          native = Path("packages/codex").resolve()
          hooks = runpy.run_path(str(native / "scripts/hatch_build.py"))
          hooks["_wheel_qualification"](native, wheel)
          print(f"Verified ARM64 wheel {wheel.name} sha256:{hooks['_wheel_digest'](wheel)}")
          PY
          "${pip_install[@]}" "${wheels[0]}"
          "$probe" -I -B - "$(cat packages/codex/CODEX_REVISION)" <<'PY'
          import platform
          import sys
          from pathlib import Path

          import agents
          import agents._native

          assert platform.machine() == "arm64"
          prefix = Path(sys.prefix).resolve()
          assert Path(agents.__file__).resolve().is_relative_to(prefix)
          assert Path(agents._native.__file__).resolve().is_relative_to(prefix)
          assert agents._native.CODEX_REVISION == sys.argv[1]
          print(f"Installed Core revision {agents._native.CODEX_REVISION}")
          PY
      - name: Require both installed Seatbelt selectors to pass
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/agents-native-source/project"
          stage="$RUNNER_TEMP/credential-probe"
          probe="$stage/venv/bin/python"
          tests="$project/packages/codex/tests"
          report="$stage/result.xml"
          cd "$stage"
          env -i PATH="$PATH" HOME="$stage/home" TMPDIR="$stage/tmp" \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 RUST_MIN_STACK=16777216 \
            "$probe" -I -B -m pytest -p pytest_asyncio.plugin \
              -c "$project/pyproject.toml" -o addopts= -o "pythonpath=$project/packages/codex" \
              -vv --junitxml="$report" \
              "$tests/test_native_codex_login.py::test_trusted_macos_requires_saved_login_directory" \
              "$tests/test_native_codex_login_refresh.py::test_trusted_macos_keeps_saved_login_private_during_rotation"
          "$probe" -I -B - "$report" <<'PY'
          import sys
          from xml.etree import ElementTree

          cases = ElementTree.parse(sys.argv[1]).findall(".//testcase")
          assert len(cases) == 2
          assert {case.attrib["name"] for case in cases} == {
              "test_trusted_macos_requires_saved_login_directory",
              "test_trusted_macos_keeps_saved_login_private_during_rotation",
          }
          assert not any(node.tag in {"skipped", "failure", "error"} for case in cases for node in case)
          print("Both installed macOS Seatbelt selectors passed.")
          PY
