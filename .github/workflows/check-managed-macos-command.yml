name: Qualify the final Python SDK wheel on macOS
on:
  push:
    branches: [test/managed-macos-command-qualification-20261104]

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Qualify final Python SDK wheel and tests
    runs-on: macos-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: 1.95.0
      OPENAI_AGENTS_NATIVE_TIMINGS: "1"
      # PEP 517 frontends may copy only the wheel out of the backend directory.
      OPENAI_AGENTS_NATIVE_RECEIPT_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 251946e1d2d84411bab5d2171e14b429b53ed957
          persist-credentials: false
      - name: Verify exact SDK checkout
        run: |
          test "$(git rev-parse HEAD)" = '251946e1d2d84411bab5d2171e14b429b53ed957'
          test "$(git rev-parse HEAD^{tree})" = '2a8e8ffd96cef992c8c9b2aabda3e14f973bc6ae'
          git show -s --format='%H %T %s' HEAD
      - name: Select shared Cargo directories
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-native-target" >> "$GITHUB_ENV"
      - name: Configure Linux dependency registries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME"
          if [[ -e "$CARGO_HOME/config" || -e "$CARGO_HOME/config.toml" ]]; then
            echo "Unexpected Cargo configuration in fresh CI directory." >&2
            exit 1
          fi
          cat > "$CARGO_HOME/config.toml" <<'TOML'
          [source.crates-io]
          replace-with = "socket-firewall"

          [source.socket-firewall]
          registry = "sparse+https://openai.firewall.socket.dev/cargo/"
          TOML
          {
            for variable in NPM_CONFIG_REGISTRY npm_config_registry PNPM_CONFIG_REGISTRY pnpm_config_registry COREPACK_NPM_REGISTRY YARN_NPM_REGISTRY_SERVER BUN_CONFIG_REGISTRY; do
              printf '%s=%s\n' "$variable" 'https://openai.firewall.socket.dev/npm/'
            done
            for variable in UV_DEFAULT_INDEX UV_INDEX_URL PIP_INDEX_URL; do
              printf '%s=%s\n' "$variable" 'https://openai.firewall.socket.dev/pypi/simple/'
            done
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - name: Install native build tools
        # Free Linux disk space before restoring the large dependency cache.
        if: >-
          true ||
          (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        uses: ./.github/actions/setup-native
      - name: Prepare the source distribution
        # Use one stable source path for Cargo, the wheel and the test executor.
        run: |
          uv build --sdist
          python - <<'PYTHON'
          import os
          import tarfile
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "agents-native-source"
          source.mkdir()
          archive_path, = Path("dist").glob("openai_agents-*.tar.gz")
          with tarfile.open(archive_path) as archive:
              archive.extractall(source, filter="data")
          extracted, = source.iterdir()
          project = source / "project"
          extracted.rename(project)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"OPENAI_AGENTS_BUILD_SOURCE={project.resolve()}\n")
          PYTHON
      - name: Restore Rust dependencies
        # Touch the shared cache on default-branch runs, even when reusing a wheel.
        if: >-
          true ||
          (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.OPENAI_AGENTS_BUILD_SOURCE }}/packages/codex/.cache/v8
          key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-macos-latest-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/codex/CODEX_REVISION', 'packages/codex/patches/**', 'packages/codex/rmcp-patches/**') }}-${{ hashFiles('packages/codex/Cargo.lock', 'packages/codex/Cargo.toml', 'packages/codex/scripts/*.py', 'pyproject.toml', '.github/actions/setup-native/action.yml', '.github/workflows/codex-python.yml') }}
          restore-keys: |
            native-deps-v2-${{ runner.os }}-${{ runner.arch }}-macos-latest-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/codex/CODEX_REVISION', 'packages/codex/patches/**', 'packages/codex/rmcp-patches/**') }}-
            native-deps-v2-${{ runner.os }}-${{ runner.arch }}-macos-latest-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Select native build or reuse
        id: native-source
        env:
          NATIVE_SOURCE_RUN: ''
          WARM_SHARED_CACHE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ "$WARM_SHARED_CACHE" == true ]]; then
            echo "Building native dependencies to warm the default-branch cache."
            NATIVE_SOURCE_RUN=''
          fi
          echo "run_id=$NATIVE_SOURCE_RUN" >> "$GITHUB_OUTPUT"
      - name: Download the qualified native build
        if: steps.native-source.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/agents-native-qualified
          github-token: ${{ github.token }}
          run-id: ${{ steps.native-source.outputs.run_id }}
      - name: Select the qualified wheel and test executor
        if: steps.native-source.outputs.run_id != ''
        run: |
          python - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "agents-native-qualified"
          wheel, = source.glob("openai_agents-*.whl")
          name = "exec-server-fixture" + (".exe" if os.name == "nt" else "")
          Path("dist").mkdir(exist_ok=True)
          shutil.copy2(source / name, Path("dist") / name)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"OPENAI_AGENTS_NATIVE_WHEEL={wheel.resolve()}\n")
          PYTHON
      - name: Clear previous compilation timings
        id: clear-timings
        if: steps.native-source.outputs.run_id == ''
        run: |
          python - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path
          timings = Path(os.environ["CARGO_TARGET_DIR"]) / "cargo-timings"
          if timings.exists():
              shutil.rmtree(timings)
          PYTHON
      - name: Build the SDK and native runtime together
        run: uv build --wheel "$OPENAI_AGENTS_BUILD_SOURCE" --out-dir "$GITHUB_WORKSPACE/dist"
      - name: Build the shared test executor
        if: steps.native-source.outputs.run_id == ''
        run: |
          python - <<'PYTHON'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          root = Path(os.environ["OPENAI_AGENTS_BUILD_SOURCE"]) / "packages/codex"
          fixture = Path("tests/fixtures/exec_server.rs")
          (root / fixture).parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(Path("packages/codex") / fixture, root / fixture)
          sys.path.insert(0, str(root / "scripts"))
          from native_env import build_environment, cargo_build_options
          environment = build_environment(root)
          options, build_target = cargo_build_options(root, environment)
          subprocess.run(["cargo", "build", "--release", "--locked", "--timings", *options, "--example", "exec-server-fixture"], cwd=root, env=environment, check=True)
          target = Path(environment["CARGO_TARGET_DIR"])
          if not target.is_absolute():
              target = root / target
          if build_target:
              target /= Path(build_target).stem
          name = "exec-server-fixture" + (".exe" if os.name == "nt" else "")
          shutil.copy2(target / "release" / "examples" / name, Path("dist") / name)
          PYTHON
      - name: Test native macOS Unix socket policy with the installed wheel
        if: runner.os == 'macOS'
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/macos-ipc.XXXXXX")
          mkdir -p "$stage/tests/qualification" "$stage/home"
          cp tests/{__init__,_asyncio,native_executor_fixtures,native_fixtures}.py "$stage/tests"
          cp tests/qualification/{macos_ipc,offline_ipc,unix_socket_command}.py "$stage/tests/qualification"
          uv venv --seed --python "$(command -v python)" "$stage/venv"
          uv export --frozen --group dev --no-emit-workspace --no-hashes \
            --format requirements.txt --output-file "$stage/constraints.txt" > /dev/null
          python="$stage/venv/bin/python"
          "$python" -m pip install --constraint "$stage/constraints.txt" dist/*.whl aiohttp pytest pytest-asyncio
          fixture="$GITHUB_WORKSPACE/dist/exec-server-fixture"
          chmod +x "$fixture"
          cd "$stage"
          env -i PATH=/usr/bin:/bin HOME="$stage/home" SHELL=/bin/sh \
            "$python" -I -B -u -c 'import os,runpy,sys; sys.path.insert(0,os.getcwd()); runpy.run_module("tests.qualification.macos_ipc",run_name="__main__")' "$fixture"
      - name: Run SDK acceptance with the installed wheel
        env:
          OPENAI_API_KEY: fake-for-tests
          CODEX_EXEC_SERVER_TEST_BINARY: ${{ github.workspace }}/dist/exec-server-fixture
          RUST_MIN_STACK: '16777216'
        run: |
          set -eu
          sw_vers
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/python-verified-wheel"
          uv sync --frozen --group dev --no-install-project
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps dist/*.whl
          cat > tests/test_darwin_fresh_alias.py <<'DARWIN_ALIAS_PROBE'
          import os
          import shlex
          import shutil
          import stat
          import sys
          import tempfile
          from pathlib import Path

          import agents
          import pytest
          from agents import Agent, Environment, NativeProvider

          from tests._asyncio import timeout
          from tests.native_fixtures import ResponsesFixture, assistant_output, function_call, responses as responses, tool_output
          from tests.test_native_code_mode import code_call, code_output


          async def test_installed_darwin_helper_alias(responses: ResponsesFixture) -> None:
              assert sys.platform == "darwin"
              site = Path(os.environ["OPENAI_AGENTS_DISPOSABLE_SITE"]).resolve()
              runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
              assert site.is_relative_to(runner_temp)
              helper = (Path(agents.__file__).resolve().parent / "bin" / "codex-code-mode-host").resolve()
              assert helper.is_relative_to(site)
              helper_mode = stat.S_IMODE(helper.stat().st_mode)
              assert helper.stat().st_size > 10_000
              fixed = os.environ.get("OPENAI_AGENTS_EXPECT_HELPER_ALIAS_REJECT") == "1"
              quoted = lambda path: shlex.quote(str(path))

              with tempfile.TemporaryDirectory(prefix="darwin-helper-alias-", dir=site) as root:
                  scratch = Path(root)
                  cwd, overlap, disjoint, store = (scratch / name for name in ("cwd", "overlap", "disjoint", "store"))
                  for directory in cwd, overlap, disjoint, store:
                      directory.mkdir()
                  saved = scratch / "original-host"
                  alias = overlap / "code-mode-host-alias"
                  invocation = scratch / "host-invoked"
                  real = store / "real-host"
                  shutil.copy2(helper, real)
                  assert real.read_bytes() == helper.read_bytes()
                  shim = (
                      f"#!/bin/sh\nprintf %s invoked > {quoted(invocation)}\n"
                      f'exec {quoted(real)} "$@"\n# Marker: '
                  )
                  marker = "r20-inert-helper-marker"
                  helper.rename(saved)
                  try:
                      helper.write_text(shim)
                      helper.chmod(helper_mode)
                      os.link(helper, alias)
                      os.link(helper, store / "outside-store-link")
                      inode, linked = helper.stat(), alias.stat()
                      assert (inode.st_dev, inode.st_ino, inode.st_nlink) == (linked.st_dev, linked.st_ino, 3)
                      print(f"Darwin helper inode {inode.st_dev}:{inode.st_ino}, nlink={inode.st_nlink}")
                      provider = NativeProvider(base_url=responses.url, api_key="synthetic-darwin-alias")

                      def environment(root):
                          return Environment.local(cwd=cwd, writable_roots=[root], tools=["exec_command"])

                      async def run_command(command, root, call_id):
                          responses.respond(function_call("exec_command", {"cmd": command, "login": False}, call_id))
                          responses.respond(assistant_output("done"))
                          agent = Agent(instructions="Work.", provider=provider)
                          async with agent.session(environment=environment(root)) as session:
                              result = await (await session.submit("Run the command.")).get_result()
                              assert result.final_output == "done"
                          return tool_output(responses.requests[-1], call_id)

                      async with timeout(80), provider:
                          proof = disjoint / "ordinary-write"
                          command = (
                              f"if (printf %s direct-write >> {quoted(helper)}); then exit 37; fi; "
                              f"printf %s ordinary > {quoted(proof)}"
                          )
                          output = await run_command(command, disjoint, "disjoint")
                          assert proof.read_text() == "ordinary", output
                          assert helper.read_text() == shim
                          print("Disjoint ordinary write allowed, direct helper path write denied.")

                          if fixed:
                              request_count = len(responses.requests)
                              agent = Agent(instructions="Work.", provider=provider)
                              with pytest.raises(RuntimeError, match="writable roots must stay outside the native helper installation"):
                                  async with agent.session(environment=environment(overlap)):
                                      pytest.fail("Aliased helper grant opened a Session")
                              assert len(responses.requests) == request_count
                              assert helper.read_text() == shim
                              print("Preexisting helper hardlink rejected before the model.")
                          else:
                              proof = overlap / "ordinary-write"
                              status = overlap / "alias-write-result"
                              command = (
                                  f"printf %s ordinary > {quoted(proof)}; "
                                  f"if (printf %s {quoted(marker)} >> {quoted(alias)}); "
                                  f"then printf allowed; else printf denied; fi > {quoted(status)}"
                              )
                              output = await run_command(command, overlap, "alias")
                              assert proof.read_text() == "ordinary", output
                              disposition = status.read_text()
                              assert disposition in ("allowed", "denied")
                              assert helper.read_text() == shim + (marker if disposition == "allowed" else "")
                              print(f"Preexisting helper hardlink write: {disposition}")

                          responses.respond(code_call('text("DARWIN_HOST_SELECTED");', "code"))
                          responses.respond(assistant_output("done"))
                          agent = Agent(instructions="Work.", provider=provider, programmatic_tool_calling=True)
                          async with agent.session(environment=environment(disjoint)) as session:
                              result = await (await session.submit("Run the generated code.")).get_result()
                              assert result.final_output == "done"
                          assert "DARWIN_HOST_SELECTED" in code_output(responses.requests[-1], "code")
                          assert invocation.read_text() == "invoked"
                          print("A later disjoint Code Mode session invoked the selected packaged host.")

                          single_link_shim = scratch / "single-link-shim"
                          single_link_shim.write_text(shim)
                          single_link_shim.chmod(helper_mode)
                          single_link_shim.replace(helper)
                          assert helper.stat().st_nlink == 1
                          before = helper.read_text()
                          new_alias = disjoint / "fresh-hardlink"
                          status = disjoint / "fresh-hardlink-result"
                          fresh_marker = "r20-fresh-inert-marker"
                          command = (
                              f"{{ if test -r {quoted(helper)}; then printf readable; else printf unreadable; fi; "
                              f"if /bin/ln {quoted(helper)} {quoted(new_alias)}; then printf :linked; else printf :refused; fi; "
                              f"if test -e {quoted(new_alias)} && (printf %s {quoted(fresh_marker)} >> {quoted(new_alias)}); "
                              f"then printf :wrote; else printf :unchanged; fi; }} > {quoted(status)}"
                          )
                          output = await run_command(command, disjoint, "fresh-link")
                          assert status.exists(), output
                          disposition = status.read_text()
                          readable, linked, written = disposition.split(":")
                          assert readable in ("readable", "unreadable")
                          assert linked in ("linked", "refused")
                          assert written in ("wrote", "unchanged")
                          assert helper.read_text() == before + (fresh_marker if written == "wrote" else "")
                          if fixed:
                              assert written == "unchanged"
                          print(f"Post-admission helper hardlink: {disposition}")
                  finally:
                      saved.replace(helper)
          DARWIN_ALIAS_PROBE
          printf '%s  %s\n' '459493a90ddf1de2afccc5015c087c91276406f46eb9efcdde585dd747c8c74e' 'tests/test_darwin_fresh_alias.py' | shasum -a 256 -c -
          export OPENAI_AGENTS_EXPECT_HELPER_ALIAS_REJECT=1
          cat > tests/test_darwin_paused_wrapper.py <<'DARWIN_WRAPPER_PROBE'
          """Installed macOS smoke for trusted-wrapper shutdown after a pause."""

          import asyncio
          import json
          import os
          import shlex
          import signal
          import subprocess
          import sys
          import time
          from contextlib import AsyncExitStack, suppress
          from dataclasses import dataclass
          from pathlib import Path

          import pytest
          from tests._asyncio import timeout
          from tests.native_fixtures import (
              ResponsesFixture,
              assistant_output,
              function_call,
              responses as responses,
              tool_output,
          )

          import agents
          from agents import Agent, Environment, NativeProvider


          def _process_details(pid: int) -> tuple[str, str] | None:
              result = subprocess.run(
                  ["/bin/ps", "-ww", "-p", str(pid), "-o", "stat=,uid=,lstart=,command="],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if result.returncode == 1 and not result.stdout and not result.stderr:
                  return None
              result.check_returncode()
              state, uid, identity = result.stdout.strip().split(maxsplit=2)
              if int(uid) != os.geteuid():
                  return None
              return state, identity


          @dataclass(frozen=True)
          class _Process:
              pid: int
              identity: str

              def state(self) -> str | None:
                  details = _process_details(self.pid)
                  return details[0] if details and details[1] == self.identity else None

              def signal_if_current(self, action: signal.Signals) -> None:
                  if self.state() is not None:
                      with suppress(ProcessLookupError):
                          os.kill(self.pid, action)


          def _owned_process(pid: int, command_marker: str) -> _Process:
              assert pid > 1
              details = _process_details(pid)
              assert details is not None and command_marker in details[1], (pid, details)
              return _Process(pid, details[1])


          def _wrapper_process() -> _Process:
              helper = (Path(agents.__file__).resolve().parent / "bin" / "codex-sdk-runtime").resolve()
              prefix = f"{helper} --codex-sdk-darwin-command "
              result = subprocess.check_output(["/bin/ps", "-axww", "-o", "pid=,ppid=,command="], text=True)
              matches = []
              for row in result.splitlines():
                  pid, parent, command = row.split(maxsplit=2)
                  if int(parent) == os.getpid() and command.startswith(prefix):
                      matches.append(int(pid))
              assert len(matches) == 1, matches
              return _owned_process(matches[0], prefix)


          @pytest.mark.skipif(sys.platform != "darwin", reason="requires managed macOS commands")
          @pytest.mark.requires_native_macos_sandbox
          async def test_macos_session_close_drains_paused_wrapper(
              responses: ResponsesFixture, tmp_path: Path
          ) -> None:
              provider = NativeProvider(base_url=responses.url, api_key="synthetic-model-key")
              agent = Agent(instructions="Run the scripted local command.", provider=provider)

              async def start_heartbeat(scope: AsyncExitStack, work: Path) -> tuple[_Process, Path]:
                  await asyncio.to_thread(work.mkdir)
                  marker = work / "heartbeat"
                  pid_file = work / "payload-pid"
                  command = (
                      f'printf "%s\\n" "$$" > {shlex.quote(str(pid_file))}; '
                      'i=0; while [ "$i" -lt 180 ]; do '
                      f"printf x >> {shlex.quote(str(marker))}; /bin/sleep 0.25; i=$((i + 1)); done"
                  )
                  responses.respond(
                      function_call(
                          "exec_command", {"cmd": command, "yield_time_ms": 1000, "login": False}, work.name
                      )
                  )
                  responses.respond(assistant_output(f"{work.name} running"))
                  session = await scope.enter_async_context(
                      agent.session(
                          environment=Environment.local(
                              cwd=work, writable_roots=[work], tools=["exec_command"]
                          )
                      )
                  )
                  turn = await session.submit("Start the bounded heartbeat.")
                  assert (await turn.get_result()).final_output == f"{work.name} running"
                  assert "Process running with session ID" in tool_output(responses.requests[-1], work.name)
                  return _owned_process(int(pid_file.read_text()), str(marker)), marker

              wrapper = payload = disjoint_payload = None
              paused = False
              async with (
                  timeout(38),
                  provider,
                  AsyncExitStack() as owner,
                  AsyncExitStack() as disjoint,
              ):
                  try:
                      payload, marker = await start_heartbeat(owner, tmp_path / "paused")
                      wrapper = _wrapper_process()
                      disjoint_payload, disjoint_marker = await start_heartbeat(
                          disjoint, tmp_path / "disjoint"
                      )
                      wrapper.signal_if_current(signal.SIGSTOP)
                      paused = True
                      async with timeout(2):
                          while not (wrapper.state() or "").startswith("T"):  # noqa: ASYNC110
                              await asyncio.sleep(0.025)
                          before_close = marker.stat().st_size
                          while marker.stat().st_size <= before_close:  # noqa: ASYNC110
                              await asyncio.sleep(0.025)

                      started = time.monotonic()
                      close_error = None
                      try:
                          async with timeout(16):
                              await owner.aclose()
                      except Exception as error:
                          close_error = error
                      duration = time.monotonic() - started
                      wrapper_at_close = wrapper.state()
                      payload_at_close = payload.state()
                      at_close = marker.stat().st_size
                      disjoint_at_close = disjoint_marker.stat().st_size
                      await asyncio.sleep(0.6)
                      after_close = marker.stat().st_size
                      disjoint_after_close = disjoint_marker.stat().st_size
                      print(
                          "Python Darwin paused wrapper",
                          json.dumps(
                              {
                                  "close_error": repr(close_error) if close_error else None,
                                  "close_seconds": duration,
                                  "wrapper_at_close": wrapper_at_close,
                                  "payload_at_close": payload_at_close,
                                  "at_close": at_close,
                                  "after_close": after_close,
                                  "disjoint_at_close": disjoint_at_close,
                                  "disjoint_after_close": disjoint_after_close,
                              }
                          ),
                      )
                      assert close_error is None
                      assert wrapper_at_close is None
                      assert payload_at_close is None
                      assert at_close == after_close
                      assert disjoint_payload.state() is not None
                      assert disjoint_after_close > disjoint_at_close
                      await disjoint.aclose()
                      assert disjoint_payload.state() is None
                      assert len(responses.requests) == 4
                  finally:
                      # A failed assertion must release the exact processes started by this test.
                      if paused and wrapper:
                          wrapper.signal_if_current(signal.SIGCONT)
                      for process in (payload, disjoint_payload):
                          if process:
                              process.signal_if_current(signal.SIGKILL)
