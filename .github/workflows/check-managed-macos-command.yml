name: Qualify the final supervised worker on Linux
on:
  push:
    branches: [test/managed-macos-command-qualification-20261104]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: Run the installed native two-worker flow
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      OPENAI_API_KEY: fake-for-tests
      OPENAI_AGENTS_NATIVE_TESTS: "1"
      OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 41c4733faf008adf7651e6e3981b5b7615c7ed3a
          persist-credentials: false
      - name: Verify the exact integrated worker source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 41c4733faf008adf7651e6e3981b5b7615c7ed3a
          test "$(git rev-parse HEAD^{tree})" = 1a79c3e4e782b17bfef216ba5dcc61029a62d47b
          git show -s --format='%H %T %s' HEAD
          sha256sum examples/supervised_worker/__main__.py tests/test_supervised_worker_{example,supervision}.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
      - name: Download the verified official Linux wheel and fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-Linux-X64
          path: ${{ runner.temp }}/worker-donor
          github-token: ${{ github.token }}
          run-id: 41906563434
      - name: Verify and install the donor without building a package
        run: |
          set -euo pipefail
          donor="$RUNNER_TEMP/worker-donor"
          site="$RUNNER_TEMP/worker-installed"
          proof="$RUNNER_TEMP/worker-proof"
          mkdir -p "$proof"
          wheel="$donor/openai_agents-0.24.0a6-cp310-abi3-manylinux_2_39_x86_64.whl"
          fixture="$donor/exec-server-fixture"
          printf '%s  %s\n' 2742384d7a5109cdd4d38413271afb903c98e53b5b76e8b3fda542bd60764fb5 "$wheel" 84ab26145a8149e8742ea486d40c66ca52d7fdf67ccc629e67801a288986eff5 "$fixture" | tee "$proof/donor-inputs.sha256" | sha256sum --check --strict
          chmod +x "$fixture"
          uv sync --frozen --no-install-project --group dev
          uv pip install --no-deps --python .venv/bin/python --target "$site" "$wheel"
          {
            echo "PYTHONPATH=$site:$GITHUB_WORKSPACE"
            echo "CODEX_EXEC_SERVER_TEST_BINARY=$fixture"
            echo "OPENAI_AGENTS_WORKER_SITE=$site"
          } >> "$GITHUB_ENV"
          printf 'wheel_sdk=%s\nwheel_core=%s\nfixture_source=%s\n' \
            bdffdbaf34c8f6fcbfea38f86bf125a83280c331 cb24aab4e2ab11a1f6488452e0c06a6349993ba1 \
            41c4733faf008adf7651e6e3981b5b7615c7ed3a | tee "$proof/source-provenance.txt"
      - name: Enable the same Linux helper profiles used by the repository tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          helper="$OPENAI_AGENTS_WORKER_SITE/agents/bin/codex-linux-sandbox"
          runtime="$OPENAI_AGENTS_WORKER_SITE/agents/bin/codex-sdk-runtime"
          test -x "$helper"
          test -x "$runtime"
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo tee /etc/apparmor.d/agents-sdk-worker-qualification > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile agents-sdk-worker-fixture "$CODEX_EXEC_SERVER_TEST_BINARY" flags=(unconfined) {
            userns,
          }
          profile agents-sdk-worker-sandbox "$helper" flags=(unconfined) {
            userns,
          }
          profile agents-sdk-worker-runtime "$runtime" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/agents-sdk-worker-qualification
          fi
      - name: Run the maintained real worker acceptance and publish flow
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/worker-proof"
          .venv/bin/python -B - <<'PYTHON'
          import os
          from pathlib import Path

          import agents
          import agents._native
          import agents.session
          from examples.supervised_worker import __main__ as worker

          site = Path(os.environ['OPENAI_AGENTS_WORKER_SITE']).resolve()
          for module in (agents, agents._native, agents.session):
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(site), path
              print(f'Installed module: {path}')
          expected = Path.cwd() / 'examples/supervised_worker/__main__.py'
          assert Path(worker.__file__).resolve() == expected.resolve(), worker.__file__
          print(f'Exact worker example: {worker.__file__}')
          PYTHON
          node=tests/test_supervised_worker_example.py::test_two_workers_revise_reconnect_recover_and_publish_once
          .venv/bin/python -Bu -m pytest -vv -rA --color=no --tb=short -p no:cacheprovider \
            --junitxml="$proof/worker.xml" "$node" 2>&1 | tee "$proof/worker.log"
          .venv/bin/python -IB - "$proof/worker.xml" "${node##*::}" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).findall('.//testcase')
          assert [case.attrib['name'] for case in cases] == [sys.argv[2]], cases
          assert all(cases[0].find(tag) is None for tag in ('skipped', 'failure', 'error'))
          print('Installed two-worker acceptance and publish flow passed unskipped.')
          PYTHON
      - name: Upload the worker-only qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-linux-supervised-worker
          path: ${{ runner.temp }}/worker-proof
          if-no-files-found: ignore
