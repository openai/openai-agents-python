name: Verify queued Darwin wrapper shutdown
on:
  push:
    branches: [test/managed-macos-command-qualification-20261104]

permissions:
  contents: read

jobs:
  core:
    name: Test the queued STARTED frame on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 61991ac259ed05ffe4fc3da8471185d8517d11a3
          persist-credentials: false
      - name: Verify exact source and select shared paths
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = 61991ac259ed05ffe4fc3da8471185d8517d11a3
          test "$(git rev-parse HEAD^{tree})" = b24fe99ccedd69fd0978653f699001a74df983d2
          git show -s --format='%H %T %s' HEAD
          source="$RUNNER_TEMP/agents-native-source/project"
          mkdir -p "$source"
          git archive HEAD | tar -xf - -C "$source"
          {
            echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-native-target"
            echo "OPENAI_AGENTS_BUILD_SOURCE=$source"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-native
      - name: Restore existing native dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.OPENAI_AGENTS_BUILD_SOURCE }}/packages/codex/.cache/v8
          key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-macos-latest-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/codex/CODEX_REVISION', 'packages/codex/patches/**', 'packages/codex/rmcp-patches/**') }}-${{ hashFiles('packages/codex/Cargo.lock', 'packages/codex/Cargo.toml', 'packages/codex/scripts/*.py', 'pyproject.toml', '.github/actions/setup-native/action.yml', '.github/workflows/codex-python.yml') }}
          restore-keys: |
            native-deps-v2-${{ runner.os }}-${{ runner.arch }}-macos-latest-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/codex/CODEX_REVISION', 'packages/codex/patches/**', 'packages/codex/rmcp-patches/**') }}-
            native-deps-v2-${{ runner.os }}-${{ runner.arch }}-macos-latest-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Prepare and verify the exact Core source
        run: |
          set -euo pipefail
          native="$OPENAI_AGENTS_BUILD_SOURCE/packages/codex"
          evidence="$RUNNER_TEMP/darwin-core-proof"
          mkdir -p "$evidence"
          python -IB "$native/scripts/prepare_codex.py"
          python -IB - "$native" <<'PYTHON' | tee "$evidence/core-source.json"
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          sys.path.insert(0, str(root / "scripts"))
          from source_integrity import verify_pristine_source

          source = verify_pristine_source(root)
          expected_tree = "108422bfeff81dbff09e60c72c76efa9e4b0ad51"
          if source["tree"] != expected_tree:
              raise SystemExit(f"Unexpected Core tree: {source['tree']}")
          core = root / ".upstream/codex/codex-rs/exec-server"
          module = core / "src/darwin_command.rs"
          digest = hashlib.sha256(module.read_bytes()).hexdigest()
          if digest != "01774aeb30ae74f52a2210887612e8add709ec4f2d370a746c83ecc2e773b9cf":
              raise SystemExit(f"Unexpected Darwin module SHA256: {digest}")
          print(json.dumps({"sdk": "61991ac259ed05ffe4fc3da8471185d8517d11a3",
                            "core_tree": source["tree"], "module_sha256": digest,
                            "manifest": str(core / "Cargo.toml")}, indent=2))
          PYTHON
      - name: Run the maintained Core shutdown tests
        run: |
          set -euo pipefail
          core="$OPENAI_AGENTS_BUILD_SOURCE/packages/codex/.upstream/codex/codex-rs/exec-server"
          output="$RUNNER_TEMP/darwin-core-proof/cargo-test.log"
          test -f "$core/Cargo.toml"
          grep -F 'async fn shutdown_waits_for_queued_wrapper_identity' "$core/src/darwin_command.rs"
          rustc -vV
          cargo test --manifest-path "$core/Cargo.toml" --release --locked --lib \
            darwin_command::shutdown_tests -- --nocapture 2>&1 | tee "$output"
          grep -F 'test darwin_command::shutdown_tests::shutdown_waits_for_queued_wrapper_identity ... ok' "$output"
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored' "$output"
      - name: Upload Core-only proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-darwin-core-shutdown
          path: ${{ runner.temp }}/darwin-core-proof
          if-no-files-found: ignore
