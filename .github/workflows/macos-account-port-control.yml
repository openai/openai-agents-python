name: macOS account lookup control

on:
  pull_request:
    branches: [feat/codex-harness]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ${{ github.repository == 'openai/openai-agents-python' && 'macos-15' || 'macos-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compare account lookup with the worker port clear
        run: /bin/bash .github/scripts/macos-account-port-control.sh
