name: SDK macOS descendant cleanup control

on:
  push:
    branches: [codex/5688-macos-cli-workspace-control]
    paths: [.github/workflows/macos-cli-workspace-control.yml]

permissions:
  contents: read
  actions: read

jobs:
  owned-descendant:
    if: github.repository == 'openai/openai-agents-python'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: fake-for-tests
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a7e3bf49778c6b7442e6c1b20b8ced0abc5cd192
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.14"
          enable-cache: false
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "13747842037"
          repository: openai/openai-agents-python
          run-id: "42779110007"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/agents-native
          digest-mismatch: error
      - name: Bind the prior qualified Mac build and collect both policy variants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a7e3bf49778c6b7442e6c1b20b8ced0abc5cd192
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          printf 'Baseline SDK %s macOS %s UID %s\n' "$(git rev-parse HEAD)" "$(sw_vers -productVersion)" "$(id -u)"
          artifacts="$RUNNER_TEMP/agents-native"
          chmod +x "$artifacts/exec-server-fixture"
          set -- "$artifacts"/openai_agents-*.whl
          test "$#" -eq 1
          test -f "$1.pristine.json"
          export OPENAI_AGENTS_NATIVE_WHEEL="$1"
          export CODEX_EXEC_SERVER_TEST_BINARY="$artifacts/exec-server-fixture"
          make sync

          patch_file="$RUNNER_TEMP/trusted-macos-owned-descendant.patch"
          cat > "$patch_file" <<'PATCH_EOF'
          --- a/packages/codex/tests/test_native_executor_local.py
          +++ b/packages/codex/tests/test_native_executor_local.py
          @@ -17,7 +17,7 @@
           from datetime import datetime, timezone
           from pathlib import Path, PurePosixPath
           from tempfile import TemporaryDirectory
          -from typing import Any
          +from typing import Any, Literal
           from uuid import uuid4
           
           import pytest
          @@ -1552,8 +1552,11 @@
           
           @pytest.mark.skipif(sys.platform != "darwin", reason="requires macOS Seatbelt")
           @pytest.mark.requires_native_macos_sandbox
          +@pytest.mark.parametrize("write_policy", ["strict", "trusted_workspace_write"])
           async def test_macos_session_close_stops_child_after_command_exit(
          -    responses: ResponsesFixture, tmp_path: Path
          +    responses: ResponsesFixture,
          +    tmp_path: Path,
          +    write_policy: Literal["strict", "trusted_workspace_write"],
           ) -> None:
               cwd, extra = tmp_path / "cwd", tmp_path / "extra"
               cwd.mkdir()
          @@ -1588,7 +1591,9 @@
               responses.respond(assistant_output("parent exited"))
               provider = NativeProvider(base_url=responses.url, api_key="synthetic-model-key")
               agent = Agent(instructions="Use the selected tools.", provider=provider)
          -    environment = Environment.local(cwd=cwd, writable_roots=[extra], tools=["exec_command"])
          +    environment = Environment.local(
          +        cwd=cwd, writable_roots=[extra], tools=["exec_command"], write_policy=write_policy
          +    )
               # The fixture's 30-second self-exit must never satisfy this test.
               async with timeout(25), provider:
                   try:
          PATCH_EOF
          printf '%s  %s\n' '57033c9418d1b54a641128624fa8a0a57de625939a287535c798432acaba4f81' "$patch_file" | shasum -a 256 -c
          git apply --check "$patch_file"
          git apply "$patch_file"
          uv run --no-sync python packages/codex/scripts/test_native.py --sdk -m pytest -rA -vv \
            --junitxml="$RUNNER_TEMP/macos-owned-descendant.xml" \
            packages/codex/tests/test_native_executor_local.py::test_macos_session_close_stops_child_after_command_exit
          python - <<'PYTEST_RESULT'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "macos-owned-descendant.xml")
          cases = report.findall(".//testcase")
          prefix = "test_macos_session_close_stops_child_after_command_exit"
          expected = {f"{prefix}[strict]", f"{prefix}[trusted_workspace_write]"}
          assert len(cases) == 2 and {case.attrib["name"] for case in cases} == expected
          assert all(len(case) == 0 for case in cases), "A required cleanup control did not pass"
          print("Both strict and trusted managed descendant cleanup controls passed")
          PYTEST_RESULT
