name: Validate view image 4417

on:
  push:
    branches:
      - fix/view-image-extra-path-grants

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.14
          python-version: '3.12'
      - run: make sync
      - run: uv run ruff format --check src/agents/sandbox/capabilities/tools/view_image.py tests/sandbox/capabilities/test_view_image_tool.py
      - run: uv run ruff check src/agents/sandbox/capabilities/tools/view_image.py tests/sandbox/capabilities/test_view_image_tool.py
      - run: uv run pytest -q tests/sandbox/capabilities/test_view_image_tool.py
