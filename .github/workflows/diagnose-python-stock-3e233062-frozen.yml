name: Private installed stock Python 3e233062
on:
  push:
    branches: [diag/python-stock-3e233062-frozen]
    paths: [.github/workflows/diagnose-python-stock-3e233062-frozen.yml]
permissions:
  contents: read
  actions: read
jobs:
  stock-installed:
    if: github.repository == 'openai/openai-agents-python'
    runs-on: macos-15
    timeout-minutes: 16
    defaults:
      run:
        shell: bash
    env:
      WORKFLOW_PATH: .github/workflows/diagnose-python-stock-3e233062-frozen.yml
    steps:
      - name: Record untouched runner account before checkout or preparation
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'stock-python'
          root.mkdir(mode=0o700)
          files = json.loads('{"artifact.json": "", "check_dependencies.py": "", "dependency-source-proof.json": "", "fixture.patch": "", "run.sh": "", "selectors.txt": "", "verify.py": ""}')
          checksums = json.loads('{"artifact.json": "fd7c9fdc1f860b99df867aa151cb105607b17fb1d0ecfd2f52515354212aa8b1", "check_dependencies.py": "c6e8c37dfa44e909d80904cb3905a1d1815ec79f0c227a647315a6d222d918cd", "dependency-source-proof.json": "1a57d36db420432dec83c23847e652a2ff0d060aecc98c1b29af0f484d3ae1bb", "fixture.patch": "a5c81ddb0430b4222b0f817913e6666a61af65bc5e5773c5f0069100e00ea1bf", "run.sh": "6930ac61ec19b7d03b33dbcf89ae2cea78b9c4a2965988e4c60b4221efb11eb8", "selectors.txt": "7e7028e657fddb877a12983dc0dee808a3308a42a01380a0ef5f5989b78ea4c7", "verify.py": "5a18583b6afc6ac34fed40aae02cbf01e5f6229665a3a209b583ba15fc526290"}')
          for name, encoded in files.items():
              value = base64.b64decode(encoded, validate=True)
              assert hashlib.sha256(value).hexdigest() == checksums[name]
              (root / name).write_bytes(value)
          PY
          python3 -I -B "$RUNNER_TEMP/stock-python/verify.py" before
          sw_vers > "$RUNNER_TEMP/stock-python/os.txt"
          uname -m >> "$RUNNER_TEMP/stock-python/os.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.14'
          enable-cache: false
      - name: Verify exact signed product parent and reviewed test-only overlay
        run: python3 -I -B "$RUNNER_TEMP/stock-python/verify.py" prepare
      - name: Download only the exact official matching snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B "$RUNNER_TEMP/stock-python/verify.py" download
      - name: Verify wheel receipt and source bytes
        run: python3 -I -B "$RUNNER_TEMP/stock-python/verify.py" media
      - name: Run the installed stock fixture and original containment controls
        timeout-minutes: 8
        run: bash "$RUNNER_TEMP/stock-python/run.sh"
      - name: Compare the untouched account database even after failure
        if: always()
        run: python3 -I -B "$RUNNER_TEMP/stock-python/verify.py" after
      - name: Preserve sanitized outcomes and exact receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stock-python-3e233062-receipts
          path: |
            ${{ runner.temp }}/stock-python/*.json
            ${{ runner.temp }}/stock-python/*.txt
            ${{ runner.temp }}/stock-python/*.xml
            ${{ runner.temp }}/stock-python/*.log
            ${{ runner.temp }}/stock-python/*.exit
          if-no-files-found: error
