name: Qualify PyPy native wheel

on:
  push:
    branches: [feat/codex-harness]
    paths: [.github/workflows/codex-python-pypy-qualify.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypy311-linux-x64:
    if: >-
      github.repository == 'openai/openai-agents-python' &&
      github.ref == 'refs/heads/feat/codex-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      MATURIN_PGO: 'false'
      OPENAI_AGENTS_NATIVE_MANYLINUX: manylinux_2_39
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: pypy3.11-v8.0.1
          architecture: x64
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          enable-cache: false
      - uses: ./.github/actions/setup-native
      - name: Pin the build and consumer interpreter
        run: |
          python -I - <<'PYTHON'
          import os
          import platform
          import sys
          from pathlib import Path
          assert platform.python_implementation() == 'PyPy'
          assert sys.version_info[:3] == (3, 11, 17)
          assert sys.implementation.version[:3] == (8, 0, 1)
          assert platform.machine() == 'x86_64'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'PYPY_EXECUTABLE={Path(sys.executable).resolve()}\n')
          PYTHON
      - name: Install pinned native build dependencies
        run: |
          uv venv --python "$PYPY_EXECUTABLE" .venv
          "$PYPY_EXECUTABLE" -I - <<'PYTHON' > "$RUNNER_TEMP/pypy-build-requirements.txt"
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path('uv.lock').read_text())['package']
          for name in ('maturin', 'hatchling'):
              versions = {item['version'] for item in packages if item['name'] == name}
              assert len(versions) == 1, (name, versions)
              version, = versions
              if name == 'maturin':
                  assert version == '1.16.0'
              print(f'{name}=={version}')
          print('patchelf==0.19.1')
          PYTHON
          uv pip install --python .venv/bin/python --requirement "$RUNNER_TEMP/pypy-build-requirements.txt"
          printf '%s\n' "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build the release-profile SDK wheel
        run: |
          .venv/bin/python -I - <<'PYTHON'
          import sys
          assert sys.implementation.name == 'pypy'
          assert sys.version_info[:3] == (3, 11, 17)
          PYTHON
          env -u OPENAI_AGENTS_NATIVE_WHEEL .venv/bin/python -m hatchling build --target wheel --directory dist
          .venv/bin/python -I - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          wheel, = Path('dist').glob('openai_agents-*-pp311-pypy311_pp80-manylinux_2_39_x86_64.whl')
          receipt = json.loads(wheel.with_name(wheel.name + '.pristine.json').read_text())
          assert receipt['native_build']['profile'] == 'release'
          assert receipt['native_build']['pgo'] is False
          with wheel.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == receipt['wheel_sha256']
          PYTHON
      - name: Verify an isolated PyPy installation with the existing public fixture
        run: |
          consumer="$RUNNER_TEMP/pypy-wheel-consumer"
          uv venv --python "$PYPY_EXECUTABLE" "$consumer"
          # PyPy needs the source distribution for rpds-py. The consumer uses
          # wheel metadata requirements and records its independently resolved dependencies.
          uv pip install --python "$consumer/bin/python" dist/*.whl
          mkdir -p qualification
          uv pip freeze --python "$consumer/bin/python" > qualification/installed-requirements.txt
          "$consumer/bin/python" -I - <<'PYTHON'
          import sys
          assert sys.implementation.name == 'pypy'
          assert sys.version_info[:3] == (3, 11, 17)
          PYTHON
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u OPENAI_AGENTS_NATIVE_WHEEL -u OPENAI_API_KEY \
            -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u http_proxy -u https_proxy \
            "$consumer/bin/python" -I "$GITHUB_WORKSPACE/packages/codex/scripts/verify_installed.py" \
            --output "$GITHUB_WORKSPACE/qualification/installed-pypy311.json"
      - name: Retain separate qualification artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-PyPy311-Linux-X64
          path: |
            dist/*.whl
            dist/*.pristine.json
            qualification/installed-pypy311.json
            qualification/installed-requirements.txt
          if-no-files-found: error
          retention-days: 7
