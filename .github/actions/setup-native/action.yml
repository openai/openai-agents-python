name: Native SDK build tools
description: Install the toolchain and system dependencies for the embedded Codex build.
runs:
  using: composite
  steps:
    - name: Free space for native compilation
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet
        df -h /
    - name: Install Rust
      shell: bash
      run: rustup toolchain install 1.95.0 --profile minimal
    - name: Install matching LLVM profile tools
      if: env.MATURIN_PGO == 'true'
      shell: bash
      run: rustup component add llvm-tools --toolchain 1.95.0
    - name: Linux build tools
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../scripts/install-linux-native-build-tools.sh"
    - name: macOS build tools
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake pkgconf protobuf openssl@3
    - name: Windows build tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($attempt in 1..2) {
          choco install protoc --yes --no-progress
          $installExit = $LASTEXITCODE
          # Chocolatey can return zero even when it did not install protoc.
          if ($installExit -eq 0 -and (Get-Command protoc.exe -CommandType Application -ErrorAction SilentlyContinue)) {
            protoc.exe --version
            exit $LASTEXITCODE
          }
          if ($attempt -eq 1) { Start-Sleep -Seconds 5 }
        }
        if ($installExit -ne 0) { exit $installExit }
        throw 'Chocolatey did not make protoc.exe available after two attempts.'
