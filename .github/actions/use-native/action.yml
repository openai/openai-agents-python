name: Use the shared native build
description: Reuse a verified native wheel and test executor without compiling Rust.
inputs:
  source-run:
    description: Workflow run with the selected native snapshots.
    default: ''
  snapshots:
    description: Verified native snapshot IDs, digests and provenance by platform.
    default: ''
runs:
  using: composite
  steps:
    - name: Download a selected native snapshot
      if: inputs.source-run != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NATIVE_SOURCE_RUN: ${{ inputs.source-run }}
        NATIVE_ARTIFACTS: ${{ inputs.snapshots }}
        SNAPSHOT_DIRECTORY: ${{ runner.temp }}/agents-native
      run: python -I -S .github/scripts/download-native-snapshot.py
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: inputs.source-run == ''
      with:
        name: native-${{ runner.os }}-${{ runner.arch }}
        path: ${{ runner.temp }}/agents-native
    - name: Select native artifacts
      shell: bash
      run: |
        python - <<'PY'
        import os
        import shutil
        from pathlib import Path

        artifacts = Path(os.environ["RUNNER_TEMP"]) / "agents-native"
        wheel, = artifacts.glob("openai_agents-*.whl")
        name = "exec-server-fixture" + (".exe" if os.name == "nt" else "")
        executor = Path(os.environ["GITHUB_WORKSPACE"]) / "packages/codex/target/debug/examples" / name
        executor.parent.mkdir(parents=True, exist_ok=True)
        shutil.copy2(artifacts / name, executor)
        executor.chmod(executor.stat().st_mode | 0o111)
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
            output.write(f"OPENAI_AGENTS_NATIVE_WHEEL={wheel.resolve()}\n")
            output.write(f"CODEX_EXEC_SERVER_TEST_BINARY={executor.resolve()}\n")
        PY
