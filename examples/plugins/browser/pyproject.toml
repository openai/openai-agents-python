[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-browser"
version = "0.1.3"
description = "App-approved browser reads for the Agents SDK"
requires-python = ">=3.10"
dependencies = ["openai-agents==0.25.0+plugins.preview.2"]
readme = "README.md"

[project.optional-dependencies]
playwright = ["playwright>=1.65,<2"]
