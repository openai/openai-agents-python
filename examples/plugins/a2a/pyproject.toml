[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-specialist"
version = "0.2.0"
description = "Agent2Agent specialist delegation with per-call approval"
requires-python = ">=3.10"
dependencies = ["openai-agents==0.25.0+plugins.preview.1", "a2a-sdk>=1.3,<2", "protobuf>=6.33.5"]
readme = "README.md"

[project.optional-dependencies]
example = ["aiohttp>=3.14.3,<4"]
