site_name: OpenAI Agents SDK
site_description: Build Python agents with the native Codex harness.
docs_dir: docs/sdk
repo_name: openai/openai-agents-python
repo_url: https://github.com/openai/openai-agents-python
edit_uri: edit/feat/codex-harness/docs/sdk/
theme:
  name: material
  palette:
    primary: black
  features:
    - content.code.copy
    - navigation.sections
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            heading_level: 3
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Get started:
      - Installation: installation.md
      - Quickstart: index.md
      - Core concepts: concepts.md
      - Choose how to run your agent: choosing.md
  - Build:
      - Task recipes: recipes.md
      - Tools: tools.md
      - MCP servers: mcp.md
      - Conversations and streaming: sessions.md
      - Save and restore state: state.md
      - Configuration: configuration.md
      - Custom Responses endpoints: providers.md
  - Control work:
      - Command execution: execution.md
      - Approvals and manual results: approvals.md
      - Delegate work: delegation.md
  - Test and operate:
      - Testing: testing.md
      - Usage and tracing: observability.md
      - Troubleshooting: troubleshooting.md
      - Releases and documentation: versions.md
  - API reference: reference.md
